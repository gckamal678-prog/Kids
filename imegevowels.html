<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>स्वर वर्ण (चित्र सहित) - पाठशाला</title>
    <meta name="theme-color" content="#ff9933">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 15px auto;
        }
        h2 { color: #d35400; margin: 0; font-size: 18px; }
        .home-btn {
            background-color: #e67e22;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: auto;
        }
        .card {
            background-color: #ffffff;
            color: #2c3e50;
            border: 3px solid #27ae60;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active {
            background-color: #e8f8f5;
            transform: scale(0.95);
        }
        .card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .text-content {
            font-size: 20px;
            font-weight: bold;
            color: #c0392b;
        }
    </style>
    <script>
        function speakNepali(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ne-NP';
            speech.rate = 0.85;
            speech.pitch = 1.1;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>स्वर वर्ण (अ-अः)</h2>
    </div>

    <div class="grid-container" id="vowelsGrid"></div>

    <script>
        // नेपाली स्वर वर्ण, शब्द र तस्बिरहरूको डेटा
        const vowelsData = [
            { letter: 'अ', word: 'अनार', img: 'https://upload.wikimedia.org/wikipedia/commons/2/2e/Pomegranate_juicy_imal.jpg' },
            { letter: 'आ', word: 'आँप', img: 'https://upload.wikimedia.org/wikipedia/commons/9/90/Hapus_Mango.jpg' },
            { letter: 'इ', word: 'इँटा', img: 'https://upload.wikimedia.org/wikipedia/commons/7/77/Bricks_stack.jpg' },
            { letter: 'ई', word: 'ईश्वर', img: 'https://upload.wikimedia.org/wikipedia/commons/5/53/Om_symbol.svg' },
            { letter: 'उ', word: 'उखु', img: 'https://upload.wikimedia.org/wikipedia/commons/8/87/Sugarcane_field_in_Taiwan.jpg' },
            { letter: 'ऊ', word: 'ऊन', img: 'https://upload.wikimedia.org/wikipedia/commons/3/34/Wool_ball_and_knitting_needles.jpg' },
            { letter: 'ऋ', word: 'ऋषि', img: 'https://upload.wikimedia.org/wikipedia/commons/2/24/Rishi_illustration.jpg' },
            { letter: 'ए', word: 'एकता', img: 'https://upload.wikimedia.org/wikipedia/commons/2/29/Unity_hands.svg' },
            { letter: 'ऐ', word: 'ऐना', img: 'https://upload.wikimedia.org/wikipedia/commons/6/69/Mirror_icon.svg' },
            { letter: 'ओ', word: 'ओखर', img: 'https://upload.wikimedia.org/wikipedia/commons/c/c8/Walnut_-_whole_and_piece.jpg' },
            { letter: 'औ', word: 'औषधि', img: 'https://upload.wikimedia.org/wikipedia/commons/2/21/Pills_and_blister_packs.jpg' },
            { letter: 'अं', word: 'अंगुर', img: 'https://upload.wikimedia.org/wikipedia/commons/b/bb/Grapes_white_background.jpg' },
            { letter: 'अः', word: 'खाली', img: 'https://upload.wikimedia.org/wikipedia/commons/3/35/Blank_icon.svg' }
        ];

        const vowelsGrid = document.getElementById('vowelsGrid');

        vowelsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${item.img}" alt="${item.word}" loading="lazy">
                <div class="text-content">${item.letter} - ${item.word}</div>
            `;
            // कार्ड थिच्दा उच्चारण गर्ने
            card.addEventListener('click', () => speakNepali(`${item.letter}, ${item.word}`));
            vowelsGrid.appendChild(card);
        });
    </script>

</body>
</html>
