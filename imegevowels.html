<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>स्वर वर्ण - पाठशाला</title>
    <meta name="theme-color" content="#4CAF50">
    <!-- Child-friendly Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 100%);
            margin: 0;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #FFFFFF;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #2E7D32; 
            margin: 0; 
            font-size: 20px; 
            font-weight: 800;
        }
        .home-btn {
            background-color: #4CAF50;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 3px 0 #2E7D32;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: auto;
        }

        /* 3D Soft Card Style */
        .card {
            background-color: #FFFFFF;
            color: #2E7D32;
            border: 3px solid #A5D6A7;
            border-radius: 18px;
            padding: 15px 10px;
            box-shadow: 0 6px 0 #43A047, 0 8px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #43A047, 0 3px 6px rgba(0,0,0,0.1);
            background-color: #E8F5E9;
        }

        /* Large Emoji Style */
        .emoji-box {
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .letter-title {
            font-size: 24px;
            font-weight: 800;
            color: #1B5E20;
            line-height: 1.2;
        }

        .word-title {
            font-size: 16px;
            font-weight: 700;
            color: #2E7D32;
        }
    </style>
    <script>
        function speakNepali(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ne-NP';
            speech.rate = 0.85;
            speech.pitch = 1.1;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>स्वर वर्ण (अ-अः)</h2>
    </div>

    <div class="grid-container" id="vowelsGrid"></div>

    <script>
        // नेपाली स्वर वर्ण Data (अ देखि अः सम्म)
        const vowelsData = [
            { letter: 'अ', word: 'अनार', emoji: '🫒' },
            { letter: 'आ', word: 'आमा', emoji: '👩' },
            { letter: 'इ', word: 'इँटा', emoji: '🧱' },
            { letter: 'ई', word: 'ईश्वर', emoji: '🕉️' },
            { letter: 'उ', word: 'उखु', emoji: '🎋' },
            { letter: 'ऊ', word: 'ऊन', emoji: '🧶' },
            { letter: 'ऋ', word: 'ऋषि', emoji: '🧘' },
            { letter: 'ए', word: 'एकता', emoji: '🤝' },
            { letter: 'ऐ', word: 'ऐना', emoji: '🪞' },
            { letter: 'ओ', word: 'ओखर', emoji: '🧅' },
            { letter: 'औ', word: 'औषधि', emoji: '💊' },
            { letter: 'अं', word: 'अङ्गुर', emoji: '🍇' },
            { letter: 'अः', word: 'खाली', emoji: '✨' }
        ];

        const vowelsGrid = document.getElementById('vowelsGrid');

        vowelsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="emoji-box">${item.emoji}</div>
                <div class="letter-title">${item.letter}</div>
                <div class="word-title">${item.word}</div>
            `;
            card.addEventListener('click', () => {
                if(item.word === 'खाली') {
                    speakNepali(item.letter);
                } else {
                    speakNepali(`${item.letter} बाट ${item.word}`);
                }
            });
            vowelsGrid.appendChild(card);
        });
    </script>

</body>
</html>
