<!DOCTYPE html>
<html lang="ne">
<head>
    <!-- PWA Manifest र Icon कन्फिगरेसन -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2980b9">
<link rel="apple-touch-icon" href="pathsala.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बाल कथाहरू र गीतहरू</title>
    <style>
        body { text-align: center; background: #f0f4f8; font-family: sans-serif; padding: 20px; margin: 0; }
        h2 { color: #2980b9; }
        .story-box { background: white; max-width: 500px; margin: 20px auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); line-height: 1.8; font-size: 18px; color: #333; }
        .btn { padding: 10px 20px; font-size: 16px; font-weight: bold; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn-play { background: #27ae60; }
        .home-link { display: inline-block; margin-top: 20px; text-decoration: none; color: white; background: #2980b9; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>📖 बाल कथाहरू र रमाइलो गीत</h2>

    <div class="story-box" id="rhymeText">
        <h3>🎵 एउटा चरी रुखमा बस्यो</h3>
        <p>
            चरी उड्यो आकाशमा,<br>
            खुसी छ यो संसारमा!<br>
            फूल फुले बगैंचामਾ,<br>
            रमाइलो छ हाम्रो गाउँमा।
        </p>
    </div>

    <!-- अडियो नियन्त्रण बटनहरू -->
    <button class="btn btn-play" onclick="playRhyme()">🔊 गीत सुन्नुहोस्</button>
    <button class="btn" onclick="stopRhyme()">⏹️ बन्द गर्नुहोस्</button>

    <br><br>
    <div>
        <a href="index.html" class="home-link">🏠 होमपेजमा फर्कनुहोस्</a>
    </div>

    <script>
        // गीत स्वतः बोल्ने फंक्सन
        function playRhyme() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // पहिल्यै बोलिरहेको भए रोक्ने
                let text = "चरी उड्यो आकाशमा, खुसी छ यो संसारमा! फूल फुले बगैंचामा, रमाइलो छ हाम्रो गाउँमा।";
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ne-NP'; // नेपाली भाषा
                utterance.rate = 0.9; // बोल्ने गति अलि बिस्तारै (बालबालिकाको लागि उपयुक्त)
                window.speechSynthesis.speak(utterance);
            } else {
                alert('तपाईंको ब्राउजरले यो फिचर सपोर्ट गरेन।');
            }
        }

        function stopRhyme() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        // पेज खुल्नेबित्तिकै (Auto-play) गीत आफैं सुरु हुने
        window.onload = function() {
            setTimeout(playRhyme, 1000); // पेज लोड भएको १ सेकेन्डपछि आफैं बोल्छ
        };
    </script>

</body>
</html>
