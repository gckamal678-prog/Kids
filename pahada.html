<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>गणित पाहाडा - पाठशाला</title>
    <meta name="theme-color" content="#6C5CE7">
    <!-- Google Fonts for Playful Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', 'Fredoka', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F3F0FF 0%, #E8E3FF 100%);
            margin: 0;
            padding: 12px;
            text-align: center;
            min-height: 100vh;
        }

        /* Modern Modern Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 750px;
            margin: 0 auto 16px auto;
            background: #FFFFFF;
            padding: 10px 18px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.12);
        }
        h2 { 
            color: #2D3436; 
            margin: 0; 
            font-size: 22px; 
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .home-btn {
            background: linear-gradient(135deg, #6C5CE7, #8E7CFF);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 4px 0 #4B38B3;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .home-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #4B38B3;
        }

        /* Modern Tabs Container */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .tab-btn {
            background-color: #FFFFFF;
            color: #636E72;
            border: 2px solid #DFE6E9;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #DFE6E9;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .tab-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #DFE6E9;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #00B894, #00CEC9);
            color: white;
            border-color: #00B894;
            box-shadow: 0 4px 0 #00876C;
        }
        .tab-btn.active:active {
            box-shadow: 0 1px 0 #00876C;
        }

        /* Vibrant Table Section Wrapper */
        .table-section {
            display: none;
            overflow-x: auto;
            max-width: 750px;
            margin: auto;
            background: #FFFFFF;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.15);
            border: 3px solid #6C5CE7;
        }
        .table-section.active {
            display: block;
        }

        /* Playful & Clean Table Styling */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 3px;
            font-size: 15px;
            font-family: 'Fredoka', 'Mukta', monospace;
            font-weight: 700;
        }
        th {
            background: linear-gradient(135deg, #6C5CE7, #A29BFE);
            color: #FFFFFF;
            padding: 10px 6px;
            font-weight: 800;
            border-radius: 8px;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            font-size: 14px;
        }
        td {
            background-color: #F8F9FA;
            border: 1px solid #E9ECEF;
            border-radius: 8px;
            padding: 9px 4px;
            text-align: center;
            color: #2D3436;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            font-size: 15px;
        }
        /* Touch / Active Effects */
        td:hover {
            background-color: #E0E7FF;
            color: #4C51BF;
        }
        td:active {
            background-color: #FF7675 !important;
            color: #FFFFFF !important;
            transform: scale(0.94);
            border-color: #D63031;
        }

        /* Sticky First Column for better Mobile Scrolling */
        td:first-child {
            background-color: #FFF3BF;
            color: #D9480F;
            font-weight: 800;
        }
    </style>

    <!-- ElevenLabs को लागि script.js जोडिएको -->
    <script src="script.js"></script>
</head>
<body>
    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>गणित पाहाडा</h2>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchSection('part1', event)">१ - १० सम्मका पाहाडा</button>
        <button class="tab-btn" onclick="switchSection('part2', event)">११ - २० सम्मका पाहाडा</button>
    </div>

    <!-- भाग १: १ देखि १० सम्म -->
    <div class="table-section active" id="part1">
        <table id="table1"></table>
    </div>

    <!-- भाग २: ११ देखि २० सम्म -->
    <div class="table-section" id="part2">
        <table id="table2"></table>
    </div>

    <script>
        function generateTableData(startNum, tableElementId) {
            const table = document.getElementById(tableElementId);
            
            // Header row (कॉलम हेडर्स)
            let headerRow = '<tr>';
            for (let c = 0; c < 10; c++) {
                let n = startNum + c;
                headerRow += `<th>${n} को पाहाडा</th>`;
            }
            headerRow += '</tr>';
            table.innerHTML = headerRow;

            // Rows (१० वटा पङ्क्तिहरू)
            for (let r = 1; r <= 10; r++) {
                let row = '<tr>';
                for (let c = 0; c < 10; c++) {
                    let n = startNum + c;
                    let cellText = "";
                    
                    if (c === 0) {
                        cellText = `${n}*${r}=${n * r}`;
                    } else {
                        cellText = `${n * r}`;
                    }
                    
                    // playAIVoice प्रयोग गरिएको
                    row += `<td onclick="playAIVoice('${cellText}')">${cellText}</td>`;
                }
                row += '</tr>';
                table.innerHTML += row;
            }
        }

        // टेबलहरू लोड गर्ने
        generateTableData(1, 'table1');   // १ देखि १० सम्म
        generateTableData(11, 'table2');  // ११ देखि २० सम्म

        function switchSection(partId, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.table-section').forEach(sec => sec.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(partId).classList.add('active');
        }
    </script>
</body>
</html>
