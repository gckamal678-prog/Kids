<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गन्ती र गणित खेल - Kids Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333;
            --header-bg: #ffffff;
            --box-bg: #ffffff;
            --nav-bg: #2c3e50;
            --nav-text: #ffffff;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --header-bg: #1e1e1e;
            --box-bg: #1e1e1e;
            --nav-bg: #1a1a1a;
            --nav-text: #ffffff;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; padding: 0 0 70px 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }
        
        .top-header { text-align: center; padding: 15px; }
        
        .main-container { max-width: 600px; width: 100%; margin: 0 auto; padding: 0 15px; flex: 1; text-align: center; }
        
        .game-card { background: var(--box-bg); border: 2px solid #3498db; border-radius: 15px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-top: 10px; }
        
        .question-box { font-size: 26px; font-weight: bold; margin-bottom: 20px; color: #2980b9; }
        
        .emoji-display { font-size: 40px; margin: 15px 0; letter-spacing: 5px; }
        
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        
        .option-btn { background: #3498db; color: white; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .option-btn:hover { background: #2980b9; transform: scale(1.02); }
        .option-btn.correct { background: #27ae60 !important; }
        .option-btn.wrong { background: #c0392b !important; }

        .score-board { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #e67e22; }
        
        .next-btn { margin-top: 20px; background: #8e44ad; color: white; border: none; padding: 10px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none; }
        .next-btn:hover { background: #732d91; }

        /* मोबाइल एप जस्तो तलको Bottom Nav Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--nav-bg); color: var(--nav-text); display: flex; justify-content: space-around; padding: 10px 0; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); z-index: 1000; }
        .bottom-nav a { color: var(--nav-text); text-decoration: none; font-size: 13px; font-weight: bold; text-align: center; }
        .bottom-nav a.active { color: #3498db; }
    </style>
</head>
<body>

    <div class="top-header">
        <h2>रमाइलो गणित र गन्ती खेल (Math & Counting)</h2>
    </div>

    <div class="main-container">
        <div class="score-board">स्कोर (Score): <span id="score">0</span></div>
        
        <div class="game-card">
            <div class="question-box" id="questionText">प्रश्न लोड हुँदैछ...</div>
            <div class="emoji-display" id="emojiDisplay">🍎🍎🍎</div>
            
            <div class="options-grid" id="optionsContainer">
                <!-- अप्सनहरू यहाँ JavaScript बाट आउँछन् -->
            </div>

            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">अर्को प्रश्न (Next) ➡️</button>
        </div>
    </div>

    <!-- मोबाइल एप जस्तो तलको नेभिगेसन बार -->
    <nav class="bottom-nav">
        <a href="slate.html">🎨<br>डिजिटल स्लेट</a>
        <a href="alphabet.html">🔤<br>वर्णमाला</a>
        <a href="math.html" class="active">🔢<br>गन्ती खेल</a>
        <a href="stories.html">📖<br>कथाहरू</a>
    </nav>

    <script>
        let score = 0;
        let correctAnswer = 0;

        const emojis = ['🍎', '⭐', '🎈', '🐱', '🚗', '🍬', '⚽', '🐟'];

        function generateQuestion() {
            document.getElementById('nextBtn').style.display = 'none';
            
            // अनियमित रूपमा गन्ती खेल वा जोडको प्रश्न छान्ने
            const gameType = Math.random() > 0.5 ? 'count' : 'add';

            if (gameType === 'count') {
                // गन्ती खेल
                const count = Math.floor(Math.random() * 8) + 2; // २ देखि ९ सम्म
                const chosenEmoji = emojis[Math.floor(Math.random() * emojis.length)];
                correctAnswer = count;

                document.getElementById('questionText').innerText = `यहाँ कति वटा छन् गन्नुहोस्?`;
                document.getElementById('emojiDisplay').innerText = chosenEmoji.repeat(count);
            } else {
                // जोडको खेल (Addition)
                const num1 = Math.floor(Math.random() * 5) + 1;
                const num2 = Math.floor(Math.random() * 4) + 1;
                correctAnswer = num1 + num2;

                const chosenEmoji = emojis[Math.floor(Math.random() * emojis.length)];
                document.getElementById('questionText').innerText = `${num1} + ${num2} कति हुन्छ?`;
                document.getElementById('emojiDisplay').innerText = `${chosenEmoji.repeat(num1)} + ${chosenEmoji.repeat(num2)}`;
            }

            // अप्सनहरू तयार गर्ने
            let options = [correctAnswer];
            while (options.length < 4) {
                let wrong = correctAnswer + (Math.floor(Math.random() * 5) - 2);
                if (wrong > 0 && !options.includes(wrong)) {
                    options.push(wrong);
                }
            }
            options.sort(() => Math.random() - 0.5); // अप्सनहरू तल-माथि मिसाउने

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true); // उत्तर छान्िसकेपछि अरु थिच्न नमिल्ने बनाउने

            if (selected === correctAnswer) {
                btn.classList.add('correct');
                score += 5;
                document.getElementById('score').innerText = score;
            } else {
                btn.classList.add('wrong');
                // सहि बटन कुन हो देखाउने
                allBtns.forEach(b => {
                    if (parseInt(b.innerText) === correctAnswer) {
                        b.classList.add('correct');
                    }
                });
            }
            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function nextQuestion() {
            generateQuestion();
        }

        // पहिलो पटक पेज खुल्दा प्रश्न लोड गर्ने
        generateQuestion();
    </script>
</body>
</html>
