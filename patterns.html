<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>गणित पाहाडा - पाठशाला</title>
    <meta name="theme-color" content="#ff9933">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 700px;
            margin: 0 auto 10px auto;
        }
        h2 { color: #d35400; margin: 0; font-size: 18px; }
        .home-btn {
            background-color: #e67e22;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background-color: #bdc3c7;
            color: #2c3e50;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: #27ae60;
            color: white;
        }
        /* टेबल ग्रिड */
        .table-section {
            display: none;
            overflow-x: auto;
            max-width: 700px;
            margin: auto;
            background: #fff;
            border: 2px solid #27ae60;
            border-radius: 10px;
            padding: 10px;
        }
        .table-section.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            font-family: monospace;
        }
        th, td {
            border: 1px solid #d5dbdb;
            padding: 8px 4px;
            text-align: center;
            color: #2c3e50;
        }
        th {
            background-color: #e8f8f5;
            color: #27ae60;
            font-weight: bold;
        }
        td {
            cursor: pointer;
        }
        td:active {
            background-color: #d4efdf;
        }
    </style>
    <script>
        function speakNepali(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ne-NP';
            speech.rate = 0.95;
            speech.pitch = 1.2;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>
    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>गणित पाहाडा</h2>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchSection('part1', event)">१ - १० सम्मका पाहाडा</button>
        <button class="tab-btn" onclick="switchSection('part2', event)">११ - २० सम्मका पाहाडा</button>
    </div>

    <!-- भाग १: १ देखि १० सम्म -->
    <div class="table-section active" id="part1">
        <table id="table1"></table>
    </div>

    <!-- भाग २: ११ देखि २० सम्म -->
    <div class="table-section" id="part2">
        <table id="table2"></table>
    </div>

    <script>
        function generateTableData(startNum, tableElementId) {
            const table = document.getElementById(tableElementId);
            
            // Header row (कॉलम हेडर्स)
            let headerRow = '<tr>';
            for (let c = 0; c < 10; c++) {
                let n = startNum + c;
                headerRow += `<th>${n} को पाहाडा</th>`;
            }
            headerRow += '</tr>';
            table.innerHTML = headerRow;

            // Rows (१० वटा पङ्क्तिहरू)
            for (let r = 1; r <= 10; r++) {
                let row = '<tr>';
                for (let c = 0; c < 10; c++) {
                    let n = startNum + c;
                    let cellText = "";
                    
                    if (c === 0) {
                        // पहिलो स्तम्भमा पूरा गुणन देखाइने (जस्तै 2*1=2 वा 11*1=11)
                        cellText = `${n}*${r}=${n * r}`;
                    } else {
                        // बाँकी स्तम्भहरूमा गुणनफल मात्र (तपाईँको हस्तलिखित उदाहरण अनुसार)
                        cellText = `${n * r}`;
                    }
                    
                    row += `<td onclick="speakNepali('${cellText}')">${cellText}</td>`;
                }
                row += '</tr>';
                table.innerHTML += row;
            }
        }

        // टेबलहरू लोड गर्ने
        generateTableData(1, 'table1');   // १ देखि १० सम्म
        generateTableData(11, 'table2');  // ११ देखि २० सम्म

        function switchSection(partId, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.table-section').forEach(sec => sec.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(partId).classList.add('active');
        }
    </script>
</body>
</html>
