<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>गणित पहाडा - पाठशाला</title>
    <meta name="theme-color" content="#009688">
    <!-- Child-friendly Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #E0F2F1 0%, #B2DFDB 100%);
            margin: 0;
            padding: 12px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 700px;
            margin: 0 auto 12px auto;
            background: #FFFFFF;
            padding: 8px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #00695C; 
            margin: 0; 
            font-size: 20px; 
            font-weight: 800;
        }
        .home-btn {
            background-color: #009688;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 3px 0 #00695C;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Tab Buttons */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background-color: #FFFFFF;
            color: #00695C;
            border: 3px solid #4DB6AC;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #00796B;
            transition: all 0.1s ease;
        }
        .tab-btn.active {
            background-color: #009688;
            color: white;
            border-color: #00796B;
            box-shadow: 0 4px 0 #004D40;
        }
        .tab-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #004D40;
        }

        /* Table Card Container */
        .table-section {
            display: none;
            overflow-x: auto;
            max-width: 700px;
            margin: auto;
            background: #FFFFFF;
            border: 3px solid #4DB6AC;
            border-radius: 18px;
            padding: 10px;
            box-shadow: 0 6px 0 #00796B, 0 8px 10px rgba(0,0,0,0.08);
        }
        .table-section.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
            font-weight: 700;
            min-width: 500px;
        }
        th, td {
            border: 2px solid #B2DFDB;
            padding: 8px 4px;
            text-align: center;
            color: #004D40;
            border-radius: 6px;
        }
        th {
            background-color: #E0F2F1;
            color: #00695C;
            font-size: 17px;
            font-weight: 800;
        }
        td {
            cursor: pointer;
            background-color: #FFFFFF;
            transition: all 0.1s ease;
        }
        td:active {
            background-color: #80CBC4;
            color: #FFFFFF;
            transform: scale(0.96);
        }
    </style>
    <script>
        function speakNepali(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ne-NP';
            speech.rate = 0.85;
            speech.pitch = 1.1;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>गणित पहाडा</h2>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchSection('part1', event)">१ - १० सम्मका पहाडा</button>
        <button class="tab-btn" onclick="switchSection('part2', event)">११ - २० सम्मका पहाडा</button>
    </div>

    <!-- भाग १: १ देखि १० सम्म -->
    <div class="table-section active" id="part1">
        <table id="table1"></table>
    </div>

    <!-- भाग २: ११ देखि २० सम्म -->
    <div class="table-section" id="part2">
        <table id="table2"></table>
    </div>

    <script>
        const nepaliDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
        function toNepaliNumber(n) {
            return n.toString().split('').map(digit => nepaliDigits[digit]).join('');
        }

        function generateTableData(startNum, tableElementId) {
            const table = document.getElementById(tableElementId);
            
            // Header Row (नेपाली शीर्षक)
            let headerRow = '<tr>';
            for (let c = 0; c < 10; c++) {
                let n = startNum + c;
                headerRow += `<th>${toNepaliNumber(n)} को पहाडा</th>`;
            }
            headerRow += '</tr>';
            table.innerHTML = headerRow;

            // 10 Rows Data Generation
            for (let r = 1; r <= 10; r++) {
                let row = '<tr>';
                for (let c = 0; c < 10; c++) {
                    let n = startNum + c;
                    let result = n * r;
                    
                    let nepN = toNepaliNumber(n);
                    let nepR = toNepaliNumber(r);
                    let nepRes = toNepaliNumber(result);
                    
                    // Display text in Table
                    let displayText = `${nepN} × ${nepR} = ${nepRes}`;
                    // Audio speech text
                    let speakText = `${nepN} गुणित ${nepR} बराबर ${nepRes}`;

                    row += `<td onclick="speakNepali('${speakText}')">${displayText}</td>`;
                }
                row += '</tr>';
                table.innerHTML += row;
            }
        }

        // Generate Tables
        generateTableData(1, 'table1');   // १ देखि १० सम्म
        generateTableData(11, 'table2');  // ११ देखि २० सम्म

        function switchSection(partId, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.table-section').forEach(sec => sec.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(partId).classList.add('active');
        }
    </script>

</body>
</html>
