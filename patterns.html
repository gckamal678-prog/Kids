<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>पाहाडा - पाठशाला</title>
    <meta name="theme-color" content="#ff9933">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }
        h2 { color: #d35400; margin: 0; font-size: 18px; }
        .home-btn {
            background-color: #e67e22;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .table-box {
            background-color: #ffffff;
            border: 2px solid #27ae60;
            border-radius: 12px;
            padding: 15px;
            max-width: 350px;
            margin: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .table-title {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 12px;
            border-bottom: 2px dashed #27ae60;
            padding-bottom: 8px;
        }
        .table-row {
            font-size: 18px;
            color: #2c3e50;
            padding: 6px 0;
            font-weight: bold;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>गणित पाहाडा</h2>
    </div>

    <div class="table-box">
        <div class="table-title">2 को पाहाडा</div>
        <div id="tableContent"></div>
    </div>

    <script>
        const content = document.getElementById('tableContent');
        const num = 2;

        for (let i = 1; i <= 10; i++) {
            const row = document.createElement('div');
            row.className = 'table-row';
            // तपाईंले भन्नुभए अनुसार 2*1=2 फर्म्याट
            row.innerText = `${num}*${i}=${num * i}`;
            content.appendChild(row);
        }
    </script>
</body>
</html>
