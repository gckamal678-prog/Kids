<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>पाठशाला - बालबालिकाको सिकाइ एप</title>
    <meta name="theme-color" content="#ff9933">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #d35400;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 500px;
            margin: auto;
        }
        .menu-card {
            background-color: #ffffff;
            border: 3px solid #ff9933;
            border-radius: 15px;
            padding: 20px 10px;
            text-decoration: none;
            color: #2c3e50;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }
        .menu-card:active {
            background-color: #ffe5cc;
            transform: scale(0.95);
        }
        .icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
    </style>

    <!-- साझा अडियो (Text-to-Speech) फंक्सन -->
    <script>
        function speakNepali(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ne-NP';
            speech.rate = 0.95;
            speech.pitch = 1.2;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <h1>📚 पाठशाला (सिकाइ चौतारी)</h1>

    <div class="menu-grid">
        <a href="vowels.html" class="menu-card" onclick="speakNepali('स्वर वर्ण')">
            <span class="icon">✍️</span>
            स्वर वर्ण (अ-अः)
        </a>
        <a href="consonants.html" class="menu-card" onclick="speakNepali('व्यञ्जन वर्ण')">
            <span class="icon">📖</span>
            व्यञ्जन वर्ण (क-ज्ञ)
        </a>
        <a href="barahakhari.html" class="menu-card" onclick="speakNepali('बाह्रखरी')">
            <span class="icon">📝</span>
            बाह्रखरी
        </a>
        <a href="numbers.html" class="menu-card" onclick="speakNepali('अंकहरू')">
            <span class="icon">🔢</span>
            अंकहरू (१-१००)
        </a>
        <a href="patterns.html" class="menu-card" onclick="speakNepali('गणित पाहाडा')">
            <span class="icon">➕</span>
            गणित पाहाडा
        </a>
    </div>

</body>
</html>
