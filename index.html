    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-color: #2c3e50;
            --box-bg: #ffffff;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; }
        
        .container { max-width: 600px; width: 100%; padding: 20px; text-align: center; }
        
        h1 { font-family: 'Poppins', sans-serif; font-size: 28px; color: #2980b9; margin-bottom: 10px; }
        p.subtitle { font-size: 16px; color: #555; margin-bottom: 30px; }

        /* मेनू कार्डहरूको ग्रिड */
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        
        .menu-card { background: var(--box-bg); border: 3px solid #3498db; border-radius: 20px; padding: 25px 15px; text-decoration: none; color: var(--text-color); box-shadow: 0 6px 15px rgba(0,0,0,0.08); transition: transform 0.2s, background 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .menu-card:hover { transform: translateY(-5px); background: #ebf5fb; }
        
        .icon { font-size: 40px; }
        .title { font-size: 18px; font-weight: bold; color: #2c3e50; }

        footer { margin-top: 40px; font-size: 13px; color: #7f8c8d; }
    </style>
</head>
