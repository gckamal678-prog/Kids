<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Action Words (Verbs) - Kids App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        h1 {
            color: #00ffcc;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 5px;
        }
        @media (min-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .card {
            background: #2d2d2d;
            border: 2px solid #444;
            padding: 15px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card:active {
            transform: scale(0.95);
            background: #3d3d3d;
        }
        .word {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
        }
        .icon {
            font-size: 30px;
        }
    </style>
</head>
<body>

    <h1>⚡ Action Words (Verbs) ⚡</h1>
    <p class="subtitle">Tap any action to hear and learn!</p>

    <div class="grid-container">
        <div class="card" onclick="speakWord('Run')"><div class="icon">🏃‍♂️</div><div class="word">Run</div></div>
        <div class="card" onclick="speakWord('Eat')"><div class="icon">🍎</div><div class="word">Eat</div></div>
        <div class="card" onclick="speakWord('Sleep')"><div class="icon">😴</div><div class="word">Sleep</div></div>
        <div class="card" onclick="speakWord('Jump')"><div class="icon">🦘</div><div class="word">Jump</div></div>
        <div class="card" onclick="speakWord('Read')"><div class="icon">📖</div><div class="word">Read</div></div>
        <div class="card" onclick="speakWord('Play')"><div class="icon">⚽</div><div class="word">Play</div></div>
        <div class="card" onclick="speakWord('Write')"><div class="icon">✏️</div><div class="word">Write</div></div>
        <div class="card" onclick="speakWord('Drink')"><div class="icon">🥛</div><div class="word">Drink</div></div>
        <div class="card" onclick="speakWord('Sing')"><div class="icon">🎤</div><div class="word">Sing</div></div>
        <div class="card" onclick="speakWord('Dance')"><div class="icon">💃</div><div class="word">Dance</div></div>
        <div class="card" onclick="speakWord('Swim')"><div class="icon">🏊‍♂️</div><div class="word">Swim</div></div>
        <div class="card" onclick="speakWord('Walk')"><div class="icon">🚶‍♂️</div><div class="word">Walk</div></div>
    </div>

    <script>
        // अडियो उच्चारण गर्ने JavaScript फंक्सन
        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Speech synthesis not supported in this browser.");
            }
        }
    </script>

</body>
</html>
