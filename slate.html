<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रमाइलो रङ भर्ने र डिजिटल स्लेट</title>
    <style>
        body { background: #f0f4f8; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
        h2 { color: #2980b9; margin: 10px 0; }
        
        .toolbar { margin-bottom: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; align-items: center; }
        
        select, button { padding: 8px 12px; font-size: 14px; font-weight: bold; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; }
        .color-picker { width: 40px; height: 35px; border: none; border-radius: 5px; cursor: pointer; }
        
        canvas { background: #fff; border: 4px solid #3498db; width: 100%; max-width: 450px; height: 350px; touch-action: none; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .tools-row { margin: 10px 0; }
        .action-btn { background: #e74c3c; color: white; border: none; }
        .save-btn { background: #27ae60; color: white; border: none; }
        .home-link { display: inline-block; margin-top: 15px; text-decoration: none; color: white; background: #2980b9; padding: 8px 15px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🎨 रङ भर्ने र डिजिटल स्लेट</h2>

    <!-- टूलबार: चित्र छान्ने, रङ छान्ने र इरेजर -->
    <div class="toolbar">
        <label>चित्र छान्नुहोस्:</label>
        <select id="templateSelect" onchange="loadTemplate()">
            <option value="blank">खाली स्लेट (आफैं कोर्ने)</option>
            <option value="apple">उम्रेको स्याउ (Apple)</option>
            <option value="flower">सुन्दर फूल (Flower)</option>
            <option value="fish">माछा (Fish)</option>
        </select>

        <label>रङ:</label>
        <input type="center" type="color" id="colorPicker" class="color-picker" value="#e74c3c">

        <button onclick="setPen()" style="background:#3498db; color:white;">पेन्सिल/ब्रश</button>
        <button onclick="setEraser()" style="background:#f39c12; color:white;">इरेजर (मेटाउने)</button>
    </div>

    <!-- क्याभास (कोर्ने ठाउँ) -->
    <canvas id="slate"></canvas>

    <!-- सफा गर्ने र सेभ गर्ने बटनहरू -->
    <div class="tools-row">
        <button class="action-btn" onclick="clearSlate()">सबै सफा गर्नुहोस्</button>
        <button class="save-btn" onclick="saveImage()">चित्र सेभ गर्नुहोस् 📥</button>
    </div>

    <div>
        <a href="index.html" class="home-link">🏠 होमपेजमा फर्कनुहोस्</a>
    </div>

    <script>
        const canvas = document.getElementById('slate');
        const ctx = canvas.getContext('2d');
        canvas.width = 400; 
        canvas.height = 350;

        let drawing = false;
        let isEraser = false;

        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';

        // माउस वा टचबाट कोर्ने सुरुवात
        function startDrawing(e) {
            drawing = true;
            ctx.beginPath();
            let pos = getPos(e);
            ctx.moveTo(pos.x, pos.y);
        }

        // कोर्दै जाँदाको प्रक्रिया
        function draw(e) {
            if (!drawing) return;
            let pos = getPos(e);
            
            if (isEraser) {
                ctx.strokeStyle = '#ffffff'; // इरेजरले सेतो रङले पुछ्छ
                ctx.lineWidth = 15;
            } else {
                ctx.strokeStyle = document.getElementById('colorPicker').value;
                ctx.lineWidth = 5;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDrawing() {
            drawing = false;
        }

        // मोबाइल र कम्प्युटर दुवैको लागि पोजिसन मिलाउने
        function getPos(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            let clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // इभेन्ट लिसनरहरू (माउस र टच दुवैका लागि)
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { startDrawing(e); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });
        canvas.addEventListener('touchend', stopDrawing);

        // पेन्सिल मोड
        function setPen() {
            isEraser = false;
            ctx.lineWidth = 5;
        }

        // इरेजर मोड (गलत भएको हटाउन)
        function setEraser() {
            isEraser = true;
        }

        // स्लेट सफा गर्ने
        function clearSlate() {
            loadTemplate(); // हाल छनोट भएको टेम्प्लेटसहित सफा हुन्छ
        }

        // रेडीमेड चित्रहरू लोड गर्ने फंक्सन
        function loadTemplate() {
            let choice = document.getElementById('templateSelect').value;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#333333';

            if (choice === 'apple') {
                // स्याउको सामान्य आउटलाइन
                ctx.beginPath();
                ctx.arc(200, 190, 70, 0, Math.PI * 2);
                ctx.stroke();
                // डाँठ
                ctx.beginPath();
                ctx.moveTo(200, 120);
                ctx.quadraticCurveTo(220, 90, 240, 100);
                ctx.stroke();
            } else if (choice === 'flower') {
                // फूलको बीचको भाग
                ctx.beginPath();
                ctx.arc(200, 175, 30, 0, Math.PI * 2);
                ctx.stroke();
                // वरिपरिका पाтаहरू
                for (let i = 0; i < 6; i++) {
                    let angle = (i * Math.PI) / 3;
                    let cx = 200 + Math.cos(angle) * 50;
                    let cy = 175 + Math.sin(angle) * 50;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 30, 0, Math.PI * 2);
                    ctx.stroke();
                }
            } else if (choice === 'fish') {
                // माछाको शरीर
                ctx.beginPath();
                ctx.ellipse(190, 175, 80, 50, 0, 0, Math.PI * 2);
                ctx.stroke();
                // पुच्छर
                ctx.beginPath();
                ctx.moveTo(270, 150);
                ctx.lineTo(320, 130);
                ctx.lineTo(320, 220);
                ctx.lineTo(270, 200);
                ctx.stroke();
            }
        }

        // चित्र सेभ गर्ने फंक्सन
        function saveImage() {
            let link = document.createElement('a');
            link.download = 'my-drawing.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // पहिलो पटक खुल्दा खाली स्लेट देखाउने
        loadTemplate();
    </script>
</body>
</html>
