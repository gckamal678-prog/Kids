<!DOCTYPE html>
<html lang="ne"><head><meta charset="UTF-8"><title>डिजिटल स्लेट</title>
<style>
    body{background:#f0f4f8; text-align:center; font-family:sans-serif;}
    canvas{background:#111; border:5px solid #3498db; width:90%; height:300px; touch-action:none; border-radius:10px;}
    .nav{margin-top:20px;}
    .btn{padding:10px 20px; background:#e74c3c; color:white; border:none; border-radius:5px;}
</style></head>
<body>
    <h2>🎨 डिजिटल स्लेट</h2>
    <canvas id="slate"></canvas><br><br>
    <button class="btn" onclick="clearSlate()">सफा गर्नुहोस्</button>
    <div class="nav"><a href="index.html">🏠 होमपेजमा जानुहोस्</a></div>
    <script>
        const canvas = document.getElementById('slate');
        const ctx = canvas.getContext('2d');
        canvas.width = 350; canvas.height = 300;
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        let drawing = false;
        canvas.onmousedown = () => drawing = true;
        canvas.onmouseup = () => drawing = false;
        canvas.onmousemove = (e) => {
            if(!drawing) return;
            ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();
        };
        function clearSlate() { ctx.clearRect(0,0, canvas.width, canvas.height); ctx.beginPath(); }
    </script>
</body></html>
