<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>नेपाली बाह्रखरी - पाठशाला</title>
    <meta name="theme-color" content="#673AB7">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Mukta', 'Fredoka', sans-serif; background-color: #F4F6F9; margin: 0; padding: 12px; text-align: center; min-height: 100vh; }

        .header { display: flex; justify-content: space-between; align-items: center; max-width: 700px; margin: 0 auto 15px auto; background: #FFFFFF; padding: 10px 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        h2 { color: #2C3E50; margin: 0; font-size: 22px; font-weight: 800; }
        .home-btn { background-color: #673AB7; color: white; padding: 6px 14px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 #4A148C; transition: all 0.1s ease; }
        .home-btn:active { transform: translateY(2px); box-shadow: none; }

        .barahkhari-container { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        .family-box { background: #FFFFFF; border-radius: 18px; padding: 12px; box-shadow: 0 5px 12px rgba(0,0,0,0.05); border: 3px solid; text-align: left; }
        .family-title { font-size: 20px; font-weight: 800; margin: 0 0 10px 5px; color: #4A148C; }
        .barahkhari-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        @media (min-width: 480px) { .barahkhari-grid { grid-template-columns: repeat(6, 1fr); } }

        .card { background-color: #FFFFFF; border-radius: 12px; padding: 10px 5px; cursor: pointer; user-select: none; transition: all 0.1s ease; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; min-height: 52px; border-style: solid; border-width: 2px 2px 4px 2px; }
        .card:active { transform: translateY(3px); }

        /* Themes */
        .theme-purple .card { color: #4A148C; border-color: #B39DDB #B39DDB #7E57C2 #B39DDB; background: #F3E5F5; }
        .theme-teal .card { color: #004D40; border-color: #80CBC4 #80CBC4 #26A69A #80CBC4; background: #E0F2F1; }
        .theme-pink .card { color: #880E4F; border-color: #F48FB1 #F48FB1 #EC407A #F48FB1; background: #FCE4EC; }
        .theme-orange .card { color: #BF360C; border-color: #FFAB91 #FFAB91 #FF7043 #FFAB91; background: #FBE9E7; }
        .theme-blue .card { color: #0D47A1; border-color: #90CAF9 #90CAF9 #42A5F5 #90CAF9; background: #E3F2FD; }
        .theme-amber .card { color: #E65100; border-color: #FFCC80 #FFCC80 #FFA726 #FFCC80; background: #FFF3E0; }
        .theme-cyan .card { color: #006064; border-color: #80DEEA #80DEEA #26C6DA #80DEEA; background: #E0F7FA; }
    </style>

    <!-- ElevenLabs को लागि script.js जोडिएको -->
    <script src="script.js"></script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>नेपाली बाह्रखरी</h2>
    </div>

    <div class="barahkhari-container" id="barahkhariContainer"></div>

    <script>
        const matras = ['', 'ा', 'ि', 'ी', 'ु', 'ू', 'े', 'ै', 'ो', 'ौ', 'ं', 'ः'];
        const consonantsData = [
            { base: 'क', theme: 'theme-purple' }, { base: 'ख', theme: 'theme-teal' }, { base: 'ग', theme: 'theme-pink' },
            { base: 'घ', theme: 'theme-orange' }, { base: 'च', theme: 'theme-purple' }, { base: 'छ', theme: 'theme-teal' },
            { base: 'ज', theme: 'theme-pink' }, { base: 'झ', theme: 'theme-orange' }, { base: 'ट', theme: 'theme-purple' },
            { base: 'ठ', theme: 'theme-teal' }, { base: 'ड', theme: 'theme-pink' }, { base: 'ढ', theme: 'theme-orange' },
            { base: 'त', theme: 'theme-purple' }, { base: 'थ', theme: 'theme-teal' }, { base: 'द', theme: 'theme-pink' },
            { base: 'ध', theme: 'theme-orange' }, { base: 'न', theme: 'theme-blue' }, { base: 'प', theme: 'theme-purple' },
            { base: 'फ', theme: 'theme-teal' }, { base: 'ब', theme: 'theme-pink' }, { base: 'भ', theme: 'theme-orange' },
            { base: 'म', theme: 'theme-blue' }, { base: 'य', theme: 'theme-blue' }, { base: 'र', theme: 'theme-blue' },
            { base: 'ल', theme: 'theme-blue' }, { base: 'व', theme: 'theme-blue' }, { base: 'श', theme: 'theme-amber' },
            { base: 'ष', theme: 'theme-amber' }, { base: 'स', theme: 'theme-amber' }, { base: 'ह', theme: 'theme-amber' },
            { base: 'क्ष', theme: 'theme-cyan' }, { base: 'त्र', theme: 'theme-cyan' }, { base: 'ज्ञ', theme: 'theme-cyan' }
        ];

        const container = document.getElementById('barahkhariContainer');

        consonantsData.forEach(item => {
            const familyBox = document.createElement('div');
            familyBox.className = `family-box ${item.theme}`;
            familyBox.innerHTML = `<div class="family-title">'${item.base}' परिवार</div>`;

            const grid = document.createElement('div');
            grid.className = 'barahkhari-grid';

            matras.forEach(matra => {
                let char = (item.base === 'र' && matra === 'ु') ? 'रु' : (item.base === 'र' && matra === 'ू') ? 'रू' : item.base + matra;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = char;
                
                // ElevenLabs को playAIVoice प्रयोग गरिएको
                card.addEventListener('click', () => playAIVoice(char));
                grid.appendChild(card);
            });

            familyBox.appendChild(grid);
            container.appendChild(familyBox);
        });
    </script>
</body>
</html>
