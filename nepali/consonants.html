<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>व्यञ्जन वर्ण - पाठशाला</title>
    <meta name="theme-color" content="#2E7D32">
    <!-- Friendly Typography Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', sans-serif;
            background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 100%);
            margin: 0;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 20px auto;
            background: #FFFFFF;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #1B5E20; 
            margin: 0; 
            font-size: 20px;
            font-weight: 800;
        }
        .home-btn {
            background-color: #4CAF50;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 3px 0 #1B5E20;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        
        /* ग्रिड लेआउट - व्यञ्जन वर्णहरू देखाउन (४ वटा स्तम्भ) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: auto;
        }

        /* Child-friendly 3D Letter Card */
        .letter-card {
            background-color: #FFFFFF;
            color: #2E7D32;
            border: 3px solid #81C784;
            border-radius: 16px;
            padding: 10px 0;
            font-size: 34px;
            font-weight: 800;
            box-shadow: 0 5px 0 #388E3C, 0 6px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* थिच्दा (Click गर्दा) Bounce/Press इफेक्ट */
        .letter-card:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #388E3C, 0 3px 5px rgba(0,0,0,0.1);
            background-color: #F1F8E9;
        }
    </style>

    <!-- ElevenLabs को लागि script.js जोडिएको -->
    <script src="script.js"></script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>व्यञ्जन वर्ण (क - ज्ञ)</h2>
    </div>

    <div class="grid-container" id="consonantsGrid">
        <!-- JavaScript बाट अक्षरहरू यहाँ लोड हुन्छन् -->
    </div>

    <script>
        const consonants = [
            'क', 'ख', 'ग', 'घ', 'ङ',
            'च', 'छ', 'ज', 'झ', 'ञ',
            'ट', 'ठ', 'ड', 'ढ', 'ण',
            'त', 'थ', 'द', 'ध', 'न',
            'प', 'फ', 'ब', 'भ', 'म',
            'य', 'र', 'ल', 'व', 'श', 
            'ष', 'स', 'ह', 'क्ष', 'त्र', 
            'ज्ञ'
        ];
        
        const grid = document.getElementById('consonantsGrid');

        consonants.forEach(letter => {
            const div = document.createElement('div');
            div.className = 'letter-card';
            div.innerText = letter;
            
            // पुरानो स्पिच हटाएर playAIVoice प्रयोग गरिएको
            div.addEventListener('click', () => {
                playAIVoice(letter);
            });

            grid.appendChild(div);
        });
    </script>

</body>
</html>
