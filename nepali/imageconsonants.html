<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>व्यञ्जन वर्ण - पाठशाला</title>
    <meta name="theme-color" content="#FF9800">
    <!-- Child-friendly Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #FFF3E0 0%, #FFE0B2 100%);
            margin: 0;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #FFFFFF;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #E65100; 
            margin: 0; 
            font-size: 20px; 
            font-weight: 800;
        }
        .home-btn {
            background-color: #FF9800;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 3px 0 #E65100;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: auto;
        }

        /* 3D Soft Card Style */
        .card {
            background-color: #FFFFFF;
            color: #E65100;
            border: 3px solid #FFB74D;
            border-radius: 18px;
            padding: 15px 10px;
            box-shadow: 0 6px 0 #F57C00, 0 8px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
        }
        .card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #F57C00, 0 3px 6px rgba(0,0,0,0.1);
            background-color: #FFF3E0;
        }

        /* Large Emoji Style */
        .emoji-box {
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            min-height: 58px;
        }

        .letter-title {
            font-size: 26px;
            font-weight: 800;
            color: #BF360C;
            line-height: 1.2;
        }

        /* शब्द नभएका अक्षरहरू (ङ, ञ, ण) लाई ठूलो देखाउन */
        .letter-only {
            font-size: 48px;
            font-weight: 800;
            color: #BF360C;
            line-height: 1;
        }

        .word-title {
            font-size: 16px;
            font-weight: 700;
            color: #E65100;
            min-height: 22px;
        }
    </style>

    <!-- ElevenLabs को लागि script.js जोडिएको -->
    <script src="script.js"></script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>व्यञ्जन वर्ण (क-ज्ञ)</h2>
    </div>

    <div class="grid-container" id="consonantsGrid"></div>

    <script>
        // सच्याइएको व्यञ्जन वर्ण Data
        const consonantsData = [
            { letter: 'क', word: 'कमल', emoji: '🪷' },
            { letter: 'ख', word: 'खरायो', emoji: '🐇' },
            { letter: 'ग', word: 'गाई', emoji: '🐄' },
            { letter: 'घ', word: 'घर', emoji: '🏠' },
            { letter: 'ङ', word: '', emoji: '' },
            { letter: 'च', word: 'चरा', emoji: '🐦' },
            { letter: 'छ', word: 'छाता', emoji: '☂️' },
            { letter: 'ज', word: 'जहाज', emoji: '✈️' },
            { letter: 'झ', word: 'झण्डा', emoji: '🇳🇵' },
            { letter: 'ञ', word: '', emoji: '' },
            { letter: 'ट', word: 'टमाटर', emoji: '🍅' },
            { letter: 'ठ', word: 'ठेला', emoji: '🛒' },
            { letter: 'ड', word: 'डमरु', emoji: '🥁' },
            { letter: 'ढ', word: 'ढोका', emoji: '🚪' },
            { letter: 'ण', word: '', emoji: '' },
            { letter: 'त', word: 'ताला', emoji: '🔒' },
            { letter: 'थ', word: 'थैली', emoji: '🛍️' },
            { letter: 'द', word: 'दियो', emoji: '🪔' },
            { letter: 'ध', word: 'धनुष', emoji: '🏹' },
            { letter: 'न', word: 'नदी', emoji: '🏞️' },
            { letter: 'प', word: 'पङ्खा', emoji: '🌀' },
            { letter: 'फ', word: 'फलफूल', emoji: '🍎' },
            { letter: 'ब', word: 'बाघ', emoji: '🐅' },
            { letter: 'भ', word: 'भालु', emoji: '🐻' },
            { letter: 'म', word: 'माछा', emoji: '🐟' },
            { letter: 'य', word: 'यन्त्र', emoji: '⚙️' },
            { letter: 'र', word: 'रथ', emoji: '🛺' },
            { letter: 'ल', word: 'लसुन', emoji: '🧄' },
            { letter: 'व', word: 'वकिल', emoji: '⚖️' },
            { letter: 'श', word: 'शंख', emoji: '🐚' },
            { letter: 'ष', word: 'षट्कोण', emoji: '🔷' },
            { letter: 'स', word: 'सुन्तला', emoji: '🍊' },
            { letter: 'ह', word: 'हार', emoji: '📿' },
            { letter: 'क्ष', word: 'क्षत्री', emoji: '⚔️' },
            { letter: 'त्र', word: 'त्रिशूल', emoji: '🔱' },
            { letter: 'ज्ञ', word: 'ज्ञानी', emoji: '🧘' }
        ];

        const consonantsGrid = document.getElementById('consonantsGrid');

        consonantsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            if (item.word) {
                card.innerHTML = `
                    <div class="emoji-box">${item.emoji}</div>
                    <div class="letter-title">${item.letter}</div>
                    <div class="word-title">${item.word}</div>
                `;
            } else {
                card.innerHTML = `
                    <div class="letter-only">${item.letter}</div>
                `;
            }

            // playAIVoice प्रयोग गरिएको
            card.addEventListener('click', () => {
                if(!item.word) {
                    playAIVoice(item.letter);
                } else {
                    playAIVoice(`${item.letter} बाट ${item.word}`);
                }
            });
            consonantsGrid.appendChild(card);
        });
    </script>

</body>
</html>
