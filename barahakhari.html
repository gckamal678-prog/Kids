<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बाह्रखरी - पाठशाला</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #fffaf0; padding: 15px; }
        .row-box { background: white; border: 2px solid #27ae60; padding: 15px; margin-bottom: 15px; border-radius: 10px; }
        h3 { color: #d35400; margin: 0 0 10px 0; }
        /* १२ वटा अक्षरका लागि ६-६ को ग्रिड (दुई पङ्क्ति) */
        .sub-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
        .item { 
            background: #f4f6f7; border: 1px solid #ccc; padding: 12px 0; 
            text-align: center; font-size: 22px; font-weight: bold; 
            cursor: pointer; border-radius: 6px;
        }
        .item:active { background: #d4efdf; }
    </style>
</head>
<body>

<div id="container"></div>

<script>
    // 'क' देखि 'ज्ञ' सम्मका व्यंजन वर्णहरू
    const consonants = ['क', 'ख', 'ग', 'घ', 'ङ', 'च', 'छ', 'ज', 'झ', 'ञ', 'ट', 'ठ', 'ड', 'ढ', 'ण', 'त', 'थ', 'द', 'ध', 'न', 'प', 'फ', 'ब', 'भ', 'म', 'य', 'र', 'ल', 'व', 'श', 'ष', 'स', 'ह', 'क्ष', 'त्र', 'ज्ञ'];
    
    const container = document.getElementById('container');

    consonants.forEach(con => {
        const rowBox = document.createElement('div');
        rowBox.className = 'row-box';
        rowBox.innerHTML = `<h3>${con} परिवार:</h3><div class="sub-grid" id="grid-${con}"></div>`;
        container.appendChild(rowBox);

        const grid = document.getElementById(`grid-${con}`);
        
        // १२ वटा बाह्रखरीका रूपहरू (कृ हटाइएको)
        // 'कि' का लागि विशेष व्यवस्था गरिएको छ
        const forms = [
            con, con + 'ा', 'ि' + con, con + 'ी', con + 'ु', con + 'ू', 
            con + 'े', con + 'ै', con + 'ो', con + 'ौ', con + 'ं', con + 'ः'
        ];
        
        forms.forEach(form => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerText = form; // यहाँ 'ि'+con ले 'कि' सहि देखाउँछ
            
            // क्लिक गर्दा आवाज आउने
            div.onclick = () => {
                let utterance = new SpeechSynthesisUtterance(form);
                utterance.lang = 'ne-NP';
                window.speechSynthesis.speak(utterance);
            };
            grid.appendChild(div);
        });
    });
</script>

</body>
</html>
