<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>बाह्रखरी - पाठशाला</title>
    <meta name="theme-color" content="#27ae60">
    <!-- Child-friendly Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Mukta', sans-serif; 
            background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 100%); 
            margin: 0;
            padding: 15px; 
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 20px auto;
            background: #FFFFFF;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #27ae60; 
            margin: 0; 
            font-size: 20px;
            font-weight: 800;
        }
        .home-btn {
            background-color: #27ae60;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 3px 0 #1e8449;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .row-box { 
            background: #FFFFFF; 
            border: 3px solid #A5D6A7; 
            padding: 15px 10px; 
            margin-bottom: 15px; 
            border-radius: 18px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.06);
        }
        h3 { 
            color: #1e8449; 
            margin: 0 0 12px 0; 
            text-align: left;
            font-size: 18px;
            padding-left: 5px;
        }
        
        /* १२ वटा अक्षरका लागि ६-६ को ग्रिड */
        .sub-grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 8px; 
        }

        .item { 
            background: #FFFFFF; 
            border: 2px solid #81C784; 
            color: #1b5e20;
            padding: 8px 0; 
            text-align: center; 
            font-size: 22px; 
            font-weight: 800; 
            cursor: pointer; 
            border-radius: 12px;
            box-shadow: 0 4px 0 #388E3C;
            transition: all 0.1s ease;
            user-select: none;
        }
        .item:active { 
            transform: translateY(3px);
            box-shadow: 0 1px 0 #388E3C;
            background: #E8F5E9; 
        }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html" class="home-btn">🏠 होम</a>
    <h2>बाह्रखरी शिक्षण</h2>
</div>

<div class="container" id="container"></div>

<script>
    const consonants = ['क', 'ख', 'ग', 'घ', 'ङ', 'च', 'छ', 'ज', 'झ', 'ञ', 'ट', 'ठ', 'ड', 'ढ', 'ण', 'त', 'थ', 'द', 'ध', 'न', 'प', 'फ', 'ब', 'भ', 'म', 'य', 'र', 'ल', 'व', 'श', 'ष', 'स', 'ह', 'क्ष', 'त्र', 'ज्ञ'];
    
    const container = document.getElementById('container');

    consonants.forEach(con => {
        const rowBox = document.createElement('div');
        rowBox.className = 'row-box';
        rowBox.innerHTML = `<h3>${con} परिवार:</h3><div class="sub-grid" id="grid-${con}"></div>`;
        container.appendChild(rowBox);

        const grid = document.getElementById(`grid-${con}`);
        
        // con + 'ि' गर्दा कम्प्युटरले आफैं 'कि', 'खि', 'गि' मिलाएर देखाउँछ
        const forms = [
            con, con + 'ा', con + 'ि', con + 'ी', con + 'ु', con + 'ू', 
            con + 'े', con + 'ै', con + 'ो', con + 'ौ', con + 'ं', con + 'ः'
        ];
        
        forms.forEach(form => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerText = form;
            
            div.onclick = () => {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(form);
                utterance.lang = 'ne-NP';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            };
            grid.appendChild(div);
        });
    });
</script>

</body>
</html>
