<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>फलफूल र तरकारीहरू - पाठशाला</title>
    <meta name="theme-color" content="#FF9800">
    <!-- Child-friendly Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #FFF3E0 0%, #FFE0B2 100%);
            margin: 0;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #FFFFFF;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #E65100; 
            margin: 0; 
            font-size: 20px; 
            font-weight: 800;
        }
        .home-btn {
            background-color: #FF9800;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 3px 0 #E65100;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Section Titles */
        .section-title {
            color: #D84315;
            background: #FFFFFF;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 19px;
            font-weight: 800;
            margin: 20px auto 15px auto;
            max-width: 600px;
            border: 3px solid #FFB74D;
            box-shadow: 0 4px 0 #F57C00;
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: auto;
        }

        /* 3D Soft Card Style */
        .card {
            background-color: #FFFFFF;
            color: #E65100;
            border: 3px solid #FFB74D;
            border-radius: 18px;
            padding: 15px 10px;
            box-shadow: 0 6px 0 #F57C00, 0 8px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #F57C00, 0 3px 6px rgba(0,0,0,0.1);
            background-color: #FFF3E0;
        }

        /* Large Emoji Style */
        .emoji-box {
            font-size: 55px;
            line-height: 1.1;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .np-name {
            font-size: 20px;
            font-weight: 800;
            color: #BF360C;
            line-height: 1.2;
        }

        .en-name {
            font-size: 14px;
            font-weight: 700;
            color: #E65100;
            font-family: 'Fredoka', sans-serif;
        }
    </style>
    <script>
        function speakNepali(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ne-NP';
            speech.rate = 0.85;
            speech.pitch = 1.1;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>फलफूल र तरकारीहरू</h2>
    </div>

    <!-- फलफूल सेक्सन -->
    <div class="section-title">🍎 फलफूलहरू (Fruits)</div>
    <div class="grid-container" id="fruitsGrid"></div>

    <!-- तरकारी सेक्सन -->
    <div class="section-title">🥦 तरकारीहरू (Vegetables)</div>
    <div class="grid-container" id="vegetablesGrid"></div>

    <script>
        // फलफूलहरूको सूची (नेपाली, अङ्ग्रेजी र Emoji)
        const fruitsData = [
            { np: 'स्याउ', en: 'Apple', emoji: '🍎' },
            { np: 'केरा', en: 'Banana', emoji: '🍌' },
            { np: 'आँप', en: 'Mango', emoji: '🥭' },
            { np: 'सुन्तला', en: 'Orange', emoji: '🍊' },
            { np: 'अङ्गुर', en: 'Grapes', emoji: '🍇' },
            { np: 'भुइँकटहर', en: 'Pineapple', emoji: '🍍' },
            { np: 'तरबुजा', en: 'Watermelon', emoji: '🍉' },
            { np: 'मेवा', en: 'Papaya', emoji: '🍈' },
            { np: 'अम्बा', en: 'Guava', emoji: '🍏' },
            { np: 'अनार', en: 'Pomegranate', emoji: '🫒' },
            { np: 'नाशपाती', en: 'Pear', emoji: '🍐' },
            { np: 'आरु', en: 'Peach', emoji: '🍑' },
            { np: 'स्ट्रबेरी', en: 'Strawberry', emoji: '🍓' },
            { np: 'लिची', en: 'Litchi', emoji: '🍒' }
        ];

        // तरकारीहरूको सूची (नेपाली, अङ्ग्रेजी र Emoji)
        const vegetablesData = [
            { np: 'आलु', en: 'Potato', emoji: '🥔' },
            { np: 'गोलभेडा / टमाटर', en: 'Tomato', emoji: '🍅' },
            { np: 'प्याज', en: 'Onion', emoji: '🧅' },
            { np: 'लसुन', en: 'Garlic', emoji: '🧄' },
            { np: 'गाजर', en: 'Carrot', emoji: '🥕' },
            { np: 'काँक्रो', en: 'Cucumber', emoji: '🥒' },
            { np: 'काउली', en: 'Cauliflower', emoji: '🥦' },
            { np: 'बन्दाकोबी', en: 'Cabbage', emoji: '🥬' },
            { np: 'भन्टा', en: 'Brinjal', emoji: '🍆' },
            { np: 'मकै', en: 'Corn', emoji: '🌽' },
            { np: 'खुर्सानी', en: 'Chilli', emoji: '🌶️' },
            { np: 'सिमलाबन्द', en: 'Capsicum', emoji: '🫑' },
            { np: 'पालुङ्गो', en: 'Spinach', emoji: '🥗' },
            { np: 'अदुवा', eng: 'Ginger', emoji: '🫚' },
            { np: 'धनियाँ', eng: 'Coriander', emoji: '🌿' },
        ];

        // फलफूल लोड गर्ने
        const fruitsGrid = document.getElementById('fruitsGrid');
        fruitsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="emoji-box">${item.emoji}</div>
                <div class="np-name">${item.np}</div>
                <div class="en-name">${item.en}</div>
            `;
            card.addEventListener('click', () => speakNepali(item.np));
            fruitsGrid.appendChild(card);
        });

        // तरकारी लोड गर्ने
        const vegetablesGrid = document.getElementById('vegetablesGrid');
        vegetablesData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="emoji-box">${item.emoji}</div>
                <div class="np-name">${item.np}</div>
                <div class="en-name">${item.en}</div>
            `;
            card.addEventListener('click', () => speakNepali(item.np));
            vegetablesGrid.appendChild(card);
        });
    </script>

</body>
</html>
