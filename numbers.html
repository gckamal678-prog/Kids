<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अंकहरू (1-100) - पाठशाला</title>
    <meta name="theme-color" content="#ff9933">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 400px;
            margin: 0 auto 15px auto;
        }
        h2 { color: #d35400; margin: 0; font-size: 18px; }
        .home-btn {
            background-color: #e67e22;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #bdc3c7;
            color: #2c3e50;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: #2980b9;
            color: white;
        }
        /* ठाडो स्तम्भ (Vertical List Layout) */
        .vertical-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
            margin: auto;
        }
        .vertical-container.active {
            display: flex;
        }
        .number-card {
            background-color: #ffffff;
            color: #2c3e50;
            border: 2px solid #2980b9;
            border-radius: 10px;
            padding: 12px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 3px 5px rgba(0,0,0,0.08);
            cursor: pointer;
        }
        .number-card:active { background-color: #ebf5fb; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>गन्ती (१ - १००)</h2>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('nepali', event)">नेपाली (१-१००)</button>
        <button class="tab-btn" onclick="switchTab('english', event)">English (1-100)</button>
    </div>

    <div class="vertical-container active" id="nepaliList"></div>
    <div class="vertical-container" id="englishList"></div>

    <script>
        const nepaliDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
        function toNepaliNumber(n) {
            return n.toString().split('').map(digit => nepaliDigits[digit]).join('');
        }

        const nepList = document.getElementById('nepaliList');
        const engList = document.getElementById('englishList');

        for (let i = 1; i <= 100; i++) {
            const nepCard = document.createElement('div');
            nepCard.className = 'number-card';
            nepCard.innerText = toNepaliNumber(i) + '  ←  ' + i; // वा केवल अंक मात्र राख्न सक्नुहुन्छ
            nepCard.innerText = toNepaliNumber(i);
            nepList.appendChild(nepCard);

            const engCard = document.createElement('div');
            engCard.className = 'number-card';
            engCard.innerText = i;
            engList.appendChild(engCard);
        }

        function switchTab(type, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.vertical-container').forEach(list => list.classList.remove('active'));

            event.target.classList.add('active');
            if (type === 'nepali') {
                document.getElementById('nepaliList').classList.add('active');
            } else {
                document.getElementById('englishList').classList.add('active');
            }
        }
    </script>
</body>
</html>
