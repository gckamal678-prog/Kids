<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अंकहरू (1-100) - पाठशाला</title>
    <meta name="theme-color" content="#3F51B5">
    <!-- Child-friendly Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Fredoka', 'Mukta', sans-serif;
            background: linear-gradient(180deg, #E8EAF6 0%, #C5CAE9 100%);
            margin: 0;
            padding: 12px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 12px auto;
            background: #FFFFFF;
            padding: 8px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #1A237E; 
            margin: 0; 
            font-size: 19px; 
            font-weight: 800;
        }
        .home-btn {
            background-color: #3F51B5;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 3px 0 #1A237E;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Tab Buttons */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background-color: #FFFFFF;
            color: #3F51B5;
            border: 3px solid #7986CB;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #303F9F;
            transition: all 0.1s ease;
        }
        .tab-btn.active {
            background-color: #3F51B5;
            color: white;
            border-color: #303F9F;
            box-shadow: 0 4px 0 #1A237E;
        }
        .tab-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1A237E;
        }

        /* 10 Columns Grid Layout */
        .grid-container {
            display: none;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-width: 600px;
            margin: auto;
        }
        .grid-container.active {
            display: grid;
        }

        /* 3D Soft Number Card */
        .number-card {
            background-color: #FFFFFF;
            color: #1A237E;
            border: 2px solid #7986CB;
            border-radius: 10px;
            padding: 10px 0;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 3px 0 #303F9F;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .number-card:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #303F9F;
            background-color: #E8EAF6;
        }
    </style>

    <!-- ElevenLabs को लागि script.js जोडिएको -->
    <script src="script.js"></script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>गन्ती (१ - १००)</h2>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('nepali', event)">नेपाली (१-१००)</button>
        <button class="tab-btn" onclick="switchTab('english', event)">English (1-100)</button>
    </div>

    <div class="grid-container active" id="nepaliGrid"></div>
    <div class="grid-container" id="englishGrid"></div>

    <script>
        const nepaliDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
        function toNepaliNumber(n) {
            return n.toString().split('').map(digit => nepaliDigits[digit]).join('');
        }

        const nepGrid = document.getElementById('nepaliGrid');
        const engGrid = document.getElementById('englishGrid');

        // १० स्तम्भ र १० पङ्क्ति मिलाएर १ देखि १०० सम्म कार्डहरू बनाउने
        for (let r = 1; r <= 10; r++) {
            for (let c = 0; c < 10; c++) {
                let num = c * 10 + r;
                
                // नेपाली कार्ड (playAIVoice प्रयोग गरिएको)
                let nepCard = document.createElement('div');
                nepCard.className = 'number-card';
                let nepVal = toNepaliNumber(num);
                nepCard.innerText = nepVal;
                nepCard.addEventListener('click', () => playAIVoice(nepVal));
                nepGrid.appendChild(nepCard);

                // अङ्ग्रेजी कार्ड (playAIVoice प्रयोग गरिएको)
                let engCard = document.createElement('div');
                engCard.className = 'number-card';
                engCard.innerText = num;
                engCard.addEventListener('click', () => playAIVoice(num.toString()));
                engGrid.appendChild(engCard);
            }
        }

        function switchTab(type, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.grid-container').forEach(grid => grid.classList.remove('active'));
            event.target.classList.add('active');
            if (type === 'nepali') {
                document.getElementById('nepaliGrid').classList.add('active');
            } else {
                document.getElementById('englishGrid').classList.add('active');
            }
        }
    </script>

</body>
</html>
