<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अंकहरू (1-100) - पाठशाला</title>
    <meta name="theme-color" content="#ff9933">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 10px auto;
        }
        h2 { color: #d35400; margin: 0; font-size: 18px; }
        .home-btn {
            background-color: #e67e22;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background-color: #bdc3c7;
            color: #2c3e50;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: #2980b9;
            color: white;
        }
        /* १० वटा स्तम्भ (Columns) भएको ग्रिड */
        .grid-container {
            display: none;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            max-width: 600px;
            margin: auto;
        }
        .grid-container.active {
            display: grid;
        }
        .number-card {
            background-color: #ffffff;
            color: #2c3e50;
            border: 1px solid #2980b9;
            border-radius: 6px;
            padding: 8px 0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .number-card:active { background-color: #ebf5fb; }
    </style>
    <script>
        function speakNepali(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ne-NP';
            speech.rate = 0.95;
            speech.pitch = 1.2;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>
    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>गन्ती (१ - १००)</h2>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('nepali', event)">नेपाली (१-१००)</button>
        <button class="tab-btn" onclick="switchTab('english', event)">English (1-100)</button>
    </div>

    <div class="grid-container active" id="nepaliGrid"></div>
    <div class="grid-container" id="englishGrid"></div>

    <script>
        const nepaliDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
        function toNepaliNumber(n) {
            return n.toString().split('').map(digit => nepaliDigits[digit]).join('');
        }

        const nepGrid = document.getElementById('nepaliGrid');
        const engGrid = document.getElementById('englishGrid');

        // १० स्तम्भ र १० पङ्क्ति मिलाउन म्याट्रिक्स क्रममा राख्ने (Vertical column-wise filling)
        for (let r = 1; r <= 10; r++) {
            for (let c = 0; c < 10; c++) {
                let num = c * 10 + r;
                
                // नेपाली कार्ड
                let nepCard = document.createElement('div');
                nepCard.className = 'number-card';
                let nepVal = toNepaliNumber(num);
                nepCard.innerText = nepVal;
                nepCard.addEventListener('click', () => speakNepali(nepVal));
                nepGrid.appendChild(nepCard);

                // अंग्रेजी कार्ड
                let engCard = document.createElement('div');
                engCard.className = 'number-card';
                engCard.innerText = num;
                engCard.addEventListener('click', () => speakNepali(num.toString()));
                engGrid.appendChild(engCard);
            }
        }

        function switchTab(type, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.grid-container').forEach(grid => grid.classList.remove('active'));
            event.target.classList.add('active');
            if (type === 'nepali') {
                document.getElementById('nepaliGrid').classList.add('active');
            } else {
                document.getElementById('englishGrid').classList.add('active');
            }
        }
    </script>
</body>
</html>
