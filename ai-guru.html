<style>

}

* {

}

body {

  background:var(--bg);
  color:var(--text);

}

.header {

}

.container {

}

.header h1 {
  margin:0;
  font-size:25px;
}

.header p {

}

.back {

  text-decoration:none;

  font-size:13px;
}

main {

.welcome {

}

.welcome h3 {

}

.welcome p {

  font-size:13px;
  color:var(--muted);

}

.stats-badge {

  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  margin-top: 8px;
}

.controls {
  display:flex;
  gap:9px;
  margin-bottom:16px;
}

.search {
  flex:1;
  min-width:0;
  padding:13px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  font-size:14px;
  color: var(--text);
}

.language {

  border-radius:12px;
  padding:0 15px;
  color:white;
  background:var(--primary);
  font-weight:bold;
  cursor:pointer;
}

.subject {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:13px;
  overflow:hidden;
  box-shadow:0 4px 15px #00000006;
}

.subject-title {
  width:100%;
  padding:15px;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  color:var(--text);
  cursor:pointer;
  font-size:15px;
}

.subject-icon {
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:#eeedff;
  font-size:23px;
}

.subject-name {
  flex:1;
  font-weight:800;
}

.count-tag {
  font-size: 11px;
  background: var(--bg);
  padding: 3px 8px;
  border-radius: 10px;
  color: var(--muted);
}

.arrow {
  color:var(--primary);
  font-size:20px;
}

.questions {
  display:none;
  padding:0 12px 12px;
}

.subject.open .questions {
  display:block;
}

.qa {
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  margin-top:9px;
}

.question {
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  border:0;
  background:var(--card);
  color:var(--text);
  text-align:left;
  cursor:pointer;
  font-size:14px;
  line-height:1.6;
}

.question-number {
  color:var(--primary);
  background:#eeedff;
  padding:4px 7px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
}

.question-text {
  flex:1;
  font-weight:650;
}

.plus {
  color:var(--primary);
  font-size:20px;
}

.answer {
  display:none;
  padding:14px;
  background:var(--answer);
  color:#18583a;
  font-size:14px;
  line-height:1.8;
  border-top:1px solid #d9f0e4;
}

.answer strong {
  display:block;
  margin-bottom:5px;
  font-size:12px;
}

.qa.active .answer {
  display:block;
}

.no-result {
  display:none;
  background:var(--card);
  padding:22px;
  border-radius:14px;
  text-align:center;
  color:var(--muted);
}

footer {
  text-align:center;
  padding:20px;
  color:var(--muted);
  font-size:12px;
}

@media(prefers-color-scheme:dark) {

const toDevanagariNum = (num) => {
  const digits = ['०','१','२','३','४','५','६','७','८','९'];
  return num.toString().split('').map(d => digits[d] || d).join('');
};

// --- ALGORITHMIC GENERATORS FOR MATH & PATTERNS (2500+ Combinations) ---
function generateMathQuestions() {
  const mathQ = [];
  
  // Addition (1 to 50)
  for (let i = 1; i <= 30; i++) {
    for (let j = 1; j <= 20; j++) {
      const sum = i + j;
      mathQ.push([
        `${toDevanagariNum(i)} + ${toDevanagariNum(j)} कति हुन्छ?`,
        `${toDevanagariNum(i)} + ${toDevanagariNum(j)} = ${toDevanagariNum(sum)} हुन्छ।`,
        `What is ${i} + ${j}?`,
        `${i} + ${j} = ${sum}.`
      ]);
    }
  }

  // Multiplication Tables (1 to 15)
  for (let i = 1; i <= 15; i++) {
    for (let j = 1; j <= 10; j++) {
      const prod = i * j;
      mathQ.push([
        `${toDevanagariNum(i)} × ${toDevanagariNum(j)} कति हुन्छ?`,
        `${toDevanagariNum(i)} गुणा ${toDevanagariNum(j)} बराबर ${toDevanagariNum(prod)} हुन्छ।`,
        `What is ${i} times ${j}?`,
        `${i} × ${j} = ${prod}.`
      ]);
    }
  }

  // Subtraction Practice
  for (let i = 10; i <= 50; i += 2) {
    for (let j = 1; j <= i; j += 3) {
      const diff = i - j;
      mathQ.push([
        `${toDevanagariNum(i)} बाट ${toDevanagariNum(j)} घटाउँदा कति बाँकी रहन्छ?`,
        `${toDevanagariNum(i)} − ${toDevanagariNum(j)} = ${toDevanagariNum(diff)} हुन्छ।`,
        `What is ${i} minus ${j}?`,
        `${i} − ${j} = ${diff}.`
      ]);
    }
  }

  return mathQ;
}

  ["मित्रता भनेको के हो?", "आपसमा विश्वास, सहयोग र भलो चाहने पवित्र सम्बन्ध मित्रता हो।", "What is true friendship?", "Friendship is a relationship based on trust, kindness, and mutual care."],
  ["समयको पालना (Punctuality) किन आवश्यक छ?", "समयमै काम गर्दा सफलता मिल्छ र अरूको समयको पनि कदर हुन्छ।", "Why is punctuality important?", "Punctuality brings success and shows respect for others' time."]
 ]
},
{
 icon:"💻",
 ne:"कम्प्युटर र प्रविधि",
 en:"Computer & Technology",
 questions:[

  ["कम्प्युटरको दिमाग (Brain) कसलाई भनिन्छ?", "CPU (Central Processing Unit) लाई कम्प्युटरको दिमाग भनिन्छ।", "What is called the Brain of Computer?", "CPU (Central Processing Unit) is called the brain of the computer."],
  ["कम्प्युटरमा डेटा इनपुट गर्ने दुई वटा साधन कुन हुन्?", "किबोर्ड (Keyboard) र माउस (Mouse) इनपुट साधन हुन्।", "Name two input devices.", "Keyboard and Mouse are common input devices."],
  ["मोनिटरको काम के हो?", "मोनिटरले कम्प्युटरमा भएका नतिजा वा चित्रहरू स्क्रिनमा देखाउँछ।", "What is the function of a Monitor?", "A monitor displays text, images, and video output."],
  ["इन्टरनेट भनेको के हो?", "संसारभरका कम्प्युटरहरूलाई आपसमा जोड्ने विश्वव्यापी सञ्जाल इन्टरनेट हो।", "What is the Internet?", "The internet is a global network connecting computers worldwide."],
  ["सफ्टवेयर भनेको के हो?", "कम्प्युटरलाई काम गराउन दिइने निर्देशन र प्रोग्रामहरूको समूह सफ्टवेयर हो।", "What is software?", "Software is a collection of programs that instruct a computer what to do."]
 ]
}
];

// Combine Generators and Static Data
const knowledgeBank = [
  ...staticKnowledgeBank,
  {
    icon: "➗",
    ne: "गणित र अभ्यास (Mathematics)",
    en: "Mathematics & Practice",
    questions: generateMathQuestions()
  }
];

// --- RENDER & LOGIC ---
let english = false;
const subjects = document.getElementById("subjects");
const search = document.getElementById("search");
const noResult = document.getElementById("noResult");
const totalStats = document.getElementById("totalStats");

function calculateTotalQuestions() {
  return knowledgeBank.reduce((acc, subj) => acc + subj.questions.length, 0);
}

function render() {
  subjects.innerHTML = "";
  const term = search.value.trim().toLowerCase();
  let totalFound = 0;

  knowledgeBank.forEach((subject) => {
    const matchedQuestions = subject.questions
      .map((q, index) => ({ q, index }))
      .filter(({ q }) => {
        const fullContent = (q[0] + " " + q[1] + " " + q[2] + " " + q[3] + " " + subject.ne + " " + subject.en).toLowerCase();
        return !term || fullContent.includes(term);
      });

    if (matchedQuestions.length === 0) return;
    totalFound += matchedQuestions.length;

    const section = document.createElement("section");
    section.className = "subject";

    const titleBtn = document.createElement("button");
    titleBtn.className = "subject-title";
    titleBtn.type = "button";

    titleBtn.innerHTML = `
      <span class="subject-icon">${subject.icon}</span>
      <span class="subject-name">
        ${english ? subject.en : subject.ne} 
        <span class="count-tag">(${toDevanagariNum(matchedQuestions.length)})</span>
      </span>
      <span class="arrow">⌄</span>
    `;

    const listContainer = document.createElement("div");
    listContainer.className = "questions";

    titleBtn.addEventListener("click", () => {
      const isOpen = section.classList.contains("open");
      document.querySelectorAll(".subject.open").forEach(el => el.classList.remove("open"));
      if (!isOpen) section.classList.add("open");
    });

    matchedQuestions.forEach(({ q, index }) => {
      const qaWrapper = document.createElement("div");
      qaWrapper.className = "qa";

      const qBtn = document.createElement("button");
      qBtn.className = "question";
      qBtn.type = "button";

      const questionText = english ? q[2] : q[0];
      const answerText = english ? q[3] : q[1];

      qBtn.innerHTML = `
        <span class="question-number">${english ? index + 1 : toDevanagariNum(index + 1)}</span>
        <span class="question-text"></span>
        <span class="plus">＋</span>
      `;
      qBtn.querySelector(".question-text").textContent = questionText;

      const ansDiv = document.createElement("div");
      ansDiv.className = "answer";

      const label = document.createElement("strong");
      label.textContent = english ? "ANSWER" : "उत्तर";

      const textSpan = document.createElement("span");
      textSpan.textContent = answerText;

      ansDiv.append(label, textSpan);

      qBtn.addEventListener("click", () => {
        const isActive = qaWrapper.classList.contains("active");
        document.querySelectorAll(".qa.active").forEach(el => {
          el.classList.remove("active");
          el.querySelector(".plus").textContent = "＋";
        });

        if (!isActive) {
          qaWrapper.classList.add("active");
          qBtn.querySelector(".plus").textContent = "−";
        }
      });

      qaWrapper.append(qBtn, ansDiv);
      listContainer.append(qaWrapper);
    });

    section.append(titleBtn, listContainer);
    subjects.append(section);
  });

  noResult.style.display = totalFound ? "none" : "block";
}

// Update stats badge
const totalQCount = calculateTotalQuestions();
totalStats.textContent = `कुल ${toDevanagariNum(totalQCount)}+ बाल-मैत्रीपूर्ण प्रश्नोत्तरहरू उपलब्ध छन्`;

search.addEventListener("input", render);

document.getElementById("language").addEventListener("click", () => {
  english = !english;
  document.getElementById("language").textContent = english ? "नेपाली" : "English";
  search.placeholder = english ? "🔎 Search questions or topics..." : "🔎 प्रश्न वा विषय खोज्नुहोस्...";
  totalStats.textContent = english 
    ? `Total ${totalQCount}+ Child-Friendly Q&A Available` 
    : `कुल ${toDevanagariNum(totalQCount)}+ बाल-मैत्रीपूर्ण प्रश्नोत्तरहरू उपलब्ध छन्`;
  render();
});

// Initial Render
render();
</script>
</body>
</html>
