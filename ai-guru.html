
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>प्रश्नोत्तर भण्डार | बाल पाठशाला</title>

<style>
:root {
  --bg:#f3f5ff;
  --card:#ffffff;
  --text:#202744;
  --muted:#788198;
  --primary:#6558df;
  --border:#e7e9f3;
  --answer:#eaf9f0;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,sans-serif;
}

.header {
  padding:25px 16px;
  color:white;
  background:linear-gradient(135deg,#5146c8,#168caa);
}

.container {
  max-width:1000px;
  margin:auto;
}

.header h1 {
  margin:0;
  font-size:25px;
}

.header p {
  margin:7px 0 0;
  font-size:14px;
  opacity:.9;
}

.back {
  display:inline-block;
  color:white;
  text-decoration:none;
  margin-top:15px;
  font-size:13px;
}

main {
  padding:18px 14px 40px;
}

.welcome {
  background:var(--card);
  padding:17px;
  border-radius:17px;
  margin-bottom:17px;
  box-shadow:0 5px 20px #00000008;
  border:1px solid var(--border);
}

.welcome h3 {
  margin:0 0 7px;
}

.welcome p {
  margin:0;
  font-size:13px;
  color:var(--muted);
  line-height:1.7;
}

.controls {
  display:flex;
  gap:9px;
  margin-bottom:16px;
}

.search {
  flex:1;
  min-width:0;
  padding:13px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  font-size:14px;
  outline:none;
}

.search:focus {
  border-color:var(--primary);
  box-shadow:0 0 0 3px #6558df18;
}

.language {
  border:0;
  border-radius:12px;
  padding:0 15px;
  color:white;
  background:var(--primary);
  font-weight:bold;
  cursor:pointer;
  flex-shrink:0;
}

/* 3 x 3 GRID - MOBILE INCLUDED */

#subjects {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  align-items:start;
}

/* SUBJECT CARD */

.subject {
  min-width:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 14px #252d5a0b;
  transition:transform .2s,box-shadow .2s;
}

.subject:active {
  transform:scale(.97);
}

.subject-title {
  width:100%;
  min-height:115px;
  padding:12px 5px;
  border:0;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  text-align:center;
  color:var(--text);
  cursor:pointer;
  position:relative;
}

.subject-icon {
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,#eeedff,#e4f3ff);
  font-size:25px;
  flex-shrink:0;
}

.subject-name {
  width:100%;
  font-weight:800;
  font-size:11px;
  line-height:1.4;
  overflow-wrap:anywhere;
}

.arrow {
  color:var(--primary);
  font-size:16px;
  line-height:1;
  transition:transform .2s;
}

.subject.open .arrow {
  transform:rotate(180deg);
}

/* QUESTIONS */

.questions {
  display:none;
  padding:0 7px 8px;
}

.subject.open .questions {
  display:block;
}

.qa {
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  margin-top:7px;
}

.question {
  width:100%;
  display:flex;
  align-items:flex-start;
  gap:6px;
  padding:9px 7px;
  border:0;
  background:var(--card);
  color:var(--text);
  text-align:left;
  cursor:pointer;
  font-size:12px;
  line-height:1.5;
}

.question-number {
  color:var(--primary);
  background:#eeedff;
  padding:3px 5px;
  border-radius:6px;
  font-size:10px;
  font-weight:bold;
  flex-shrink:0;
}

.question-text {
  flex:1;
  min-width:0;
  font-weight:650;
  overflow-wrap:anywhere;
}

.plus {
  color:var(--primary);
  font-size:16px;
  flex-shrink:0;
}

.answer {
  display:none;
  padding:10px;
  background:var(--answer);
  color:#18583a;
  font-size:12px;
  line-height:1.7;
  border-top:1px solid #d9f0e4;
  overflow-wrap:anywhere;
}

.answer strong {
  display:block;
  margin-bottom:4px;
  font-size:11px;
}

.qa.active .answer {
  display:block;
}

.no-result {
  display:none;
  background:var(--card);
  padding:22px;
  border-radius:14px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
}

footer {
  text-align:center;
  padding:20px;
  color:var(--muted);
  font-size:12px;
}

/* SMALL MOBILE */

@media(max-width:360px) {
  #subjects {
    gap:7px;
  }

  .subject-title {
    min-height:105px;
    padding:9px 3px;
  }

  .subject-icon {
    width:36px;
    height:36px;
    font-size:21px;
  }

  .subject-name {
    font-size:10px;
  }

  .questions {
    padding:0 4px 6px;
  }

  .question {
    font-size:11px;
    padding:7px 5px;
  }

  .answer {
    font-size:11px;
    padding:8px;
  }
}

/* DARK MODE */

@media(prefers-color-scheme:dark) {
  :root {
    --bg:#101827;
    --card:#182338;
    --text:#edf2ff;
    --muted:#aab6ca;
    --border:#2c3a52;
    --answer:#173b32;
  }

  .subject-icon {
    background:linear-gradient(135deg,#302e59,#193c55);
  }

  .answer {
    color:#b9f2d2;
  }

  .question-number {
    background:#302e59;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="container">
    <h1>📚 प्रश्नोत्तर भण्डार</h1>
    <p>बाल पाठशाला · पढौँ, बुझौँ र नयाँ कुरा सिकौँ!</p>
    <a class="back" href="./index.html">
      ← मुख्य पृष्ठमा फर्कनुहोस्
    </a>
  </div>
</header>

<main class="container">

  <section class="welcome">
    <h3>नमस्कार विद्यार्थी! 👋</h3>
    <p>
      आफूलाई मन परेको विषय छान्नुहोस्।
      त्यसपछि प्रश्नमा थिचेर उत्तर पढ्नुहोस्।
    </p>
  </section>

  <div class="controls">
    <input
      type="search"
      id="search"
      class="search"
      placeholder="🔎 प्रश्न खोज्नुहोस्..."
    >

    <button id="language" class="language">
      English
    </button>
  </div>

  <div id="subjects"></div>

  <div id="noResult" class="no-result">
    यो खोजीसँग मिल्ने प्रश्न भेटिएन।
  </div>

</main>

<footer>
  बाल पाठशाला ❤️ पढ्दै सिकौँ, खेल्दै रमाऔँ!
</footer>

<script>

const knowledgeBank = [

{
 icon:"🔤",
 ne:"नेपाली भाषा र व्याकरण",
 en:"Nepali Language & Grammar",
 questions:[
  [
   "नेपाली भाषा कुन लिपिमा लेखिन्छ?",
   "नेपाली भाषा देवनागरी लिपिमा लेखिन्छ।",
   "Which script is used to write Nepali?",
   "Nepali is written in the Devanagari script."
  ]
 ]
},

{
 icon:"🔠",
 ne:"English Grammar र Vocabulary",
 en:"English Grammar & Vocabulary",
 questions:[
  [
   "How many letters are there in the English alphabet?",
   "There are 26 letters in the English alphabet.",
   "How many letters are there in the English alphabet?",
   "There are 26 letters in the English alphabet."
  ]
 ]
},

{
 icon:"🔬",
 ne:"विज्ञान तथा प्रकृति",
 en:"Science & Nature",
 questions:[
  [
   "हामी सास फेर्दा कुन ग्यास लिन्छौँ?",
   "हामी सास फेर्दा अक्सिजन लिन्छौँ।",
   "Which gas do humans breathe in?",
   "Humans breathe in oxygen."
  ]
 ]
},

{
 icon:"🌍",
 ne:"नेपाल तथा विश्व सामान्य ज्ञान",
 en:"Nepal & General Knowledge",
 questions:[
  [
   "नेपालको राजधानी कहाँ हो?",
   "नेपालको राजधानी काठमाडौं हो।",
   "What is the capital of Nepal?",
   "The capital of Nepal is Kathmandu."
  ]
 ]
},

{
 icon:"🤝",
 ne:"सामाजिक शिक्षा",
 en:"Social Studies",
 questions:[
  [
   "समाज भनेको के हो?",
   "आपसमा सम्बन्ध राख्दै सँगै बस्ने मानिसहरूको समूहलाई समाज भनिन्छ।",
   "What is a society?",
   "A society is a group of people who live together."
  ]
 ]
},

{
 icon:"💻",
 ne:"कम्प्युटर",
 en:"Computer Education",
 questions:[
  [
   "कम्प्युटर भनेको के हो?",
   "कम्प्युटर निर्देशनअनुसार तथ्याङ्क प्रशोधन गर्ने इलेक्ट्रोनिक उपकरण हो।",
   "What is a computer?",
   "A computer is an electronic device that processes information."
  ]
 ]
},

{
 icon:"💚",
 ne:"नैतिक शिक्षा",
 en:"Moral Education",
 questions:[
  [
   "इमानदार हुनु भनेको के हो?",
   "सधैँ सत्य बोल्नु र छलकपट नगर्नु इमानदार हुनु हो।",
   "What does it mean to be honest?",
   "Being honest means telling the truth."
  ]
 ]
},

{
 icon:"📖",
 ne:"कथा, कविता र मनोरञ्जन",
 en:"Stories & Entertainment",
 questions:[
  [
   "कथाबाट हामी के सिक्न सक्छौँ?",
   "कथाबाट राम्रो व्यवहार, साहस, मित्रता र जीवनका पाठ सिक्न सक्छौँ।",
   "What can we learn from stories?",
   "Stories can teach kindness, courage, and friendship."
  ]
 ]
},

{
 icon:"🏡",
 ne:"दैनिक जीवन तथा व्यवहारिक ज्ञान",
 en:"Daily Life & General Knowledge",
 questions:[
  [
   "खाना खानुअघि हात किन धुनुपर्छ?",
   "हातमा भएका कीटाणु हटाउन र रोगबाट बच्न हात धुनुपर्छ।",
   "Why should we wash our hands before eating?",
   "Washing hands helps remove germs and prevent illness."
  ]
 ]
},

{
 icon:"➗",
 ne:"गणित",
 en:"Mathematics",
 questions:[
  [
   "५ + ५ कति हुन्छ?",
   "५ + ५ = १० हुन्छ।",
   "What is 5 + 5?",
   "5 + 5 = 10."
  ]
 ]
}

];

let english = false;

const subjects = document.getElementById("subjects");
const search = document.getElementById("search");
const noResult = document.getElementById("noResult");

function render() {

  subjects.innerHTML = "";

  const term = search.value.trim().toLowerCase();
  let found = 0;

  knowledgeBank.forEach((subject, index) => {

    const questions = subject.questions
      .map((q, i) => ({q, i}))
      .filter(({q}) => {

        const allText = q.join(" ").toLowerCase()
          + subject.ne.toLowerCase()
          + subject.en.toLowerCase();

        return !term || allText.includes(term);
      });

    if (!questions.length) return;

    found += questions.length;

    const section = document.createElement("section");
    section.className = "subject";

    const title = document.createElement("button");
    title.className = "subject-title";
    title.type = "button";

    title.innerHTML = `
      <span class="subject-icon">${subject.icon}</span>
      <span class="subject-name"></span>
      <span class="arrow">⌄</span>
    `;

    title.querySelector(".subject-name").textContent =
      english ? subject.en : subject.ne;

    const list = document.createElement("div");
    list.className = "questions";

    title.addEventListener("click", () => {

      const wasOpen = section.classList.contains("open");

      document.querySelectorAll(".subject.open")
        .forEach(item => item.classList.remove("open"));

      if (!wasOpen) {
        section.classList.add("open");
      }

    });

    questions.forEach(({q, i}) => {

      const qa = document.createElement("div");
      qa.className = "qa";

      const question = document.createElement("button");
      question.className = "question";
      question.type = "button";

      const questionText = english ? q[2] : q[0];
      const answerText = english ? q[3] : q[1];

      question.innerHTML = `
        <span class="question-number">${i + 1}</span>
        <span class="question-text"></span>
        <span class="plus">＋</span>
      `;

      question.querySelector(".question-text").textContent =
        questionText;

      const answer = document.createElement("div");
      answer.className = "answer";

      const label = document.createElement("strong");
      label.textContent = english ? "ANSWER" : "उत्तर";

      const text = document.createElement("span");
      text.textContent = answerText;

      answer.append(label, text);

      question.addEventListener("click", () => {

        const wasActive = qa.classList.contains("active");

        document.querySelectorAll(".qa.active")
          .forEach(item => {
            item.classList.remove("active");
            item.querySelector(".plus").textContent = "＋";
          });

        if (!wasActive) {
          qa.classList.add("active");
          question.querySelector(".plus").textContent = "−";
        }

      });

      qa.append(question, answer);
      list.append(qa);

    });

    section.append(title, list);
    subjects.append(section);

  });

  noResult.style.display = found ? "none" : "block";

}

search.addEventListener("input", render);

document.getElementById("language")
  .addEventListener("click", () => {

    english = !english;

    document.getElementById("language").textContent =
      english ? "नेपाली" : "English";

    search.placeholder = english
      ? "🔎 Search questions..."
      : "🔎 प्रश्न खोज्नुहोस्...";

    render();

  });

render();

</script>
</body>
</html>
