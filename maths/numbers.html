
<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f8ff">
<title>अङ्क सिकौँ | बाल पाठशाला</title>
<style>
:root{--bg:#f5f8ff;--card:#fff;--text:#18243a;--muted:#68758b;--primary:#4169e1;--border:#e0e7f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Devanagari",sans-serif;line-height:1.6}
body.dark-mode{--bg:#111827;--card:#1c2739;--text:#f2f5fc;--muted:#bac5d8;--border:#35435b}
main{max-width:850px;margin:auto;padding:16px}
header,.panel{padding:19px;background:var(--card);border:1px solid var(--border);border-radius:19px;margin-bottom:15px}
header{background:linear-gradient(130deg,#e6efff,#e3fbef)}
h1{margin:0;font-size:clamp(24px,5vw,34px)}
h2{margin-top:0}
a{color:var(--primary);font-weight:700;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer}
.btn{padding:10px 14px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);font-weight:700}
.primary{background:var(--primary);color:white;border-color:var(--primary)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.num{min-height:82px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);font-size:24px;font-weight:800}
.num small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.num.active{outline:3px solid var(--primary);background:#e5edff;color:#2347a7}
.big{font-size:clamp(32px,8vw,55px);font-weight:900;color:var(--primary)}
.muted{color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{width:100%;max-width:230px;padding:11px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text)}
#feedback{min-height:28px;font-weight:800}
@media(max-width:520px){main{padding:11px}.panel,header{padding:14px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.num{min-height:70px;font-size:21px}}
</style>
</head>
<body>
<main>
<header>
<div class="top"><strong>🎒 बाल पाठशाला · गणित</strong><button class="btn" id="theme" type="button">🌙 / ☀️</button></div>
<h1>🔢 अङ्क चिनौँ र गन्ती गरौँ</h1>
<p>अङ्क छान्नुहोस्, त्यसको नाम हेर्नुहोस् र अभ्यास गर्नुहोस्।</p>
<a href="../index.html">← मुख्य पृष्ठमा फर्कनुहोस्</a>
</header>

<section class="panel">
<h2>अङ्कको सूची</h2>
<div class="controls">
<label for="range">अङ्कको समूह:</label>
<select id="range" class="btn">
<option value="0">०–१९</option><option value="20">२०–३९</option>
<option value="40">४०–५९</option><option value="60">६०–७९</option>
<option value="80">८०–१००</option>
</select>
</div>
<div class="grid" id="numbers" style="margin-top:14px"></div>
</section>

<section class="panel">
<h2>तपाईंले छानेको अङ्क</h2>
<div class="big" id="chosen">१</div>
<p id="name">एक</p>
<div class="controls">
<button class="btn" id="prev" type="button">← अघिल्लो</button>
<button class="btn primary" id="next" type="button">अर्को →</button>
</div>
</section>

<section class="panel">
<h2>🧠 अङ्क चिन्ने अभ्यास</h2>
<p id="question">अभ्यास सुरु गर्न बटन थिच्नुहोस्।</p>
<label for="answer">तपाईंको उत्तर</label>
<div class="controls" style="margin-top:8px">
<input id="answer" type="number" min="0" max="100" inputmode="numeric" placeholder="० देखि १००">
<button class="btn primary" id="check" type="button">उत्तर जाँच्नुहोस्</button>
<button class="btn" id="new" type="button">नयाँ प्रश्न</button>
</div>
<p id="feedback" aria-live="polite"></p>
<p class="muted" id="score">सही उत्तर: ०</p>
</section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const ne=n=>String(n).replace(/[0-9]/g,d=>"०१२३४५६७८९"[+d]);
const words=["शून्य","एक","दुई","तीन","चार","पाँच","छ","सात","आठ","नौ","दश","एघार","बाह्र","तेह्र","चौध","पन्ध्र","सोह्र","सत्र","अठार","उन्नाइस","बीस"];
const names=n=>n<21?words[n]:n===100?"एक सय":n%10===0?({30:"तीस",40:"चालीस",50:"पचास",60:"साठी",70:"सत्तरी",80:"असी",90:"नब्बे"}[n]||ne(n)):ne(n);
let current=1,expected=0,score=0,answered=false;
function show(n){
 current=Math.max(0,Math.min(100,n));
 $("chosen").textContent=ne(current);$("name").textContent=names(current);
 document.querySelectorAll(".num").forEach(b=>b.classList.toggle("active",Number(b.dataset.n)===current));
}
function render(){
 const start=Number($("range").value),end=start===80?100:start+19,box=$("numbers");
 box.replaceChildren();
 for(let n=start;n<=end;n++){
  const b=document.createElement("button");b.className="num";b.type="button";b.dataset.n=n;
  b.innerHTML="<span>"+ne(n)+"</span><small>"+(n<=20?names(n):"छान्नुहोस्")+"</small>";
  b.addEventListener("click",()=>show(n));box.appendChild(b);
 }
 show(current);
}
function newQuestion(){
 expected=Math.floor(Math.random()*101);answered=false;
 $("question").textContent="कुन अङ्क हो? "+ne(expected)+" लाई अङ्कमा लेख्नुहोस्।";
 $("answer").value="";$("feedback").textContent="";
}
$("range").addEventListener("change",render);
$("prev").addEventListener("click",()=>show(current-1));
$("next").addEventListener("click",()=>show(current+1));
$("new").addEventListener("click",newQuestion);
$("check").addEventListener("click",()=>{
 if(answered)return;
 if($("answer").value.trim()===""){$("feedback").textContent="पहिले उत्तर लेख्नुहोस्।";return}
 if(Number($("answer").value)===expected){
  answered=true;score++;
  $("feedback").textContent="🎉 सही उत्तर!";$("feedback").style.color="#168453";
  $("score").textContent="सही उत्तर: "+ne(score);
 }else{
  $("feedback").textContent="फेरि प्रयास गर्नुहोस्। सही अङ्क "+ne(expected)+" हो।";
  $("feedback").style.color="#c24141";
 }
});
$("theme").addEventListener("click",()=>{
 document.body.classList.toggle("dark-mode");
 try{localStorage.setItem("theme",document.body.classList.contains("dark-mode")?"dark":"light")}catch(_){}
});
try{if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark-mode")}catch(_){}
render();newQuestion();
})();
</script>
</body>
</html>
