
<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f8ff">
<title>गुणन तालिका | बाल पाठशाला</title>
<style>
:root{--bg:#f5f8ff;--card:#fff;--text:#18243a;--muted:#68758b;--primary:#4169e1;--border:#e0e7f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Devanagari",sans-serif;line-height:1.6}
body.dark-mode{--bg:#111827;--card:#1c2739;--text:#f2f5fc;--muted:#bac5d8;--border:#35435b}
main{max-width:850px;margin:auto;padding:16px}
header,.panel{padding:19px;background:var(--card);border:1px solid var(--border);border-radius:19px;margin-bottom:15px}
header{background:linear-gradient(130deg,#e6efff,#e3fbef)}
h1{margin:0;font-size:clamp(24px,5vw,34px)}
h2{margin-top:0}
a{color:var(--primary);font-weight:700;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
.btn{padding:10px 13px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);font-weight:700}
.primary{background:var(--primary);color:white;border-color:var(--primary)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.picker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pick{padding:12px 5px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-weight:800}
.pick.active{background:#e5edff;color:#2347a7;border-color:var(--primary)}
.table{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{width:100%;max-width:220px;padding:11px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text)}
#feedback{min-height:28px;font-weight:800}
@media(max-width:480px){main{padding:11px}.panel,header{padding:14px}.picker{grid-template-columns:repeat(4,minmax(0,1fr))}.fact{font-size:15px}}
</style>
</head>
<body>
<main>
<header>
<div class="top"><strong>🎒 बाल पाठशाला · गणित</strong><button class="btn" id="theme" type="button">🌙 / ☀️</button></div>
<h1>✖️ गुणन तालिका (पहाडा)</h1>
<p>पहाडा हेर्नुहोस्, सम्झनुहोस् र अभ्यास गरेर आफ्नो सीप जाँच्नुहोस्।</p>
<a href="../index.html">← मुख्य पृष्ठमा फर्कनुहोस्</a>
</header>

<section class="panel">
<h2>पहाडा छान्नुहोस्</h2>
<div class="picker" id="picker"></div>
</section>

<section class="panel">
<h2 id="table-title">१ को पहाडा</h2>
<div class="table" id="table"></div>
</section>

<section class="panel">
<h2>🧠 गुणन अभ्यास</h2>
<p id="question">प्रश्न तयार हुँदैछ…</p>
<div class="controls">
<input id="answer" type="number" inputmode="numeric" placeholder="उत्तर लेख्नुहोस्">
<button class="btn primary" id="check" type="button">जाँच्नुहोस्</button>
<button class="btn" id="new" type="button">अर्को प्रश्न</button>
</div>
<p id="feedback" aria-live="polite"></p>
<p class="muted" id="score">सही उत्तर: ०</p>
</section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const ne=n=>String(n).replace(/[0-9]/g,d=>"०१२३४५६७८९"[+d]);
let chosen=1,a=1,b=1,score=0,answered=false;
function renderTable(){
 $("table-title").textContent=ne(chosen)+" को पहाडा";
 const box=$("table");box.replaceChildren();
 for(let i=1;i<=10;i++){
  const row=document.createElement("div");row.className="fact";
  row.textContent=ne(chosen)+" × "+ne(i)+" = "+ne(chosen*i);box.appendChild(row);
 }
 document.querySelectorAll(".pick").forEach(btn=>btn.classList.toggle("active",Number(btn.dataset.n)===chosen));
}
function newQuestion(){
 a=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*10)+1;answered=false;
 $("question").textContent=ne(a)+" × "+ne(b)+" = ?";
 $("answer").value="";$("feedback").textContent="";
}
function init(){
 const box=$("picker");
 for(let n=1;n<=20;n++){
  const btn=document.createElement("button");btn.className="pick";btn.type="button";btn.dataset.n=n;btn.textContent=ne(n)+" को";
  btn.addEventListener("click",()=>{chosen=n;renderTable()});box.appendChild(btn);
 }
 renderTable();newQuestion();
}
$("check").addEventListener("click",()=>{
 if(answered)return;
 if($("answer").value.trim()===""){$("feedback").textContent="पहिले उत्तर लेख्नुहोस्।";return}
 if(Number($("answer").value)===a*b){
  answered=true;score++;$("feedback").textContent="🎉 सही उत्तर!";$("feedback").style.color="#168453";
  $("score").textContent="सही उत्तर: "+ne(score);
 }else{
  $("feedback").textContent="फेरि प्रयास गर्नुहोस्। सही उत्तर "+ne(a*b)+" हो।";
  $("feedback").style.color="#c24141";
 }
});
$("new").addEventListener("click",newQuestion);
$("theme").addEventListener("click",()=>{
 document.body.classList.toggle("dark-mode");
 try{localStorage.setItem("theme",document.body.classList.contains("dark-mode")?"dark":"light")}catch(_){}
});
try{if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark-mode")}catch(_){}
init();
})();
</script>
</body>
</html>
