<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>सरस्वती माध्यमिक विद्यालय - विषयगत गृहकार्य पोर्टल</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Mukta', sans-serif;
            background: linear-gradient(180deg, #E0F7FA 0%, #FFFDE7 100%);
            padding: 20px;
            text-align: center;
            color: #2C3E50;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 3px solid #80DEEA;
        }
        h2 { color: #E65100; margin-bottom: 5px; font-size: 22px; }
        .subtitle { font-size: 15px; color: #00796B; margin-bottom: 15px; font-weight: 700; }
        
        /* विषयगत बक्सहरूको डिजाइन */
        .subject-box {
            background: #F1F8E9;
            border: 2px solid #AED581;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 15px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .subject-box h3 { color: #2E7D32; font-size: 17px; margin: 0; }
        
        .speak-btn {
            background: #00838F;
            color: white;
            border: none;
            padding: 3px 10px;
            font-size: 12px;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Mukta', sans-serif;
            font-weight: bold;
        }

        .hw-content {
            font-size: 15px;
            line-height: 1.6;
            color: #37474F;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .timestamp {
            font-size: 11px;
            color: #78909C;
            margin-top: 8px;
            text-align: right;
            font-weight: bold;
            border-top: 1px dashed #C8E6C9;
            padding-top: 5px;
        }

        /* शिक्षक सेक्सन र कन्ट्रोल */
        .teacher-section {
            display: none;
            background: #FFF3E0;
            border: 2px dashed #FFB74D;
            padding: 15px;
            border-radius: 14px;
            margin-top: 20px;
            text-align: center;
        }
        .btn {
            background: #FF7043;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Mukta', sans-serif;
            box-shadow: 0 4px 0px #D84315;
        }
        
        #teacher-panel-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            max-width: 480px;
            margin: 20px auto;
            background: #2C3E50;
            padding: 20px;
            border-radius: 16px;
            border: 3px solid #FF7043;
            text-align: left;
            color: white;
        }
        .modal-content h3 { color: #FF7043; margin-bottom: 10px; text-align: center; }
        
        .input-group {
            position: relative;
            margin-top: 10px;
        }
        label { font-size: 13px; color: #CFD8DC; display: block; }
        
        textarea {
            width: 100%;
            height: 75px;
            padding: 8px;
            margin-top: 3px;
            border-radius: 6px;
            border: 1px solid #90A4AE;
            font-family: 'Mukta', sans-serif;
            font-size: 14px;
            resize: vertical;
        }
        
        /* बोलेर लेख्ने माइक बटनको स्टाइल */
        .mic-btn {
            background: #D32F2F;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 3px;
            font-family: 'Mukta', sans-serif;
            font-weight: bold;
        }
        .mic-btn.listening {
            background: #388E3C;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .save-btn { background: #4CAF50; flex: 1; padding: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .close-btn { background: #E53935; flex: 1; padding: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            background: #78909C;
            color: white;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎒 विषयगत गृहकार्य पोर्टल</h2>
    <div class="subtitle">🏫 सरस्वती माध्यमिक विद्यालय</div>

    <!-- गणित (Math) बक्स -->
    <div class="subject-box">
        <div class="subject-header">
            <h3>📐 गणित (Math)</h3>
            <button class="speak-btn" onclick="readAudio('display-math')">🔊 सुनेर सुन्ने</button>
        </div>
        <div class="hw-content" id="display-math">लोड हुँदैछ...</div>
        <div class="timestamp" id="time-math"></div>
    </div>

    <!-- नेपाली (Nepali) बक्स -->
    <div class="subject-box">
        <div class="subject-header">
            <h3>📖 नेपाली</h3>
            <button class="speak-btn" onclick="readAudio('display-nepali')">🔊 सुनेर सुन्ने</button>
        </div>
        <div class="hw-content" id="display-nepali">लोड हुँदैछ...</div>
        <div class="timestamp" id="time-nepali"></div>
    </div>

    <!-- अंग्रेजी (English) बक्स -->
    <div class="subject-box">
        <div class="subject-header">
            <h3>🔤 अंग्रेजी (English)</h3>
            <button class="speak-btn" onclick="readAudio('display-english')">🔊 सुनेर सुन्ने</button>
        </div>
        <div class="hw-content" id="display-english">लोड हुँदैछ...</div>
        <div class="timestamp" id="time-english"></div>
    </div>

    <!-- गुप्त एडमिन ट्रिगर -->
    <div class="teacher-section" id="admin-trigger-box">
        <button class="btn" onclick="checkTeacherPassword()">🔐 विषयगत होमवर्क अपडेट गर्नुहोस्</button>
    </div>

    <a href="https://kids.kamalgc.com.np" class="back-link">⬅️ मुख्य गृहपेजमा फर्कनुहोस्</a>
</div>

<!-- शिक्षक एडिट प्यानल -->
<div id="teacher-panel-modal">
    <div class="modal-content">
        <h3>🛠️ विषयगत होमवर्क सम्पादन प्यानल</h3>
        
        <!-- गणित इनपुट -->
        <div class="input-group">
            <label>📐 गणित होमवर्क:</label>
            <textarea id="input-math" placeholder="गणितको गृहकार्य लेख्नुहोस्..."></textarea>
            <button class="mic-btn" onclick="startVoiceInput('input-math', this)">🎤 बोलेर लेख्नुहोस्</button>
        </div>

        <!-- नेपाली इनपुट -->
        <div class="input-group">
            <label>📖 नेपाली होमवर्क:</label>
            <textarea id="input-nepali" placeholder="नेपालीको गृहकार्य लेख्नुहोस्..."></textarea>
            <button class="mic-btn" onclick="startVoiceInput('input-nepali', this)">🎤 बोलेर लेख्नुहोस्</button>
        </div>

        <!-- अंग्रेजी इनपुट -->
        <div class="input-group">
            <label>🔤 अंग्रेजी होमवर्क:</label>
            <textarea id="input-english" placeholder="अंग्रेजीको गृहकार्य लेख्नुहोस्..."></textarea>
            <button class="mic-btn" onclick="startVoiceInput('input-english', this)">🎤 बोलेर लेख्नुहोस्</button>
        </div>

        <div class="modal-btns">
            <button class="save-btn" onclick="saveAllHomework()">💾 सबै सेभ गर्नुहोस्</button>
            <button class="close-btn" onclick="closeTeacherModal()">✖️ बन्द</button>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        loadAllData();
        checkAdminAccess();
    };

    function checkAdminAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('admin-trigger-box').style.display = 'block';
        }
    }

    function loadAllData() {
        loadSubject('math');
        loadSubject('nepali');
        loadSubject('english');
    }

    function loadSubject(sub) {
        let text = localStorage.getItem("hw_sub_" + sub);
        let time = localStorage.getItem("time_sub_" + sub);
        let contentBox = document.getElementById("display-" + sub);
        let timeBox = document.getElementById("time-" + sub);

        if (text && text.trim() !== "") {
            contentBox.innerText = text;
            timeBox.innerText = time ? "अपडेट समय: " + time : "";
        } else {
            contentBox.innerHTML = "<span style='color: #78909C;'>यो विषयको गृहकार्य राखिएको छैन।</span>";
            timeBox.innerText = "";
        }
    }

    // अडियो स्पिच (सुनेर सुन्ने फिचर)
    function readAudio(elementId) {
        let text = document.getElementById(elementId).innerText;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ne-NP';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("तपाईको ब्राउजरले अडियो सपोर्ट गर्दैन।");
        }
    }

    // शिक्षकले बोलेर टाइप गर्ने फिचर (Voice Input)
    function startVoiceInput(targetId, btnElement) {
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!window.SpeechRecognition) {
            alert("माफ गर्नुहोला, तपाईंको ब्राउजरले भ्वाइस इनपुट सपोर्ट गर्दैन। कृपया गुगल क्रोम प्रयोग गर्नुहोस्।");
            return;
        }

        let recognition = new SpeechRecognition();
        recognition.lang = 'ne-NP'; // नेपाली भाषा (अग्लो बोल्दा अंग्रेजी पनि बुझ्छ)
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        btnElement.innerText = "Listening... बोल्नुहोस् 🎤";
        btnElement.classList.add("listening");

        recognition.onresult = function(event) {
            let speechResult = event.results[0][0].transcript;
            let textarea = document.getElementById(targetId);
            textarea.value += (textarea.value ? " " : "") + speechResult;
            btnElement.innerText = "🎤 बोलेर लेख्नुहोस्";
            btnElement.classList.remove("listening");
        };

        recognition.onerror = function() {
            alert("आवाज बुझ्न सकिएन, कृपया फेरि प्रयास गर्नुहोस्।");
            btnElement.innerText = "🎤 बोलेर लेख्नुहोस्";
            btnElement.classList.remove("listening");
        };

        recognition.onend = function() {
            btnElement.innerText = "🎤 बोलेर लेख्नुहोस्";
            btnElement.classList.remove("listening");
        };

        recognition.start();
    }

    function checkTeacherPassword() {
        let pin = prompt("कृपया शिक्षक पिन (PIN) प्रविष्ट गर्नुहोस् (9999):");
        if (pin === "9999") {
            document.getElementById('teacher-panel-modal').style.display = 'block';
            document.getElementById('input-math').value = localStorage.getItem("hw_sub_math") || "";
            document.getElementById('input-nepali').value = localStorage.getItem("hw_sub_nepali") || "";
            document.getElementById('input-english').value = localStorage.getItem("hw_sub_english") || "";
        } else if (pin !== null) {
            alert("❌ गलत पिन!");
        }
    }

    function closeTeacherModal() {
        document.getElementById('teacher-panel-modal').style.display = 'none';
    }

    function saveAllHomework() {
        let now = new Date();
        let formattedTime = now.toLocaleDateString('ne-NP') + ' ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

        ['math', 'nepali', 'english'].forEach(sub => {
            let val = document.getElementById("input-" + sub).value;
            if(val.trim() !== "") {
                localStorage.setItem("hw_sub_" + sub, val);
                localStorage.setItem("time_sub_" + sub, formattedTime);
            } else {
                localStorage.removeItem("hw_sub_" + sub);
                localStorage.removeItem("time_sub_" + sub);
            }
        });

        alert("✅ विषयगत गृहकार्य र अपडेट समय सफलताપूर्ववक सेभ भयो!");
        closeTeacherModal();
        loadAllData();
    }
</script>

</body>
</html>
