<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>सरस्वती माध्यमिक विद्यालय - गृहकार्य</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Mukta', sans-serif;
            background: linear-gradient(180deg, #E0F7FA 0%, #FFFDE7 100%);
            padding: 20px;
            text-align: center;
            color: #2C3E50;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 3px solid #80DEEA;
        }
        h2 { color: #E65100; margin-bottom: 5px; font-size: 22px; }
        .subtitle { font-size: 15px; color: #00796B; margin-bottom: 20px; font-weight: 700; }
        
        .homework-box {
            background: #F1F8E9;
            border: 3px solid #AED581;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .homework-box h3 { color: #2E7D32; margin-bottom: 8px; font-size: 18px; }
        .hw-content { font-size: 16px; line-height: 1.6; color: #37474F; white-space: pre-wrap; }
        
        .teacher-section {
            background: #FFF3E0;
            border: 2px dashed #FFB74D;
            padding: 15px;
            border-radius: 14px;
            margin-top: 25px;
            text-align: center;
        }
        .btn {
            background: #FF7043;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Mukta', sans-serif;
            box-shadow: 0 4px 0px #D84315;
        }
        .btn:active { transform: translateY(2px); box-shadow: none; }
        
        #teacher-panel-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            max-width: 450px;
            margin: 40px auto;
            background: #2C3E50;
            padding: 25px;
            border-radius: 16px;
            border: 3px solid #FF7043;
            text-align: left;
            color: white;
        }
        .modal-content h3 { color: #FF7043; margin-bottom: 15px; text-align: center; }
        label { font-size: 14px; color: #CFD8DC; display: block; margin-top: 10px; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #90A4AE;
            font-family: 'Mukta', sans-serif;
            font-size: 15px;
            resize: vertical;
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .save-btn { background: #4CAF50; flex: 1; padding: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .close-btn { background: #E53935; flex: 1; padding: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #78909C;
            color: white;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎒 विद्यालय गृहकार्य पोर्टल</h2>
    <div class="subtitle">🏫 सरस्वती माध्यमिक विद्यालय</div>

    <!-- विद्यार्थीले होमवर्क हेर्ने ठाउँ -->
    <div class="homework-box">
        <h3>📌 आजको गृहकार्य</h3>
        <div class="hw-content" id="display-hw-text">
            लोड हुँदैछ... कृपया प्रतीक्षा गर्नुहोस्।
        </div>
    </div>

    <!-- शिक्षक प्यानल खोल्ने बटन -->
    <div class="teacher-section">
        <p style="font-size: 13px; color: #D84315; margin-bottom: 8px; font-weight: bold;">👨‍🏫 शिक्षक तथा प्रशासकका लागि:</p>
        <button class="btn" onclick="checkTeacherPassword()">🔐 होमवर्क अपडेट गर्नुहोस्</button>
    </div>

    <br>
    <a href="https://kids.kamalgc.com.np" class="back-link">⬅️ मुख्य गृहपेजमा फर्कनुहोस्</a>
</div>

<!-- शिक्षक लगइन र होमवर्क हाल्ने प्यानल -->
<div id="teacher-panel-modal">
    <div class="modal-content">
        <h3>🛠️ सरस्वती मा.वि. होमवर्क प्यानल</h3>
        
        <label>📝 आजको गृहकार्यको विवरण लेख्नुहोस्:</label>
        <textarea id="t-hw-input" placeholder="यहाँ गृहकार्य टाइप गर्नुहोस्..."></textarea>

        <div class="modal-btns">
            <button class="save-btn" onclick="saveNewHomework()">💾 सेभ गर्नुहोस्</button>
            <button class="close-btn" onclick="closeTeacherModal()">✖️ बन्द</button>
        </div>
    </div>
</div>

<script>
    // यो स्कुलको लागि छुट्टै युनिक की (Key) ताकि अर्को स्कुलसँग डाटा मिस नहोस्
    const STORAGE_KEY = "hw_sarswati_secondary_school";

    window.onload = function() {
        loadStudentHomework();
    };

    function loadStudentHomework() {
        let savedHomework = localStorage.getItem(STORAGE_KEY);
        let textContainer = document.getElementById('display-hw-text');

        if (savedHomework && savedHomework.trim() !== "") {
            textContainer.innerText = savedHomework;
        } else {
            textContainer.innerHTML = "<span style='color: #78909C;'>आज सरस्वती माध्यमिक विद्यालयको लागि कुनै नयाँ गृहकार्य राखिएको छैन।</span>";
        }
    }

    function checkTeacherPassword() {
        let pin = prompt("कृपया शिक्षक पिन (PIN) प्रविष्ट गर्नुहोस् (डिफल्ट पिन: 9999):");
        if (pin === "9999") {
            document.getElementById('teacher-panel-modal').style.display = 'block';
            let existingHw = localStorage.getItem(STORAGE_KEY) || "";
            document.getElementById('t-hw-input').value = existingHw;
        } else if (pin !== null) {
            alert("❌ गलत पिन!");
        }
    }

    function closeTeacherModal() {
        document.getElementById('teacher-panel-modal').style.display = 'none';
    }

    function saveNewHomework() {
        let hwText = document.getElementById('t-hw-input').value;

        if (!hwText.trim()) {
            alert("कृपया गृहकार्य लेख्नुहोस्!");
            return;
        }

        localStorage.setItem(STORAGE_KEY, hwText);
        alert("✅ गृहकार्य सफलतापूर्वक सेभ भयो!");
        closeTeacherModal();
        loadStudentHomework();
    }
</script>

</body>
</html>
