<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Alphabet - पाठशाला</title>
    <meta name="theme-color" content="#00BCD4">
    <!-- Child-friendly Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Fredoka', 'Mukta', sans-serif;
            background: linear-gradient(180deg, #E0F7FA 0%, #B2EBF2 100%);
            margin: 0;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #FFFFFF;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #00838F; 
            margin: 0; 
            font-size: 20px; 
            font-weight: 700;
        }
        .home-btn {
            background-color: #00BCD4;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 3px 0 #00838F;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Tab Buttons */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #FFFFFF;
            color: #00838F;
            border: 3px solid #4DD0E1;
            padding: 8px 18px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #00ACC1;
            transition: all 0.1s ease;
        }
        .tab-btn.active {
            background-color: #00BCD4;
            color: white;
            border-color: #00ACC1;
            box-shadow: 0 4px 0 #00838F;
        }
        .tab-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #00838F;
        }

        /* Grid Layout */
        .grid-container {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: auto;
        }
        .grid-container.active {
            display: grid;
        }

        /* 3D Soft Card Style */
        .card {
            background-color: #FFFFFF;
            color: #00838F;
            border: 3px solid #4DD0E1;
            border-radius: 18px;
            padding: 15px 10px;
            box-shadow: 0 6px 0 #00ACC1, 0 8px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #00ACC1, 0 3px 6px rgba(0,0,0,0.1);
            background-color: #E0F7FA;
        }

        /* Large Emoji Style */
        .emoji-box {
            font-size: 55px;
            line-height: 1.1;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .letter-title {
            font-size: 22px;
            font-weight: 700;
            color: #006064;
            line-height: 1.2;
        }

        .word-title {
            font-size: 15px;
            font-weight: 600;
            color: #00838F;
        }
    </style>
    <script>
        function speakText(text) {
            window.speechSynthesis.cancel();
            
            // वाक्यमा 'Z,' वा 'z,' छ भने त्यसलाई 'Zed,' (जेट) बनाउने
            let updatedText = text.replace(/^Z,/i, 'Zed,');

            let speech = new SpeechSynthesisUtterance(updatedText);
            speech.lang = 'en-GB'; // ब्रिटिस अङ्ग्रेजी प्रयोग गर्दा 'जेट' उच्चारण आउँछ
            speech.rate = 0.85;
            speech.pitch = 1.1;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>ABCD Alphabet</h2>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('upper', event)">Capital (A-Z)</button>
        <button class="tab-btn" onclick="switchTab('lower', event)">Small (a-z)</button>
    </div>

    <div class="grid-container active" id="upperGrid"></div>
    <div class="grid-container" id="lowerGrid"></div>

    <script>
        // Alphabet Data with Emoji
        const alphabetData = [
            { letter: 'A', word: 'Apple', emoji: '🍎' },
            { letter: 'B', word: 'Ball', emoji: '⚽' },
            { letter: 'C', word: 'Cat', emoji: '🐱' },
            { letter: 'D', word: 'Dog', emoji: '🐶' },
            { letter: 'E', word: 'Elephant', emoji: '🐘' },
            { letter: 'F', word: 'Fish', emoji: '🐟' },
            { letter: 'G', word: 'Grapes', emoji: '🍇' },
            { letter: 'H', word: 'Horse', emoji: '🐎' },
            { letter: 'I', word: 'Ice cream', emoji: '🍦' },
            { letter: 'J', word: 'Jug', emoji: '🏺' },
            { letter: 'K', word: 'Kite', emoji: '🪁' },
            { letter: 'L', word: 'Lion', emoji: '🦁' },
            { letter: 'M', word: 'Monkey', emoji: '🐒' },
            { letter: 'N', word: 'Nest', emoji: '🪺' },
            { letter: 'O', word: 'Owl', emoji: '🦉' },
            { letter: 'P', word: 'Parrot', emoji: '🦜' },
            { letter: 'Q', word: 'Queen', emoji: '👑' },
            { letter: 'R', word: 'Rose', emoji: '🌹' },
            { letter: 'S', word: 'Sun', emoji: '☀️' },
            { letter: 'T', word: 'Tree', emoji: '🌳' },
            { letter: 'U', word: 'Umbrella', emoji: '☂️' },
            { letter: 'V', word: 'Van', emoji: '🚐' },
            { letter: 'W', word: 'Watch', emoji: '⌚' },
            { letter: 'X', word: 'Xylophone', emoji: '🎼' },
            { letter: 'Y', word: 'Yak', emoji: '🐂' },
            { letter: 'Z', word: 'Zebra', emoji: '🦓' }
        ];

        const upperGrid = document.getElementById('upperGrid');
        const lowerGrid = document.getElementById('lowerGrid');

        alphabetData.forEach(item => {
            // Capital Card
            const upperCard = document.createElement('div');
            upperCard.className = 'card';
            upperCard.innerHTML = `
                <div class="emoji-box">${item.emoji}</div>
                <div class="letter-title">${item.letter}</div>
                <div class="word-title">${item.word}</div>
            `;
            upperCard.addEventListener('click', () => speakText(`${item.letter}, for ${item.word}`));
            upperGrid.appendChild(upperCard);

            // Small Card
            const lowerCard = document.createElement('div');
            lowerCard.className = 'card';
            lowerCard.innerHTML = `
                <div class="emoji-box">${item.emoji}</div>
                <div class="letter-title">${item.letter.toLowerCase()}</div>
                <div class="word-title">${item.word}</div>
            `;
            lowerCard.addEventListener('click', () => speakText(`${item.letter.toLowerCase()}, for ${item.word}`));
            lowerGrid.appendChild(lowerCard);
        });

        function switchTab(type, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.grid-container').forEach(grid => grid.classList.remove('active'));
            event.target.classList.add('active');
            if (type === 'upper') {
                document.getElementById('upperGrid').classList.add('active');
            } else {
                document.getElementById('lowerGrid').classList.add('active');
            }
        }
    </script>

</body>
</html>
