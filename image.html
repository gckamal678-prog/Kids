<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Alphabet with HD Pictures - पाठशाला</title>
    <meta name="theme-color" content="#ff9933">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 15px auto;
        }
        h2 { color: #d35400; margin: 0; font-size: 18px; }
        .home-btn {
            background-color: #e67e22;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #bdc3c7;
            color: #2c3e50;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: #2980b9;
            color: white;
        }
        .grid-container {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: auto;
        }
        .grid-container.active {
            display: grid;
        }
        .card {
            background-color: #ffffff;
            color: #2c3e50;
            border: 3px solid #2980b9;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active {
            background-color: #ebf5fb;
            transform: scale(0.95);
        }
        .card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .text-content {
            font-size: 20px;
            font-weight: bold;
            color: #d35400;
        }
    </style>
    <script>
        function speakText(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'en-US';
            speech.rate = 0.85;
            speech.pitch = 1.1;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>ABCD with HD Pictures</h2>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('upper', event)">Capital (A-Z)</button>
        <button class="tab-btn" onclick="switchTab('lower', event)">Small (a-z)</button>
    </div>

    <div class="grid-container active" id="upperGrid"></div>
    <div class="grid-container" id="lowerGrid"></div>

    <script>
        // A देखि Z सम्मका HD चित्रहरूको लिङ्क (Wikimedia Commons / Free educational image URLs)
        const alphabetData = [
            { letter: 'A', word: 'Apple', img: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Red_Apple.jpg' },
            { letter: 'B', word: 'Ball', img: 'https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg' },
            { letter: 'C', word: 'Cat', img: 'https://upload.wikimedia.org/wikipedia/commons/b/b6/Felis_catus-cat_on_snow.jpg' },
            { letter: 'D', word: 'Dog', img: 'https://upload.wikimedia.org/wikipedia/commons/7/7f/Basset_Hound_profil.jpg' },
            { letter: 'E', word: 'Elephant', img: 'https://upload.wikimedia.org/wikipedia/commons/3/37/African_Bush_Elephant.jpg' },
            { letter: 'F', word: 'Fish', img: 'https://upload.wikimedia.org/wikipedia/commons/3/32/Goldfish3.jpg' },
            { letter: 'G', word: 'Grapes', img: 'https://upload.wikimedia.org/wikipedia/commons/b/bb/Grapes_white_background.jpg' },
            { letter: 'H', word: 'Horse', img: 'https://upload.wikimedia.org/wikipedia/commons/e/e4/Pony_in_Duhallow_County_Cork.jpg' },
            { letter: 'I', word: 'Ice cream', img: 'https://upload.wikimedia.org/wikipedia/commons/d/da/Ice_cream_cone_chocolate_vanilla.jpg' },
            { letter: 'J', word: 'Jug', img: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Clay_Jug.jpg' },
            { letter: 'K', word: 'Kite', img: 'https://upload.wikimedia.org/wikipedia/commons/9/96/Kite_flying_in_Thailand.jpg' },
            { letter: 'L', word: 'Lion', img: 'https://upload.wikimedia.org/wikipedia/commons/7/73/Lion_waiting_in_Namibia.jpg' },
            { letter: 'M', word: 'Monkey', img: 'https://upload.wikimedia.org/wikipedia/commons/3/35/Vervet_Monkey_%28Chlorocebus_pygerythrus%29_side.jpg' },
            { letter: 'N', word: 'Nest', img: 'https://upload.wikimedia.org/wikipedia/commons/7/7c/Bird_nest_with_eggs_by_Piotr_Kuczynski.jpg' },
            { letter: 'O', word: 'Owl', img: 'https://upload.wikimedia.org/wikipedia/commons/5/52/Athene_noctua_standing_on_a_stone.jpg' },
            { letter: 'P', word: 'Parrot', img: 'https://upload.wikimedia.org/wikipedia/commons/1/1b/Ara_macao_side.jpg' },
            { letter: 'Q', word: 'Queen', img: 'https://upload.wikimedia.org/wikipedia/commons/5/54/Queen_Elizabeth_II_in_March_2015.jpg' },
            { letter: 'R', word: 'Rose', img: 'https://upload.wikimedia.org/wikipedia/commons/e/e6/Rosa_rubiginosa_1.jpg' },
            { letter: 'S', word: 'Sun', img: 'https://upload.wikimedia.org/wikipedia/commons/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Discovery_Observatory_-_20100819.jpg' },
            { letter: 'T', word: 'Tree', img: 'https://upload.wikimedia.org/wikipedia/commons/e/eb/Ash_Tree_-_geograph.org.uk_-_590710.jpg' },
            { letter: 'U', word: 'Umbrella', img: 'https://upload.wikimedia.org/wikipedia/commons/9/91/Open_umbrella_on_white_background.jpg' },
            { letter: 'V', word: 'Van', img: 'https://upload.wikimedia.org/wikipedia/commons/4/4e/Ford_Transit_delivery_van_%2827981504106%29.jpg' },
            { letter: 'W', word: 'Watch', img: 'https://upload.wikimedia.org/wikipedia/commons/8/8c/Wristwatch_with_leather_strap.jpg' },
            { letter: 'X', word: 'Xylophone', img: 'https://upload.wikimedia.org/wikipedia/commons/6/6f/Xylophone1.jpg' },
            { letter: 'Y', word: 'Yak', img: 'https://upload.wikimedia.org/wikipedia/commons/6/62/Domestic_yak_Bos_mutus_at_Yamdrok_Lake.jpg' },
            { letter: 'Z', word: 'Zebra', img: 'https://upload.wikimedia.org/wikipedia/commons/e/e4/Zebra_Botswana_Chobe.jpg' }
        ];

        const upperGrid = document.getElementById('upperGrid');
        const lowerGrid = document.getElementById('lowerGrid');

        alphabetData.forEach(item => {
            // क्यापिटल कार्ड
            const upperCard = document.createElement('div');
            upperCard.className = 'card';
            upperCard.innerHTML = `
                <img src="${item.img}" alt="${item.word}" loading="lazy">
                <div class="text-content">${item.letter} - ${item.word}</div>
            `;
            upperCard.addEventListener('click', () => speakText(`${item.letter}, ${item.word}`));
            upperGrid.appendChild(upperCard);

            // स्मल कार्ड
            const lowerCard = document.createElement('div');
            lowerCard.className = 'card';
            lowerCard.innerHTML = `
                <img src="${item.img}" alt="${item.word}" loading="lazy">
                <div class="text-content">${item.letter.toLowerCase()} - ${item.word}</div>
            `;
            lowerCard.addEventListener('click', () => speakText(`${item.letter.toLowerCase()}, ${item.word}`));
            lowerGrid.appendChild(lowerCard);
        });


        function switchTab(type, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.grid-container').forEach(grid => grid.classList.remove('active'));
            event.target.classList.add('active');
            if (type === 'upper') {
                document.getElementById('upperGrid').classList.add('active');
            } else {
                document.getElementById('lowerGrid').classList.add('active');
            }
        }
    </script>

</body>
</html>
