<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>सवारी साधनहरू - पाठशाला</title>
    <meta name="theme-color" content="#0288D1">
    <!-- Child-friendly Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #E1F5FE 0%, #B3E5FC 100%);
            margin: 0;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #FFFFFF;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #0277BD; 
            margin: 0; 
            font-size: 20px; 
            font-weight: 800;
        }
        .home-btn {
            background-color: #0288D1;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 3px 0 #01579B;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: auto;
        }

        /* 3D Soft Card Style */
        .card {
            background-color: #FFFFFF;
            color: #0277BD;
            border: 3px solid #81D4FA;
            border-radius: 18px;
            padding: 15px 10px;
            box-shadow: 0 6px 0 #0288D1, 0 8px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0288D1, 0 3px 6px rgba(0,0,0,0.1);
            background-color: #E1F5FE;
        }

        /* Large Emoji Style */
        .emoji-box {
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .name-nepali {
            font-size: 22px;
            font-weight: 800;
            color: #01579B;
            line-height: 1.2;
        }

        .name-english {
            font-size: 15px;
            font-weight: 700;
            color: #0288D1;
        }
    </style>

    <!-- ElevenLabs को लागि script.js जोडिएको -->
    <script src="script.js"></script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>सवारी साधनहरू (Vehicles)</h2>
    </div>

    <div class="grid-container" id="vehiclesGrid"></div>

    <script>
        // सवारी साधनहरूको डाटा
        const vehiclesData = [
            { name: 'साइकल', eng: 'Bicycle', emoji: '🚲' },
            { name: 'मोटरसाइकल', eng: 'Motorcycle', emoji: '🏍️' },
            { name: 'कार', eng: 'Car', emoji: '🚗' },
            { name: 'बस', eng: 'Bus', emoji: '🚌' },
            { name: 'ट्रक', eng: 'Truck', emoji: '🚚' },
            { name: 'ट्याक्टर', eng: 'Tractor', emoji: '🚜' },
            { name: 'हवाइजहाज', eng: 'Aeroplane', emoji: '✈️' },
            { name: 'हेलिकप्टर', eng: 'Helicopter', emoji: '🚁' },
            { name: 'रेलगाडी', eng: 'Train', emoji: '🚆' },
            { name: 'डुङ्गा', eng: 'Boat', emoji: '🛶' },
            { name: 'पानीजहाज', eng: 'Ship', emoji: '🚢' },
            { name: 'अटो', eng: 'Auto Rickshaw', emoji: '🛺' }
        ];

        const vehiclesGrid = document.getElementById('vehiclesGrid');

        vehiclesData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="emoji-box">${item.emoji}</div>
                <div class="name-nepali">${item.name}</div>
                <div class="name-english">(${item.eng})</div>
            `;
            // playAIVoice प्रयोग गरिएको
            card.addEventListener('click', () => playAIVoice(item.name));
            vehiclesGrid.appendChild(card);
        });
    </script>

</body>
</html>
