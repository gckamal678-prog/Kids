<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>सवारी साधनहरू - पाठशाला</title>
    <meta name="theme-color" content="#ff9933">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 15px auto;
        }
        h2 { color: #d35400; margin: 0; font-size: 18px; }
        .home-btn {
            background-color: #e67e22;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .section-title {
            color: #2980b9;
            background-color: #ebf5fb;
            padding: 10px;
            border-radius: 10px;
            font-size: 18px;
            margin: 25px auto 15px auto;
            max-width: 600px;
            border: 2px solid #2980b9;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: auto;
        }
        .card {
            background-color: #ffffff;
            color: #2c3e50;
            border: 3px solid #2980b9;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active {
            background-color: #ebf5fb;
            transform: scale(0.95);
        }
        .card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .text-content {
            font-size: 18px;
            font-weight: bold;
            color: #d35400;
        }
    </style>
    <script>
        function speakNepali(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ne-NP';
            speech.rate = 0.85;
            speech.pitch = 1.1;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>सवारी साधनहरू (Vehicles)</h2>
    </div>

    <div class="section-title">🚗 मुख्य सवारी साधनहरू</div>
    <div class="grid-container" id="vehiclesGrid"></div>

    <script>
        const vehiclesData = [
            { name: 'साइक्कल', img: 'https://upload.wikimedia.org/wikipedia/commons/4/41/Left_side_of_Flying_Pigeon_bicycle.jpg' },
            { name: 'मोटरसाइकल', img: 'https://upload.wikimedia.org/wikipedia/commons/f/fc/Yamaha_YZF-R1_2009.jpg' },
            { name: 'कार', img: 'https://upload.wikimedia.org/wikipedia/commons/c/c9/2015_Tesla_Model_S_70D_Front.jpg' },
            { name: 'बस', img: 'https://upload.wikimedia.org/wikipedia/commons/3/34/Bus_London_k_mb.jpg' },
            { name: 'ट्रक', img: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Volvo_FH16_%282012%29.jpg' },
            { name: 'ट्याक्टर', img: 'https://upload.wikimedia.org/wikipedia/commons/7/7f/Tractor_in_Paddy_field.jpg' },
            { name: 'हवाइजहाज', img: 'https://upload.wikimedia.org/wikipedia/commons/d/d1/Boeing_777-3ER_Emirates_A6-ECU_JFK.jpg' },
            { name: 'हेलिकप्टर', img: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Eurocopter_EC135.jpg' },
            { name: 'रेलगाडी', img: 'https://upload.wikimedia.org/wikipedia/commons/6/6d/Train_on_the_Wuhan-Guangzhou_High-Speed_Railway.jpg' },
            { name: 'डुङ्गा', img: 'https://upload.wikimedia.org/wikipedia/commons/9/91/Wooden_boat_on_Dal_lake.jpg' }
        ];

        const vehiclesGrid = document.getElementById('vehiclesGrid');
        vehiclesData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${item.img}" alt="${item.name}" loading="lazy">
                <div class="text-content">${item.name}</div>
            `;
            card.addEventListener('click', () => speakNepali(item.name));
            vehiclesGrid.appendChild(card);
        });
    </script>

</body>
</html>
