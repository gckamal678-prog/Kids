<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>जनावर र पन्छीहरू - पाठशाला</title>
    <meta name="theme-color" content="#4CAF50">
    <!-- Child-friendly Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 100%);
            margin: 0;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #FFFFFF;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #2E7D32; 
            margin: 0; 
            font-size: 20px; 
            font-weight: 800;
        }
        .home-btn {
            background-color: #4CAF50;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 3px 0 #1B5E20;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Section Titles */
        .section-title {
            color: #1B5E20;
            background: #FFFFFF;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 19px;
            font-weight: 800;
            margin: 20px auto 15px auto;
            max-width: 600px;
            border: 3px solid #81C784;
            box-shadow: 0 4px 0 #388E3C;
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: auto;
        }

        /* 3D Soft Card Style */
        .card {
            background-color: #FFFFFF;
            color: #2E7D32;
            border: 3px solid #81C784;
            border-radius: 18px;
            padding: 15px 10px;
            box-shadow: 0 6px 0 #388E3C, 0 8px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #388E3C, 0 3px 6px rgba(0,0,0,0.1);
            background-color: #F1F8E9;
        }

        /* Large Emoji Style */
        .emoji-box {
            font-size: 55px;
            line-height: 1.1;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .np-name {
            font-size: 20px;
            font-weight: 800;
            color: #1B5E20;
            line-height: 1.2;
        }

        .en-name {
            font-size: 14px;
            font-weight: 700;
            color: #558B2F;
            font-family: 'Fredoka', sans-serif;
        }
    </style>
    <script>
        function speakNepali(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ne-NP';
            speech.rate = 0.85;
            speech.pitch = 1.1;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>जनावर र पन्छीहरू</h2>
    </div>

    <!-- पाल्तु तथा जङ्गली जनावर सेक्सन -->
    <div class="section-title">🐅 जनावरहरू (Animals)</div>
    <div class="grid-container" id="animalsGrid"></div>

    <!-- पन्छीहरू सेक्सन -->
    <div class="section-title">🦅 पन्छीहरू (Birds)</div>
    <div class="grid-container" id="birdsGrid"></div>

    <script>
        // जनावरहरूको सूची (Emoji सहित)
        const animalsData = [
            { np: 'बाघ', en: 'Tiger', emoji: '🐅' },
            { np: 'सिंह', en: 'Lion', emoji: '🦁' },
            { np: 'हात्ती', en: 'Elephant', emoji: '🐘' },
            { np: 'गाई', en: 'Cow', emoji: '🐄' },
            { np: 'भैंसी', en: 'Buffalo', emoji: '🐃' },
            { np: 'घोडा', en: 'Horse', emoji: '🐎' },
            { np: 'कुकुर', en: 'Dog', emoji: '🐕' },
            { np: 'बिरालो', en: 'Cat', emoji: '🐈' },
            { np: 'बाख्रा', en: 'Goat', emoji: '🐐' },
            { np: 'बाँदर', en: 'Monkey', emoji: '🐒' },
            { np: 'भालु', en: 'Bear', emoji: '🐻' },
            { np: 'खरायो', en: 'Rabbit', emoji: '🐇' }
        ];

        // पन्छीहरूको सूची (Emoji सहित)
        const birdsData = [
            { np: 'सुगा', en: 'Parrot', emoji: '🦜' },
            { np: 'मजुर', en: 'Peacock', emoji: '🦚' },
            { np: 'उल्लु', en: 'Owl', emoji: '🦉' },
            { np: 'परेवा', en: 'Pigeon', emoji: '🕊️' },
            { np: 'हाँस', en: 'Duck', emoji: '🦆' },
            { np: 'कुखुरा', en: 'Rooster', emoji: '🐓' },
            { np: 'भँगेरा', en: 'Sparrow', emoji: '🐦' },
            { np: 'चील', en: 'Eagle', emoji: '🦅' },
            { np: 'फ्लेमिङ्गो', en: 'Flamingo', emoji: '🦩' },
            { np: 'पेन्गुइन', en: 'Penguin', emoji: '🐧' }
        ];

        // जनावर लोड गर्ने
        const animalsGrid = document.getElementById('animalsGrid');
        animalsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="emoji-box">${item.emoji}</div>
                <div class="np-name">${item.np}</div>
                <div class="en-name">${item.en}</div>
            `;
            card.addEventListener('click', () => speakNepali(item.np));
            animalsGrid.appendChild(card);
        });

        // पन्छी लोड गर्ने
        const birdsGrid = document.getElementById('birdsGrid');
        birdsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="emoji-box">${item.emoji}</div>
                <div class="np-name">${item.np}</div>
                <div class="en-name">${item.en}</div>
            `;
            card.addEventListener('click', () => speakNepali(item.np));
            birdsGrid.appendChild(card);
        });
    </script>

</body>
</html>
