<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>स्वर वर्ण - पाठशाला</title>
    <meta name="theme-color" content="#ff9933">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }
        h2 { color: #d35400; margin: 0; }
        .home-btn {
            background-color: #e67e22;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        
        /* ग्रिड लेआउट - स्वर वर्णहरू देखाउन */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: auto;
        }

        /* अक्षरको बक्स */
        .letter-card {
            background-color: #ffffff;
            color: #2c3e50;
            border: 3px solid #ff9933;
            border-radius: 15px;
            padding: 20px 0;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
        }
        .letter-card:active {
            background-color: #ffe5cc;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>स्वर वर्ण (अ - अः)</h2>
    </div>

    <div class="grid-container" id="vowelsGrid">
        <!-- JavaScript बाट अक्षरहरू यहाँ लोड हुन्छन् -->
    </div>

    <script>
        const vowels = ['अ', 'आ', 'इ', 'ई', 'उ', 'ऊ', 'ऋ', 'ए', 'ऐ', 'ओ', 'औ', 'अं', 'अः'];
        const grid = document.getElementById('vowelsGrid');

        vowels.forEach(letter => {
            const div = document.createElement('div');
            div.className = 'letter-card';
            div.innerText = letter;
            
            // भविष्यमा अडियो प्ले गर्ने वा अन्य फिचर थप्न मिल्ने ठाउँ
            div.addEventListener('click', () => {
                console.log(letter + ' थिचियो');
            });

            grid.appendChild(div);
        });
    </script>

</body>
</html>
