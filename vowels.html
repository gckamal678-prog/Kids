<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>स्वर वर्ण - पाठशाला</title>
    <meta name="theme-color" content="#FF9800">
    <!-- Friendly Typography Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', sans-serif;
            background: linear-gradient(180deg, #FFF3E0 0%, #FFE0B2 100%);
            margin: 0;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 20px auto;
            background: #FFFFFF;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #E65100; 
            margin: 0; 
            font-size: 22px;
            font-weight: 800;
        }
        .home-btn {
            background-color: #FF9800;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 3px 0 #E65100;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        
        /* ग्रिड लेआउट - स्वर वर्णहरू देखाउन */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: auto;
        }

        /* Child-friendly 3D Letter Card */
        .letter-card {
            background-color: #FFFFFF;
            color: #D84315;
            border: 3px solid #FFB74D;
            border-radius: 18px;
            padding: 15px 0;
            font-size: 42px;
            font-weight: 800;
            box-shadow: 0 6px 0 #F57C00, 0 8px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* थिच्दा (Click गर्दा) Bounce/Press इफेक्ट */
        .letter-card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #F57C00, 0 3px 6px rgba(0,0,0,0.1);
            background-color: #FFF8E1;
        }
    </style>
    <script>
        function speakText(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ne-NP';
            speech.rate = 0.85;
            speech.pitch = 1.1;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>स्वर वर्ण (अ - अः)</h2>
    </div>

    <div class="grid-container" id="vowelsGrid">
        <!-- JavaScript बाट अक्षरहरू यहाँ लोड हुन्छन् -->
    </div>

    <script>
        const vowels = ['अ', 'आ', 'इ', 'ई', 'उ', 'ऊ', 'ऋ', 'ए', 'ऐ', 'ओ', 'औ', 'अं', 'अः'];
        const grid = document.getElementById('vowelsGrid');

        vowels.forEach(letter => {
            const div = document.createElement('div');
            div.className = 'letter-card';
            div.innerText = letter;
            
            // अक्षरमा क्लिक गर्दा आवाज आउने
            div.addEventListener('click', () => {
                speakText(letter);
            });

            grid.appendChild(div);
        });
    </script>

</body>
</html>
