
<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15803d">
  <title>जनावर र पन्छीहरू — बाल पाठशाला</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="../script.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #effaf1;
      --surface: #fff;
      --text: #17452a;
      --muted: #537460;
      --accent: #16803d;
      --border: #c7e8cf;
      --shadow: 0 5px 0 #c5e5cc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 14px;
      font-family: 'Mukta', sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #e9f9ed, var(--bg));
    }
    .wrap { max-width: 900px; margin: auto; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 5px 18px #14532d0d;
    }
    .home {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 9px 12px;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      text-decoration: none;
      font-weight: 800;
    }
    h1 {
      margin: 0;
      text-align: right;
      font-size: clamp(18px, 4vw, 27px);
      line-height: 1.35;
    }
    .intro {
      margin: 15px 0;
      padding: 17px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
    }
    .intro .big { font-size: 38px; }
    .intro p { margin: 5px 0 0; color: var(--muted); }
    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 14px 0 20px;
    }
    .tool {
      padding: 9px 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font: 700 15px 'Mukta', sans-serif;
      cursor: pointer;
    }
    .tool.active, .tool:focus-visible {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 24px 0 13px;
      padding: 12px 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      font-size: 20px;
      font-weight: 800;
    }
    .section-title span { font-size: 28px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .card {
      min-width: 0;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 14px 8px;
      border: 2px solid var(--border);
      border-radius: 19px;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
      cursor: pointer;
      font-family: inherit;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:active { transform: translateY(3px); box-shadow: none; }
    .card:focus-visible, .tool:focus-visible, .home:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }
    .emoji { font-size: 48px; line-height: 1.2; }
    .np { font-size: 20px; font-weight: 800; line-height: 1.35; }
    .en {
      color: var(--muted);
      font: 600 17px 'Fredoka', sans-serif;
    }
    .sound-hint { color: var(--muted); font-size: 12px; }
    .practice {
      margin: 26px 0 10px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
    }
    .practice h2 { margin: 0 0 8px; font-size: 21px; }
    .question { margin: 8px 0 14px; font-size: 18px; font-weight: 700; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
    .answer {
      min-height: 46px;
      padding: 9px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font: 700 16px 'Mukta', sans-serif;
      cursor: pointer;
    }
    .answer:disabled { cursor: default; opacity: .85; }
    .answer.correct { border-color: #16a34a; background: #dcfce7; color: #14532d; }
    .answer.wrong { border-color: #dc2626; background: #fee2e2; color: #7f1d1d; }
    .feedback { min-height: 30px; margin: 12px 0 0; font-weight: 800; }
    .next {
      display: block;
      margin: 10px auto 0;
      padding: 10px 18px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      font: 800 16px 'Mukta', sans-serif;
      cursor: pointer;
    }
    footer { padding: 20px 0 8px; text-align: center; color: var(--muted); }
    body.dark {
      color-scheme: dark;
      --bg: #101b16;
      --surface: #1a2b21;
      --text: #e4f5e8;
      --muted: #b1cbb9;
      --accent: #269b50;
      --border: #355b41;
      --shadow: 0 5px 0 #14271a;
      background: var(--bg);
    }
    body.dark .answer.correct { background: #164329; color: #d1fae5; }
    body.dark .answer.wrong { background: #4b2020; color: #fee2e2; }
    @media (min-width: 520px) {
      .grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
    @media (min-width: 760px) {
      .grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <a class="home" href="../index.html">🏠 होम</a>
      <h1>🐾 जनावर र पन्छीहरू</h1>
    </header>

    <section class="intro">
      <div class="big" aria-hidden="true">🦁 🐘 🦜</div>
      <strong>हेरौँ, पढौँ र खेल्दै सिकौँ!</strong>
      <p>नेपाली नाम र English नाम सिक्न कुनै कार्ड थिच्नुहोस्।</p>
    </section>

    <div class="tools" aria-label="पाठका विकल्प">
      <button class="tool active" id="allBtn" type="button">सबै देखाउने</button>
      <button class="tool" id="npBtn" type="button">नेपाली नाम</button>
      <button class="tool" id="enBtn" type="button">English नाम</button>
      <button class="tool" id="themeBtn" type="button">🌙 Dark Mode</button>
    </div>

    <section aria-labelledby="animalsTitle">
      <h2 class="section-title" id="animalsTitle"><span>🐯</span> जनावरहरू (Animals)</h2>
      <div class="grid" id="animalsGrid"></div>
    </section>

    <section aria-labelledby="birdsTitle">
      <h2 class="section-title" id="birdsTitle"><span>🦜</span> पन्छीहरू (Birds)</h2>
      <div class="grid" id="birdsGrid"></div>
    </section>

    <section class="practice" aria-labelledby="practiceTitle">
      <h2 id="practiceTitle">🎯 सानो क्विज</h2>
      <p class="question" id="question">प्रश्न तयार हुँदैछ...</p>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <button class="next" id="nextBtn" type="button" hidden>अर्को प्रश्न ➜</button>
    </section>

    <footer>🌟 बाल पाठशाला — खेल्दै सिकौँ, सिक्दै रमाऔँ!</footer>
  </div>

  <script>
    (() => {
      "use strict";

      const animals = [
        { np: "बाघ", en: "Tiger", emoji: "🐅" },
        { np: "सिंह", en: "Lion", emoji: "🦁" },
        { np: "हात्ती", en: "Elephant", emoji: "🐘" },
        { np: "गाई", en: "Cow", emoji: "🐄" },
        { np: "भैंसी", en: "Buffalo", emoji: "🐃" },
        { np: "घोडा", en: "Horse", emoji: "🐎" },
        { np: "कुकुर", en: "Dog", emoji: "🐕" },
        { np: "बिरालो", en: "Cat", emoji: "🐈" },
        { np: "बाख्रा", en: "Goat", emoji: "🐐" },
        { np: "बाँदर", en: "Monkey", emoji: "🐒" },
        { np: "भालु", en: "Bear", emoji: "🐻" },
        { np: "खरायो", en: "Rabbit", emoji: "🐇" }
      ];

      const birds = [
        { np: "सुगा", en: "Parrot", emoji: "🦜" },
        { np: "मयूर", en: "Peacock", emoji: "🦚" },
        { np: "उल्लु", en: "Owl", emoji: "🦉" },
        { np: "परेवा", en: "Pigeon", emoji: "🕊️" },
        { np: "हाँस", en: "Duck", emoji: "🦆" },
        { np: "भाले", en: "Rooster", emoji: "🐓" },
        { np: "भँगेरा", en: "Sparrow", emoji: "🐦" },
        { np: "चील", en: "Eagle", emoji: "🦅" },
        { np: "फ्लेमिङ्गो", en: "Flamingo", emoji: "🦩" },
        { np: "पेन्गुइन", en: "Penguin", emoji: "🐧" }
      ];

      const allItems = [...animals, ...birds];
      const animalsGrid = document.getElementById("animalsGrid");
      const birdsGrid = document.getElementById("birdsGrid");
      let displayMode = "all";

      function playVoice(text) {
        // Use the site's configured AI voice only; no browser TTS or alternate endpoint.
        if (typeof window.playAIVoice === "function") {
          window.playAIVoice(text);
        } else {
          const feedback = document.getElementById("feedback");
          feedback.textContent = "आवाज सेवा अहिले उपलब्ध छैन।";
        }
      }

      function createCard(item) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "card";
        button.setAttribute("aria-label", item.np + ", " + item.en + ". आवाज सुन्न थिच्नुहोस्।");

        const emoji = document.createElement("span");
        emoji.className = "emoji";
        emoji.textContent = item.emoji;

        const np = document.createElement("span");
        np.className = "np";
        np.textContent = item.np;

        const en = document.createElement("span");
        en.className = "en";
        en.textContent = item.en;

        const hint = document.createElement("span");
        hint.className = "sound-hint";
        hint.textContent = "🔊 सुन्न थिच्नुहोस्";

        button.append(emoji, np, en, hint);
        button.addEventListener("click", () => {
          const phrase = displayMode === "np" ? item.np
            : displayMode === "en" ? item.en
            : item.en + ". " + item.np;
          playVoice(phrase);
        });
        return button;
      }

      function render() {
        animalsGrid.replaceChildren(...animals.map(createCard));
        birdsGrid.replaceChildren(...birds.map(createCard));

        document.querySelectorAll(".np").forEach(el => {
          el.hidden = displayMode === "en";
        });
        document.querySelectorAll(".en").forEach(el => {
          el.hidden = displayMode === "np";
        });
        document.querySelectorAll(".sound-hint").forEach(el => {
          el.hidden = displayMode !== "all";
        });
      }

      const modeButtons = [
        ["allBtn", "all"],
        ["npBtn", "np"],
        ["enBtn", "en"]
      ];
      modeButtons.forEach(([id, mode]) => {
        document.getElementById(id).addEventListener("click", () => {
          displayMode = mode;
          modeButtons.forEach(([buttonId, buttonMode]) => {
            document.getElementById(buttonId).classList.toggle("active", buttonMode === mode);
          });
          render();
        });
      });

      const themeBtn = document.getElementById("themeBtn");
      function applyTheme(dark) {
        document.body.classList.toggle("dark", dark);
        themeBtn.textContent = dark ? "☀️ Light Mode" : "🌙 Dark Mode";
        try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (_) {}
      }
      try {
        applyTheme(localStorage.getItem("theme") === "dark");
      } catch (_) {
        applyTheme(false);
      }
      themeBtn.addEventListener("click", () => {
        applyTheme(!document.body.classList.contains("dark"));
      });

      const questions = [
        { q: "Which animal is called सिंह?", options: ["Lion", "Tiger", "Cow", "Goat"], answer: "Lion" },
        { q: "गाईलाई English मा के भनिन्छ?", options: ["Horse", "Cow", "Dog", "Bear"], answer: "Cow" },
        { q: "Which bird is called सुगा?", options: ["Owl", "Duck", "Parrot", "Eagle"], answer: "Parrot" },
        { q: "खरायोको English नाम कुन हो?", options: ["Rabbit", "Monkey", "Buffalo", "Tiger"], answer: "Rabbit" },
        { q: "Which bird is called मयूर?", options: ["Pigeon", "Peacock", "Penguin", "Sparrow"], answer: "Peacock" },
        { q: "हात्तीलाई English मा के भनिन्छ?", options: ["Elephant", "Lion", "Cat", "Goat"], answer: "Elephant" },
        { q: "Which animal is called बिरालो?", options: ["Dog", "Bear", "Cat", "Horse"], answer: "Cat" },
        { q: "Which bird is called हाँस?", options: ["Eagle", "Duck", "Parrot", "Owl"], answer: "Duck" }
      ];

      let quizIndex = 0;
      let score = 0;
      let answered = false;
      let quizOrder = [];

      const questionEl = document.getElementById("question");
      const answersEl = document.getElementById("answers");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");

      function startQuiz() {
        quizOrder = questions.map((_, i) => i).sort(() => Math.random() - 0.5);
        quizIndex = 0;
        score = 0;
        showQuestion();
      }

      function showQuestion() {
        answered = false;
        const item = questions[quizOrder[quizIndex]];
        questionEl.textContent = `प्रश्न ${quizIndex + 1}/${questions.length}: ${item.q}`;
        answersEl.replaceChildren();
        feedbackEl.textContent = "";
        nextBtn.hidden = true;

        item.options.forEach(option => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.textContent = option;
          button.addEventListener("click", () => chooseAnswer(button, option, item.answer));
          answersEl.appendChild(button);
        });
      }

      function chooseAnswer(button, choice, correct) {
        if (answered) return;
        answered = true;
        const isCorrect = choice === correct;
        if (isCorrect) {
          score++;
          feedbackEl.textContent = "🎉 सही उत्तर! शाबास!";
        } else {
          feedbackEl.textContent = "🙂 सही उत्तर: " + correct;
        }

        [...answersEl.children].forEach(el => {
          el.disabled = true;
          if (el.textContent === correct) el.classList.add("correct");
        });
        if (!isCorrect) button.classList.add("wrong");

        nextBtn.textContent = quizIndex === questions.length - 1 ? "फेरि खेलौँ ↻" : "अर्को प्रश्न ➜";
        nextBtn.hidden = false;
      }

      nextBtn.addEventListener("click", () => {
        if (quizIndex < questions.length - 1) {
          quizIndex++;
          showQuestion();
        } else {
          questionEl.textContent = `क्विज सकियो! ${questions.length} मध्ये ${score} सही उत्तर।`;
          answersEl.replaceChildren();
          feedbackEl.textContent = score >= 6 ? "🌟 धेरै राम्रो! फेरि अभ्यास गर्न सक्नुहुन्छ।" : "💪 राम्रो प्रयास! फेरि खेल्दा अझ राम्रो हुन्छ।";
          nextBtn.textContent = "फेरि खेलौँ ↻";
          nextBtn.hidden = false;
          nextBtn.onclick = startQuiz;
        }
      });

      render();
      startQuiz();
    })();
  </script>
</body>
</html>
