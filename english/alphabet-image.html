
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00BCD4">
  <title>ABCD Alphabet - बाल पाठशाला</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <script src="../script.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 15px; min-height: 100vh; text-align: center;
      font-family: 'Fredoka','Mukta',sans-serif;
      background: linear-gradient(180deg,#e0f7fa,#b2ebf2); color: #006064;
    }
    .header {
      max-width: 700px; margin: 0 auto 16px; padding: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: white; border-radius: 16px; box-shadow: 0 4px 12px #0001;
    }
    h1 { margin: 0; font-size: clamp(17px,4vw,24px); }
    .home-btn {
      padding: 8px 12px; border-radius: 10px; background: #00acc1;
      color: white; text-decoration: none; font-weight: 700; white-space: nowrap;
    }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
    .tab {
      padding: 10px 15px; border: 2px solid #4dd0e1; border-radius: 12px;
      color: #00838f; background: white; font-weight: 700; cursor: pointer;
    }
    .tab.active { background: #00acc1; color: white; }
    .grid {
      display: grid; grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 12px; max-width: 700px; margin: auto;
    }
    .card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; min-height: 155px; padding: 12px 8px;
      border: 3px solid #4dd0e1; border-radius: 18px; background: white;
      color: #006064; box-shadow: 0 5px 0 #00acc1; cursor: pointer;
    }
    .emoji { font-size: 48px; line-height: 1.2; }
    .letter { font-size: 29px; font-weight: 700; }
    .word { font-size: 16px; color: #00838f; }
    .card:active { transform: translateY(3px); box-shadow: 0 2px 0 #00acc1; }
    .hint { margin: 16px auto; font-size: 14px; }
    @media (min-width: 520px) { .grid { grid-template-columns: repeat(3,minmax(0,1fr)); } }
    @media (min-width: 740px) { .grid { grid-template-columns: repeat(4,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <header class="header">
    <a class="home-btn" href="../index.html">🏠 होम</a>
    <h1>ABCD Alphabet</h1>
  </header>

  <div class="tabs">
    <button class="tab active" data-type="upper" type="button">Capital A–Z</button>
    <button class="tab" data-type="lower" type="button">Small a–z</button>
  </div>

  <main class="grid" id="alphabetGrid"></main>
  <p class="hint">🔊 अक्षर र शब्द सुन्न कार्ड थिच्नुहोस्।</p>

  <script>
    (() => {
      "use strict";

      const data = [
        ["A","Apple","🍎"],["B","Ball","⚽"],["C","Cat","🐱"],
        ["D","Dog","🐶"],["E","Elephant","🐘"],["F","Fish","🐟"],
        ["G","Grapes","🍇"],["H","Horse","🐎"],["I","Ice cream","🍦"],
        ["J","Jug","🏺"],["K","Kite","🪁"],["L","Lion","🦁"],
        ["M","Monkey","🐒"],["N","Nest","🪺"],["O","Owl","🦉"],
        ["P","Parrot","🦜"],["Q","Queen","👑"],["R","Rose","🌹"],
        ["S","Sun","☀️"],["T","Tree","🌳"],["U","Umbrella","☂️"],
        ["V","Van","🚐"],["W","Watch","⌚"],["X","Xylophone","🎼"],
        ["Y","Yak","🐂"],["Z","Zebra","🦓"]
      ];

      const grid = document.getElementById("alphabetGrid");
      const tabs = [...document.querySelectorAll(".tab")];
      let type = "upper";

      function speak(text) {
        if (typeof window.playAIVoice === "function") {
          window.playAIVoice(text);
        }
      }

      function render() {
        grid.replaceChildren();

        data.forEach(([letter, word, emoji]) => {
          const shown = type === "upper" ? letter : letter.toLowerCase();
          const button = document.createElement("button");
          button.type = "button";
          button.className = "card";
          button.innerHTML =
            '<span class="emoji"></span>' +
            '<span class="letter"></span>' +
            '<span class="word"></span>';

          button.querySelector(".emoji").textContent = emoji;
          button.querySelector(".letter").textContent = shown;
          button.querySelector(".word").textContent = word;
          button.setAttribute("aria-label", shown + " for " + word);

          button.addEventListener("click", () => {
            speak(shown + " for " + word);
          });

          grid.appendChild(button);
        });
      }

      tabs.forEach(tab => {
        tab.addEventListener("click", () => {
          type = tab.dataset.type;
          tabs.forEach(item => item.classList.toggle("active", item === tab));
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
