<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>शरीरका अङ्गहरू - पाठशाला</title>
    <meta name="theme-color" content="#9C27B0">
    <!-- Child-friendly Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #F3E5F5 0%, #E1BEE7 100%);
            margin: 0;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #FFFFFF;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { 
            color: #7B1FA2; 
            margin: 0; 
            font-size: 20px; 
            font-weight: 800;
        }
        .home-btn {
            background-color: #AB47BC;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 3px 0 #6A1B9A;
            transition: all 0.1s ease;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Section Titles */
        .section-title {
            color: #6A1B9A;
            background: #FFFFFF;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 19px;
            font-weight: 800;
            margin: 20px auto 15px auto;
            max-width: 600px;
            border: 3px solid #CE93D8;
            box-shadow: 0 4px 0 #8E24AA;
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: auto;
        }

        /* 3D Soft Card Style */
        .card {
            background-color: #FFFFFF;
            color: #7B1FA2;
            border: 3px solid #CE93D8;
            border-radius: 18px;
            padding: 15px 10px;
            box-shadow: 0 6px 0 #8E24AA, 0 8px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8E24AA, 0 3px 6px rgba(0,0,0,0.1);
            background-color: #F3E5F5;
        }

        /* Large Emoji Style */
        .emoji-box {
            font-size: 55px;
            line-height: 1.1;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .np-name {
            font-size: 20px;
            font-weight: 800;
            color: #4A148C;
            line-height: 1.2;
        }

        .en-name {
            font-size: 14px;
            font-weight: 700;
            color: #7B1FA2;
            font-family: 'Fredoka', sans-serif;
        }
    </style>

    <!-- ElevenLabs को लागि script.js जोडिएको -->
    <script src="script.js"></script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>शरीरका अङ्गहरू (Body Parts)</h2>
    </div>

    <div class="section-title">👤 शरीरका मुख्य अङ्गहरू</div>
    <div class="grid-container" id="partsGrid"></div>

    <script>
        // शरीरका अङ्गहरूको सूची (नेपाली, अङ्ग्रेजी र Emoji)
        const bodyPartsData = [
            { np: 'टाउको', en: 'Head', emoji: '🗣️' },
            { np: 'कपाल', en: 'Hair', emoji: '💇' },
            { np: 'आँखा', en: 'Eye', emoji: '👁️' },
            { np: 'कान', en: 'Ear', emoji: '👂' },
            { np: 'नाक', en: 'Nose', emoji: '👃' },
            { np: 'मुख', en: 'Mouth', emoji: '👄' },
            { np: 'दाँत', en: 'Teeth', emoji: '🦷' },
            { np: 'जिब्रो', en: 'Tongue', emoji: '👅' },
            { np: 'हात', en: 'Hand', emoji: '✋' },
            { np: 'औंला', en: 'Fingers', emoji: '🤌' },
            { np: 'गोडा / खुट्टा', en: 'Leg', emoji: '🦵' },
            { np: 'पाइला', en: 'Foot', emoji: '🦶' },
            { np: 'छाती', en: 'Chest', emoji: '🫁' },
            { np: 'मुटु', en: 'Heart', emoji: '❤️' },
            { np: 'मस्तिष्क', en: 'Brain', emoji: '🧠' },
            { np: 'हाड / हड्डी', en: 'Bone', emoji: '🦴' }
        ];

        const partsGrid = document.getElementById('partsGrid');
        bodyPartsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="emoji-box">${item.emoji}</div>
                <div class="np-name">${item.np}</div>
                <div class="en-name">${item.en}</div>
            `;
            // अब पुरानोको साटो playAIVoice प्रयोग गरिन्छ
            card.addEventListener('click', () => playAIVoice(item.np));
            partsGrid.appendChild(card);
        });
    </script>

</body>
</html>
