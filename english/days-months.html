<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>वार र महिनाहरू - पाठशाला</title>
    <meta name="theme-color" content="#6C5CE7">
    <!-- Google Fonts for Playful Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Mukta', 'Fredoka', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F3F0FF 0%, #E8E3FF 100%);
            margin: 0;
            padding: 12px;
            text-align: center;
            min-height: 100vh;
        }

        /* Modern Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 650px;
            margin: 0 auto 16px auto;
            background: #FFFFFF;
            padding: 10px 18px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.12);
        }
        h2 { 
            color: #2D3436; 
            margin: 0; 
            font-size: 22px; 
            font-weight: 800;
        }
        .home-btn {
            background: linear-gradient(135deg, #6C5CE7, #8E7CFF);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 4px 0 #4B38B3;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .home-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #4B38B3;
        }

        /* Section Titles */
        .section-title {
            color: #FFFFFF;
            background: linear-gradient(135deg, #FF7675, #D63031);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 19px;
            font-weight: 800;
            margin: 25px auto 14px auto;
            max-width: 650px;
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.2);
            text-align: left;
        }

        /* Grid Container */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 650px;
            margin: auto;
        }
        @media (min-width: 480px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Card 3D Styling */
        .card {
            background-color: #FFFFFF;
            color: #2D3436;
            border: 2px solid #A29BFE;
            border-bottom: 5px solid #6C5CE7;
            border-radius: 16px;
            padding: 14px 10px;
            box-shadow: 0 6px 15px rgba(108, 92, 231, 0.08);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            font-size: 19px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
        }
        .card:hover {
            background-color: #F8F7FF;
        }
        .card:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
            background-color: #E0E7FF;
            color: #4C51BF;
        }

        /* Section Specific Colors */
        #nepaliDaysGrid .card {
            border-color: #74B9FF;
            border-bottom-color: #0984E3;
            color: #0984E3;
        }
        #nepaliDaysGrid .card:active {
            background-color: #E1F5FE;
        }

        #englishDaysGrid .card {
            border-color: #55E6C1;
            border-bottom-color: #58B19F;
            color: #118A7E;
        }
        #englishDaysGrid .card:active {
            background-color: #E0F2F1;
        }

        #nepaliMonthsGrid .card {
            border-color: #F8A5C2;
            border-bottom-color: #F78FB3;
            color: #C44569;
        }
        #nepaliMonthsGrid .card:active {
            background-color: #FCE4EC;
        }

        #englishMonthsGrid .card {
            border-color: #FDE047;
            border-bottom-color: #EAB308;
            color: #CA8A04;
        }
        #englishMonthsGrid .card:active {
            background-color: #FEF9C3;
        }
    </style>
    <script>
        function speakText(text, lang = 'ne-NP') {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = lang;
            speech.rate = 0.85;
            speech.pitch = 1.1;
            window.speechSynthesis.speak(speech);
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html" class="home-btn">🏠 होम</a>
        <h2>वार र महिनाहरू</h2>
    </div>

    <!-- नेपाली बार सेक्सन -->
    <div class="section-title">नेपाली बारहरू</div>
    <div class="grid-container" id="nepaliDaysGrid"></div>

    <!-- अंग्रेजी बार सेक्सन -->
    <div class="section-title">English Days of the Week</div>
    <div class="grid-container" id="englishDaysGrid"></div>

    <!-- नेपाली महिना सेक्सन -->
    <div class="section-title">नेपाली महिनाहरू (बैशाख - चैत)</div>
    <div class="grid-container" id="nepaliMonthsGrid"></div>

    <!-- अंग्रेजी महिना सेक्सन -->
    <div class="section-title">English Months</div>
    <div class="grid-container" id="englishMonthsGrid"></div>

    <script>
        // डेटा सूचीहरू
        const nepaliDays = ['आईतबार', 'सोमबार', 'मंगलबार', 'बुधबार', 'बिहीबार', 'शुक्रबार', 'शनिबार'];
        const englishDays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const nepaliMonths = ['बैशाख', 'जेठ', 'असार', 'साउन', 'भदौ', 'असोज', 'कार्तिक', 'मंसिर', 'पुष', 'माघ', 'फागुन', 'चैत'];
        const englishMonths = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        // जेनेरेट गर्ने फंक्सन
        function createCards(data, containerId, lang) {
            const container = document.getElementById(containerId);
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = item;
                card.addEventListener('click', () => speakText(item, lang));
                container.appendChild(card);
            });
        }

        // सबै लोड गर्ने
        createCards(nepaliDays, 'nepaliDaysGrid', 'ne-NP');
        createCards(englishDays, 'englishDaysGrid', 'en-US');
        createCards(nepaliMonths, 'nepaliMonthsGrid', 'ne-NP');
        createCards(englishMonths, 'englishMonthsGrid', 'en-US');
    </script>

</body>
</html>
