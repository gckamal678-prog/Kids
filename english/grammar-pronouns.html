<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Pronouns - Kids App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        h1 {
            color: #3399ff;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 5px;
        }
        @media (min-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .card {
            background: #2d2d2d;
            border: 2px solid #444;
            padding: 15px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card:active {
            transform: scale(0.95);
            background: #3d3d3d;
        }
        .word {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
        }
        .desc {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: 2px;
        }
        .icon {
            font-size: 30px;
        }
    </style>
</head>
<body>

    <h1>👤 Pronouns (Replacing Words) 👤</h1>
    <p class="subtitle">Tap any word to hear and learn!</p>

    <div class="grid-container">
        <div class="card" onclick="speakWord('He')"><div class="icon">👦</div><div class="word">He</div><div class="desc">For Boy</div></div>
        <div class="card" onclick="speakWord('She')"><div class="icon">👧</div><div class="word">She</div><div class="desc">For Girl</div></div>
        <div class="card" onclick="speakWord('It')"><div class="icon">🐱</div><div class="word">It</div><div class="desc">For Thing/Animal</div></div>
        <div class="card" onclick="speakWord('They')"><div class="icon">🧑‍🤝‍🧑</div><div class="word">They</div><div class="desc">For Many People</div></div>
        <div class="card" onclick="speakWord('We')"><div class="icon">👨‍👩‍👧‍👦</div><div class="word">We</div><div class="desc">You and Me</div></div>
        <div class="card" onclick="speakWord('You')"><div class="icon">👉</div><div class="word">You</div><div class="desc">The Person in front</div></div>
        <div class="card" onclick="speakWord('I')"><div class="icon">🙋‍♂️</div><div class="word">I</div><div class="desc">Myself</div></div>
    </div>

    <script>
        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Speech synthesis not supported in this browser.");
            }
        }
    </script>

</body>
</html>
