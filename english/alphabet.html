
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4A90E2">
  <title>English Alphabet - बाल पाठशाला</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Mukta:wght@700&display=swap" rel="stylesheet">
  <script src="../script.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; min-height: 100vh; text-align: center;
      font-family: 'Fredoka', 'Mukta', sans-serif;
      background: linear-gradient(180deg,#e3f2fd,#bbdefb); color: #1565c0;
    }
    .header {
      max-width: 650px; margin: 0 auto 18px; padding: 12px 15px;
      background: white; border-radius: 16px; box-shadow: 0 4px 12px #0001;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    h1 { font-size: clamp(18px,4vw,24px); margin: 0; }
    .home-btn {
      padding: 8px 12px; border-radius: 10px; background: #1e88e5;
      color: white; text-decoration: none; font-weight: 700; white-space: nowrap;
    }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
    .tab {
      border: 2px solid #90caf9; border-radius: 12px; background: white;
      color: #1565c0; padding: 10px 16px; font-weight: 700; cursor: pointer;
    }
    .tab.active { background: #1976d2; color: white; }
    .grid {
      display: grid; grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 12px; max-width: 650px; margin: auto;
    }
    .letter {
      border: 3px solid #64b5f6; border-radius: 17px; background: white;
      color: #1565c0; min-height: 86px; font: 700 42px 'Fredoka',sans-serif;
      box-shadow: 0 5px 0 #1e88e5; cursor: pointer;
    }
    .letter:active { transform: translateY(3px); box-shadow: 0 2px 0 #1e88e5; }
    .hint { color: #345; margin: 16px auto; font-size: 14px; }
    @media (min-width: 520px) { .grid { grid-template-columns: repeat(4,minmax(0,1fr)); } }
    @media (min-width: 720px) { .grid { grid-template-columns: repeat(6,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <header class="header">
    <a class="home-btn" href="../index.html">🏠 होम</a>
    <h1>English Alphabet A–Z</h1>
  </header>

  <div class="tabs" role="group" aria-label="Alphabet type">
    <button class="tab active" data-type="upper" type="button">Capital A–Z</button>
    <button class="tab" data-type="lower" type="button">Small a–z</button>
  </div>

  <main class="grid" id="alphabetGrid" aria-label="English letters"></main>
  <p class="hint">🔊 अक्षर थिच्नुहोस् र उच्चारण सुन्नुहोस्।</p>

  <script>
    (() => {
      "use strict";
      const grid = document.getElementById("alphabetGrid");
      const tabs = [...document.querySelectorAll(".tab")];
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      let type = "upper";

      function render() {
        grid.replaceChildren();

        letters.forEach(letter => {
          const shown = type === "upper" ? letter : letter.toLowerCase();
          const button = document.createElement("button");
          button.type = "button";
          button.className = "letter";
          button.textContent = shown;
          button.setAttribute("aria-label", "Play letter " + shown);

          button.addEventListener("click", () => {
            if (typeof window.playAIVoice === "function") {
              window.playAIVoice(shown);
            }
          });

          grid.appendChild(button);
        });
      }

      tabs.forEach(tab => {
        tab.addEventListener("click", () => {
          type = tab.dataset.type;
          tabs.forEach(item => item.classList.toggle("active", item === tab));
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
