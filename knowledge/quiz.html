
<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8ff">
  <meta name="description" content="बाल पाठशालाको रमाइलो बाल क्विज खेल।">
  <title>बाल क्विज | बाल पाठशाला</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7ff;
      --card: #ffffff;
      --text: #202d46;
      --muted: #69758d;
      --border: #e1e8f5;
      --blue: #4169e1;
      --blue-soft: #edf2ff;
      --green: #198754;
      --green-soft: #e3f7eb;
      --red: #c73535;
      --red-soft: #ffebeb;
      --orange: #a95600;
      --orange-soft: #fff0d9;
      --shadow: 0 12px 36px rgba(38, 58, 100, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      background:
        radial-gradient(circle at top left, #e3edff 0, transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans Devanagari",
        "Mukta", sans-serif;
      line-height: 1.55;
    }

    button, a { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid #f5a623;
      outline-offset: 3px;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: none;
      border-radius: 15px;
      background: #e2eaff;
      font-size: 25px;
    }

    .brand h1 { margin: 0; font-size: 19px; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

    .small-btn, .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
    }

    .quiz-card {
      padding: clamp(17px, 4vw, 28px);
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      padding: 11px 8px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fafbff;
      text-align: center;
    }

    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 3px; font-size: 21px; font-weight: 850; }
    .stat-value.score { color: var(--green); }
    .stat-value.timer { color: var(--orange); }

    .progress-area { margin-bottom: 19px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9eef8;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #4169e1, #30b78a);
      transition: width .3s linear;
    }

    .question-label {
      margin-bottom: 8px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
    }

    .question {
      min-height: 76px;
      margin: 0 0 12px;
      font-size: clamp(21px, 4.5vw, 29px);
      font-weight: 850;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .question-image {
      display: none;
      width: min(180px, 60%);
      height: 150px;
      margin: 0 auto 16px;
      object-fit: contain;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
    }

    .sound-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 18px;
    }

    .sound-btn {
      min-height: 42px;
      padding: 9px 13px;
      border: 1px solid #dbe4ff;
      border-radius: 13px;
      background: var(--blue-soft);
      color: #294ca9;
      font-weight: 750;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      min-height: 66px;
      padding: 13px;
      border: 2px solid #dbe5fa;
      border-radius: 16px;
      background: #f7f9ff;
      color: var(--text);
      text-align: left;
      font-weight: 750;
      overflow-wrap: anywhere;
      transition: border-color .15s, background .15s, transform .15s;
    }

    .option:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #8ba6fa;
    }

    .option-letter {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      flex: none;
      border-radius: 10px;
      background: #e5ebfb;
      color: #3456b7;
      font-size: 13px;
    }

    .option.correct {
      border-color: #2e9a62;
      background: var(--green-soft);
      color: #145c36;
    }

    .option.correct .option-letter {
      background: #c5eed5;
      color: #145c36;
    }

    .option.wrong {
      border-color: #d84a4a;
      background: var(--red-soft);
      color: #9e2020;
    }

    .option.wrong .option-letter {
      background: #ffd2d2;
      color: #9e2020;
    }

    .option:disabled { cursor: default; opacity: 1; }

    .feedback {
      min-height: 54px;
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fafbff;
      color: var(--muted);
      font-weight: 700;
    }

    .feedback.success {
      border-color: #b8e8ca;
      background: var(--green-soft);
      color: #145c36;
    }

    .feedback.error {
      border-color: #ffd0d0;
      background: var(--red-soft);
      color: #9e2020;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .home-btn { color: var(--blue); }
    .next-btn {
      min-height: 46px;
      padding: 11px 17px;
      border: 0;
      border-radius: 14px;
      background: var(--blue);
      color: white;
      font-weight: 800;
    }

    .next-btn:disabled { cursor: default; opacity: .45; }

    .footer-note {
      margin: 18px 0 4px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .hidden { display: none !important; }

    @media (max-width: 460px) {
      body { padding: 12px; }
      .brand h1 { font-size: 16px; }
      .brand-icon { width: 40px; height: 40px; }
      .topbar { align-items: flex-start; }
      .small-btn { padding: 8px 10px; font-size: 13px; }
      .options { grid-template-columns: 1fr; gap: 9px; }
      .option { min-height: 56px; }
      .stats { gap: 7px; }
      .stat { padding: 9px 4px; }
      .stat-value { font-size: 19px; }
      .bottom-row { align-items: stretch; }
      .bottom-row > * { flex: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🧠</div>
        <div>
          <h1>बाल क्विज</h1>
          <p>खेल्दै सिकौँ, सिक्दै रमाऔँ!</p>
        </div>
      </div>
      <button id="sound-toggle" class="small-btn" type="button"
        aria-pressed="true">🔊 आवाज चालु</button>
    </header>

    <section class="quiz-card" aria-label="क्विज खेल">
      <div class="stats">
        <div class="stat">
          <div class="stat-label">🏆 आजको अङ्क</div>
          <div class="stat-value score" id="score">०</div>
        </div>
        <div class="stat">
          <div class="stat-label">⭐ स्टार</div>
          <div class="stat-value" id="stars">०</div>
        </div>
        <div class="stat">
          <div class="stat-label">⏳ बाँकी समय</div>
          <div class="stat-value timer"><span id="timer">१५</span>s</div>
        </div>
      </div>

      <div class="progress-area">
        <div class="progress-label">
          <span>आजको सिकाइ लक्ष्य</span>
          <span id="goal-text">० / १०</span>
        </div>
        <div class="progress-track" role="progressbar"
          aria-label="दैनिक क्विज लक्ष्य" aria-valuemin="0"
          aria-valuemax="100" aria-valuenow="0" id="goal-progress">
          <div class="progress-fill" id="goal-fill"></div>
        </div>
      </div>

      <div class="question-label" id="question-label">प्रश्न तयार हुँदैछ...</div>
      <h2 class="question" id="question" aria-live="polite">कृपया पर्खनुहोस्...</h2>

      <img class="question-image" id="question-image" alt="प्रश्नसँग सम्बन्धित चित्र">

      <div class="sound-row">
        <button class="sound-btn" id="repeat-btn" type="button">
          🔊 प्रश्न फेरि सुनौँ
        </button>
      </div>

      <div class="options" id="options" aria-label="उत्तरका विकल्प"></div>

      <div class="feedback" id="feedback" aria-live="polite">
        सही उत्तर छानेर अङ्क कमाउनुहोस्। 😊
      </div>

      <div class="bottom-row">
        <a class="home-btn" href="../index.html">⬅ गृहपृष्ठ</a>
        <button class="next-btn" id="next-btn" type="button" disabled>
          अर्को प्रश्न ➜
        </button>
      </div>
    </section>

    <p class="footer-note">
      सही उत्तर दिएर स्टार कमाउनुहोस्। गल्ती भए पनि फेरि प्रयास गर्न सकिन्छ! 🌱
    </p>
  </main>

  <script src="../script.js"></script>
  <script>
    "use strict";

    const $ = (selector) => document.querySelector(selector);

    const questions = [
      { q: "'म्याउँ म्याउँ' आवाज कुन जनावरले निकाल्छ?", options: ["कुकुर", "बिरालो", "गाई", "बाख्रा"], answer: 1 },
      { q: "'कुखुरी काँ' भनेर कसले बास्छ?", options: ["भाले कुखुरा", "सुगा", "ढुकुर", "काग"], answer: 0 },
      { q: "डोरेमोनलाई मन पर्ने खानेकुरा के हो?", options: ["मोमो", "डोरायाकी", "पिज्जा", "स्याउ"], answer: 1 },
      { q: "समोसाको आकार कस्तो हुन्छ?", options: ["गोलो", "त्रिकोण", "चौकोन", "अण्डाकार"], answer: 1 },
      { q: "नेपालको झण्डामा कुन रङहरू छन्?", options: ["रातो, नीलो र सेतो", "पहेंलो र हरियो", "कालो र सेतो", "गुलाबी र नीलो"], answer: 0 },
      { q: "'भौ भौ' गरेर घरको रक्षा कसले गर्छ?", options: ["बिरालो", "कुकुर", "स्याल", "बाघ"], answer: 1 },
      { q: "बालबालिकाले दिनमा देख्ने सूर्य प्रायः कस्तो देखिन्छ?", options: ["पहेंलो/सुनौलो", "नीलो", "कालो", "गुलाबी"], answer: 0 },
      { q: "'क' बाट सुरु हुने शब्द कुन हो?", options: ["कमल", "खरायो", "गमला", "घर"], answer: 0 },
      { q: "नेपालको राष्ट्रिय जनावर कुन हो?", options: ["बाघ", "गाई", "हात्ती", "कुकुर"], answer: 1 },
      { q: "२ + ३ कति हुन्छ?", options: ["४", "५", "६", "७"], answer: 1 },
      { q: "एक हप्तामा कति दिन हुन्छन्?", options: ["५", "६", "७", "८"], answer: 2 },
      { q: "English alphabet को पहिलो अक्षर कुन हो?", options: ["B", "C", "A", "D"], answer: 2 },
      { q: "गाईले हामीलाई के दिन्छ?", options: ["दूध", "पेट्रोल", "कागज", "ढुङ्गा"], answer: 0 },
      { q: "एक वर्षमा कति महिना हुन्छन्?", options: ["१०", "११", "१२", "१३"], answer: 2 },
      { q: "रातमा आकाशमा के देख्न सकिन्छ?", options: ["तारा", "समुद्र", "सडक", "किताब"], answer: 0 },
      { q: "५ - २ कति हुन्छ?", options: ["२", "३", "४", "५"], answer: 1 },
      { q: "पानी पिउन कुन अङ्ग प्रयोग गर्छौँ?", options: ["नाक", "कान", "मुख", "घुँडा"], answer: 2 },
      { q: "English मा 'स्याउ' लाई के भनिन्छ?", options: ["Apple", "Banana", "Mango", "Orange"], answer: 0 },
      { q: "रातो रङको फल कुन हो?", options: ["स्याउ", "काउली", "काक्रो", "आलु"], answer: 0 },
      { q: "२ × ३ कति हुन्छ?", options: ["५", "६", "७", "८"], answer: 1 }
    ];

    const DAILY_KEY = "quiz_daily_score";
    const DAILY_DATE_KEY = "quiz_daily_date";
    const TOTAL_KEY = "quiz_all_time_score";
    const LEGACY_SCORE_KEY = "quiz_total_score";
    const PLAYED_KEY = "quiz_played_count";
    const TARGET_KEY = "app_daily_target";

    let score = 0;
    let allTimeScore = 0;
    let target = 10;
    let currentQuestion = null;
    let currentQuestionText = "";
    let timeLeft = 15;
    let timerInterval = null;
    let answering = false;
    let soundEnabled = true;
    let questionNumber = 0;
    let audioContext = null;
    let lastQuestionIndex = -1;

    function getNumber(key, fallback = 0) {
      try {
        const value = Number.parseInt(localStorage.getItem(key) || "", 10);
        return Number.isFinite(value) && value >= 0 ? value : fallback;
      } catch (_) {
        return fallback;
      }
    }

    function store(key, value) {
      try {
        localStorage.setItem(key, String(value));
        return true;
      } catch (_) {
        $("#feedback").textContent =
          "ब्राउजरमा अङ्क सेभ हुन सकेन। Storage सेटिङ जाँच्नुहोस्।";
        return false;
      }
    }

    function todayKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function loadScores() {
      const today = todayKey();
      let savedDate = "";

      try {
        savedDate = localStorage.getItem(DAILY_DATE_KEY) || "";
      } catch (_) {}

      if (savedDate !== today) {
        score = 0;
        store(DAILY_KEY, 0);
        store(DAILY_DATE_KEY, today);
        // Keep the homepage's displayed target in sync with today's score.
        store(LEGACY_SCORE_KEY, 0);
      } else {
        score = getNumber(DAILY_KEY, getNumber(LEGACY_SCORE_KEY, 0));
      }

      allTimeScore = getNumber(TOTAL_KEY, 0);
      target = [5, 10, 15, 20].includes(getNumber(TARGET_KEY, 10))
        ? getNumber(TARGET_KEY, 10)
        : 10;

      // Support an existing saved score on an older installation.
      if (savedDate === "" && score === 0) {
        const legacy = getNumber(LEGACY_SCORE_KEY, 0);
        if (legacy > 0) {
          score = legacy;
          store(DAILY_KEY, score);
          store(DAILY_DATE_KEY, today);
        }
      }

      renderScores();
    }

    function renderScores() {
      $("#score").textContent = nepaliDigits(score);
      $("#stars").textContent = nepaliDigits(Math.floor(score / 5));
      $("#goal-text").textContent = `${nepaliDigits(score)} / ${nepaliDigits(target)}`;

      const percent = Math.min(100, Math.round((score / target) * 100));
      $("#goal-fill").style.width = `${percent}%`;
      $("#goal-progress").setAttribute("aria-valuenow", String(percent));
    }

    function nepaliDigits(value) {
      return String(value).replace(/[0-9]/g, (digit) =>
        "०१२३४५६७८९"[Number(digit)]
      );
    }

    function speak(text, callback) {
      if (!soundEnabled) {
        if (typeof callback === "function") callback();
        return;
      }

      if (typeof window.playVoice === "function") {
        try {
          window.playVoice(text, callback);
          return;
        } catch (error) {
          console.warn("Voice helper failed:", error);
        }
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = /[\u0900-\u097F]/.test(text) ? "ne-NP" : "en-US";
        utterance.rate = 0.88;
        utterance.onend = () => {
          if (typeof callback === "function") callback();
        };
        utterance.onerror = () => {
          if (typeof callback === "function") callback();
        };
        window.speechSynthesis.speak(utterance);
      } else if (typeof callback === "function") {
        callback();
      }
    }

    function stopVoice() {
      if (typeof window.stopVoice === "function") {
        window.stopVoice();
      } else if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    function playSound(type) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        if (!audioContext) audioContext = new AudioContextClass();
        if (audioContext.state === "suspended") audioContext.resume();

        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        if (type === "correct") {
          oscillator.frequency.setValueAtTime(523.25, now);
          oscillator.frequency.setValueAtTime(659.25, now + 0.12);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          oscillator.start(now);
          oscillator.stop(now + 0.32);
        } else {
          oscillator.frequency.setValueAtTime(260, now);
          oscillator.frequency.setValueAtTime(190, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          oscillator.start(now);
          oscillator.stop(now + 0.28);
        }
      } catch (_) {
        // Sound effects are optional; quiz must still work without them.
      }
    }

    function stopTimer() {
      if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function startTimer() {
      stopTimer();
      timeLeft = 15;
      updateTimer();

      timerInterval = setInterval(() => {
        if (answering) {
          stopTimer();
          return;
        }

        timeLeft--;
        updateTimer();

        if (timeLeft <= 0) {
          stopTimer();
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimer() {
      $("#timer").textContent = nepaliDigits(Math.max(0, timeLeft));
      $("#timer").style.color = timeLeft <= 5 ? "#c73535" : "";
      $("#progress-fill");
    }

    function chooseQuestion() {
      if (questions.length < 2) return questions[0];

      let index = Math.floor(Math.random() * questions.length);
      if (index === lastQuestionIndex) {
        index = (index + 1 + Math.floor(Math.random() * (questions.length - 1)))
          % questions.length;
      }
      lastQuestionIndex = index;
      return questions[index];
    }

    function loadQuestion() {
      stopTimer();
      stopVoice();
      answering = false;
      currentQuestion = chooseQuestion();
      currentQuestionText = currentQuestion.q;
      questionNumber++;

      $("#question-label").textContent =
        `प्रश्न ${nepaliDigits(questionNumber)} · सही उत्तर छान्नुहोस्`;
      $("#question").textContent = currentQuestion.q;

      const image = $("#question-image");
      image.removeAttribute("src");
      image.style.display = "none";

      const options = $("#options");
      options.replaceChildren();

      const letters = ["क", "ख", "ग", "घ"];

      currentQuestion.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option";
        button.dataset.index = String(index);

        const letter = document.createElement("span");
        letter.className = "option-letter";
        letter.textContent = letters[index];

        const text = document.createElement("span");
        text.textContent = option;

        button.append(letter, text);
        button.addEventListener("click", () => checkAnswer(index, button));
        options.appendChild(button);
      });

      $("#feedback").className = "feedback";
      $("#feedback").textContent = "सही उत्तर छानेर अङ्क कमाउनुहोस्। 😊";
      $("#next-btn").disabled = true;

      startTimer();
      speak(currentQuestion.q);
    }

    function disableOptions() {
      document.querySelectorAll(".option").forEach((button) => {
        button.disabled = true;
      });
    }

    function saveCorrectAnswer() {
      score++;
      allTimeScore++;

      store(DAILY_KEY, score);
      store(DAILY_DATE_KEY, todayKey());
      store(LEGACY_SCORE_KEY, score);
      store(TOTAL_KEY, allTimeScore);

      renderScores();
    }

    function incrementPlayedCount() {
      const played = getNumber(PLAYED_KEY, 0);
      store(PLAYED_KEY, played + 1);
    }

    function checkAnswer(selectedIndex, selectedButton) {
      if (answering || !currentQuestion) return;

      answering = true;
      stopTimer();
      disableOptions();
      incrementPlayedCount();

      const correctIndex = currentQuestion.answer;
      const buttons = Array.from(document.querySelectorAll(".option"));
      const feedback = $("#feedback");

      if (selectedIndex === correctIndex) {
        selectedButton.classList.add("correct");
        playSound("correct");
        saveCorrectAnswer();

        feedback.className = "feedback success";
        feedback.textContent = score >= target
          ? "🎉 स्याबास! आजको लक्ष्य पूरा भयो! अर्को प्रश्न पनि खेलौँ।"
          : "🎉 स्याबास! सही उत्तर। तपाईंले १ अङ्क पाउनुभयो!";

        speak("स्याबास! सही उत्तर दिनुभयो।");
      } else {
        selectedButton.classList.add("wrong");
        if (buttons[correctIndex]) {
          buttons[correctIndex].classList.add("correct");
        }

        playSound("wrong");
        feedback.className = "feedback error";
        feedback.textContent =
          `फेरि प्रयास गरौँ! सही उत्तर: ${currentQuestion.options[correctIndex]}`;

        speak("उत्तर मिलेन। सही उत्तर हेर्नुहोस् र अर्को प्रश्नमा प्रयास गर्नुहोस्।");
      }

      $("#next-btn").disabled = false;
      $("#next-btn").focus({ preventScroll: true });
    }

    function handleTimeout() {
      if (answering || !currentQuestion) return;

      answering = true;
      disableOptions();
      incrementPlayedCount();

      const correct = currentQuestion.options[currentQuestion.answer];
      const buttons = Array.from(document.querySelectorAll(".option"));

      if (buttons[currentQuestion.answer]) {
        buttons[currentQuestion.answer].classList.add("correct");
      }

      $("#feedback").className = "feedback error";
      $("#feedback").textContent =
        `⏰ समय सकियो! सही उत्तर: ${correct}`;

      playSound("wrong");
      $("#next-btn").disabled = false;
      speak("समय सकियो। अर्को प्रश्न प्रयास गर्नुहोस्।");
    }

    $("#repeat-btn").addEventListener("click", () => {
      if (currentQuestionText) speak(currentQuestionText);
    });

    $("#next-btn").addEventListener("click", () => {
      loadQuestion();
    });

    $("#sound-toggle").addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      $("#sound-toggle").textContent = soundEnabled
        ? "🔊 आवाज चालु"
        : "🔇 आवाज बन्द";
      $("#sound-toggle").setAttribute("aria-pressed", String(soundEnabled));

      if (!soundEnabled) stopVoice();
      else if (currentQuestionText) speak(currentQuestionText);
    });

    window.addEventListener("storage", (event) => {
      if (event.key === TARGET_KEY) {
        target = [5, 10, 15, 20].includes(Number(event.newValue))
          ? Number(event.newValue)
          : 10;
        renderScores();
      }
    });

    window.addEventListener("pagehide", () => {
      stopTimer();
      stopVoice();
      if (audioContext && audioContext.state !== "closed") {
        audioContext.close().catch(() => {});
      }
    });

    loadScores();
    loadQuestion();
  </script>
</body>
</html>
