
<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf7ff">
  <meta name="description" content="बालबालिकाका लागि अक्षर ट्रेस गर्ने र चित्र कोर्ने अभ्यास बोर्ड।">
  <title>चित्र कोर्ने बोर्ड | बाल पाठशाला</title>

  <style>
    :root {
      --primary: #1769e0;
      --green: #16834a;
      --ink: #183153;
      --surface: #ffffff;
      --page: #eef7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(145deg, #e5f5ff, #fff8e7);
      font-family: "Noto Sans Devanagari", "Mukta", system-ui, sans-serif;
    }

    button, input { font: inherit; }
    button { touch-action: manipulation; }

    .app {
      width: min(100%, 760px);
      margin: auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid #dbeafe;
      border-radius: 18px;
      box-shadow: 0 5px 18px #17365d12;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 4vw, 28px);
      color: #d84a19;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #526780;
      font-size: 13px;
    }

    .home {
      flex-shrink: 0;
      padding: 9px 12px;
      border-radius: 11px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-weight: 800;
    }

    .panel {
      margin-bottom: 14px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid #dce8f5;
      border-radius: 18px;
      box-shadow: 0 5px 18px #17365d0c;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .template-list, .palette, .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .template-btn, .action-btn {
      min-height: 42px;
      padding: 8px 13px;
      border: 2px solid #d4e3f6;
      border-radius: 12px;
      background: #f8fbff;
      color: #244263;
      font-weight: 750;
      cursor: pointer;
    }

    .template-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 3px solid #ffb020;
      outline-offset: 3px;
    }

    .canvas-panel {
      padding: 10px;
      overflow: hidden;
      background: white;
      border: 3px solid #80d6a1;
      border-radius: 18px;
      box-shadow: 0 8px 22px #17365d14;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 10;
      background: white;
      border: 2px dashed #b4c7d8;
      border-radius: 10px;
      touch-action: none;
      cursor: crosshair;
    }

    .hint {
      margin: 10px 4px 2px;
      color: #61748a;
      text-align: center;
      font-size: 13px;
    }

    .palette {
      justify-content: flex-start;
      align-items: center;
    }

    .color-btn {
      width: 39px;
      height: 39px;
      padding: 0;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #c8d5e4;
      cursor: pointer;
    }

    .color-btn[aria-pressed="true"] {
      outline: 3px solid #243e5c;
      outline-offset: 2px;
    }

    .custom-color {
      width: 42px;
      height: 42px;
      padding: 2px;
      border: 1px solid #c8d5e4;
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .range-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-weight: 750;
    }

    input[type="range"] {
      width: min(100%, 230px);
      accent-color: var(--primary);
    }

    .size-value {
      min-width: 28px;
      color: #526780;
    }

    .action-btn {
      background: #f3f7fc;
    }

    .action-btn.selected {
      background: #fff0cf;
      border-color: #f4ad32;
    }

    .undo-btn { color: #175bb6; }
    .eraser-btn { color: #a45a00; }
    .clear-btn { color: #b42318; }
    .save-btn {
      color: white;
      background: var(--green);
      border-color: var(--green);
    }

    .status {
      min-height: 24px;
      margin: 12px 2px 0;
      color: #35614b;
      text-align: center;
      font-size: 14px;
    }

    .footer {
      padding: 10px;
      color: #63758a;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .header { padding: 12px; }
      .home { padding: 8px; font-size: 13px; }
      .panel { padding: 12px; }
      .controls { grid-template-columns: 1fr; }
      .range-wrap { justify-content: space-between; }
      input[type="range"] { flex: 1; min-width: 100px; }
      .template-btn { padding: 7px 11px; }
      .action-btn { flex: 1 1 42%; }
    }

    @media (prefers-reduced-motion: no-preference) {
      button { transition: background-color .15s, transform .15s; }
      button:active { transform: scale(.97); }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>🎨 चित्र कोर्ने बोर्ड</h1>
        <p class="subtitle">खेल्दै सिकौँ, लेख्दै सिकौँ!</p>
      </div>
      <a class="home" href="../index.html">🏠 होम</a>
    </header>

    <section class="panel" aria-labelledby="practice-title">
      <h2 class="section-title" id="practice-title">१. अभ्यासका लागि छान्नुहोस्</h2>
      <div class="template-list" id="templateList">
        <button class="template-btn active" type="button" data-text="">खाली पाटी</button>
        <button class="template-btn" type="button" data-text="क">क</button>
        <button class="template-btn" type="button" data-text="ख">ख</button>
        <button class="template-btn" type="button" data-text="ग">ग</button>
        <button class="template-btn" type="button" data-text="म">म</button>
        <button class="template-btn" type="button" data-text="१">१</button>
        <button class="template-btn" type="button" data-text="२">२</button>
        <button class="template-btn" type="button" data-text="A">A</button>
        <button class="template-btn" type="button" data-text="B">B</button>
        <button class="template-btn" type="button" data-text="😊">😊</button>
      </div>
    </section>

    <section class="canvas-panel" aria-label="चित्र कोर्ने क्षेत्र">
      <canvas id="paintCanvas" width="900" height="1000"
              aria-label="औँला वा माउसले चित्र कोर्नुहोस्"></canvas>
      <p class="hint">फिक्का अक्षरमाथि औँला वा माउस चलाएर अभ्यास गर्नुहोस्।</p>
    </section>

    <section class="panel">
      <h2 class="section-title">२. आफ्नो मनपर्ने रङ छान्नुहोस्</h2>
      <div class="palette" id="palette">
        <button class="color-btn" type="button" style="background:#ef4444"
          data-color="#ef4444" aria-label="रातो रङ" aria-pressed="true"></button>
        <button class="color-btn" type="button" style="background:#2563eb"
          data-color="#2563eb" aria-label="निलो रङ" aria-pressed="false"></button>
        <button class="color-btn" type="button" style="background:#16a34a"
          data-color="#16a34a" aria-label="हरियो रङ" aria-pressed="false"></button>
        <button class="color-btn" type="button" style="background:#facc15"
          data-color="#facc15" aria-label="पहेंलो रङ" aria-pressed="false"></button>
        <button class="color-btn" type="button" style="background:#9333ea"
          data-color="#9333ea" aria-label="बैजनी रङ" aria-pressed="false"></button>
        <button class="color-btn" type="button" style="background:#111827"
          data-color="#111827" aria-label="कालो रङ" aria-pressed="false"></button>
        <label for="customColor" class="hint">आफ्नो रङ:</label>
        <input class="custom-color" type="color" id="customColor"
          value="#ef4444" aria-label="आफ्नो रङ छान्नुहोस्">
      </div>
    </section>

    <section class="panel">
      <h2 class="section-title">३. ब्रस र अन्य उपकरण</h2>

      <div class="controls">
        <label class="range-wrap" for="brushSize">
          <span>🖌️ ब्रसको आकार</span>
          <input type="range" id="brushSize" min="3" max="45" value="12">
          <output class="size-value" id="sizeValue" for="brushSize">12</output>
        </label>

        <button class="action-btn eraser-btn" type="button" id="eraserBtn"
          aria-pressed="false">🧽 Рबर</button>
      </div>

      <div class="actions" style="margin-top:14px">
        <button class="action-btn undo-btn" type="button" id="undoBtn">↩️ Undo</button>
        <button class="action-btn" type="button" id="redoBtn">↪️ Redo</button>
        <button class="action-btn clear-btn" type="button" id="clearBtn">🗑️ मेट्नुहोस्</button>
        <button class="action-btn save-btn" type="button" id="saveBtn">📥 PNG सेभ</button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite">
        तयार छ! अब चित्र कोर्न सुरु गर्नुहोस्।
      </p>
    </section>

    <footer class="footer">
      बाल पाठशाला · सिकाइ रमाइलो बनाऔँ 💚
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("paintCanvas");
      const ctx = canvas.getContext("2d");

      const templateList = document.getElementById("templateList");
      const palette = document.getElementById("palette");
      const brushSize = document.getElementById("brushSize");
      const sizeValue = document.getElementById("sizeValue");
      const eraserBtn = document.getElementById("eraserBtn");
      const undoBtn = document.getElementById("undoBtn");
      const redoBtn = document.getElementById("redoBtn");
      const clearBtn = document.getElementById("clearBtn");
      const saveBtn = document.getElementById("saveBtn");
      const customColor = document.getElementById("customColor");
      const status = document.getElementById("status");

      let currentColor = "#ef4444";
      let currentText = "";
      let isEraser = false;
      let isDrawing = false;
      let activePointerId = null;
      let lastPoint = null;

      const undoStack = [];
      const redoStack = [];
      const MAX_HISTORY = 25;

      function announce(message) {
        status.textContent = message;
      }

      function drawGuide() {
        if (!currentText) return;

        ctx.save();
        ctx.fillStyle = "#e0e7ef";
        ctx.strokeStyle = "#b8c6d6";
        ctx.lineWidth = 5;
        ctx.setLineDash([12, 12]);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const fontFamily =
          '"Noto Sans Devanagari", "Mukta", system-ui, sans-serif';

        let fontSize = 430;
        ctx.font = `800 ${fontSize}px ${fontFamily}`;

        while (ctx.measureText(currentText).width > canvas.width * 0.82 &&
               fontSize > 100) {
          fontSize -= 20;
          ctx.font = `800 ${fontSize}px ${fontFamily}`;
        }

        const x = canvas.width / 2;
        const y = canvas.height / 2;

        ctx.fillText(currentText, x, y);
        ctx.strokeText(currentText, x, y);
        ctx.restore();
      }

      function paintBase() {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        drawGuide();
      }

      function snapshot() {
        try {
          undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
          if (undoStack.length > MAX_HISTORY) undoStack.shift();
          redoStack.length = 0;
          updateHistoryButtons();
        } catch (error) {
          announce("Undo इतिहास सुरक्षित गर्न सकिएन।");
        }
      }

      function restoreImage(imageData) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.putImageData(imageData, 0, 0);
        ctx.restore();
      }

      function updateHistoryButtons() {
        undoBtn.disabled = undoStack.length === 0;
        redoBtn.disabled = redoStack.length === 0;
        undoBtn.style.opacity = undoBtn.disabled ? ".55" : "1";
        redoBtn.style.opacity = redoBtn.disabled ? ".55" : "1";
      }

      function selectTemplate(text, selectedButton) {
        if (isDrawing) finishDrawing();

        currentText = text;
        templateList.querySelectorAll(".template-btn").forEach(button => {
          const active = button === selectedButton;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });

        undoStack.length = 0;
        redoStack.length = 0;
        paintBase();
        updateHistoryButtons();
        announce(text ? `अब "${text}" अक्षरको अभ्यास गर्नुहोस्।` :
          "खाली पाटी तयार भयो।");
      }

      templateList.addEventListener("click", event => {
        const button = event.target.closest("button[data-text]");
        if (button) selectTemplate(button.dataset.text, button);
      });

      function selectColor(color, selectedButton = null) {
        currentColor = color;
        isEraser = false;
        eraserBtn.classList.remove("selected");
        eraserBtn.setAttribute("aria-pressed", "false");

        palette.querySelectorAll("[data-color]").forEach(button => {
          button.setAttribute("aria-pressed", String(button === selectedButton));
        });

        customColor.value = color;
        announce("रङ परिवर्तन भयो।");
      }

      palette.addEventListener("click", event => {
        const button = event.target.closest("[data-color]");
        if (button) selectColor(button.dataset.color, button);
      });

      customColor.addEventListener("input", () => {
        selectColor(customColor.value);
      });

      eraserBtn.addEventListener("click", () => {
        isEraser = !isEraser;
        eraserBtn.classList.toggle("selected", isEraser);
        eraserBtn.setAttribute("aria-pressed", String(isEraser));
        announce(isEraser ? "रबर चलाउन तयार छ।" : "ब्रस चलाउन तयार छ।");
      });

      brushSize.addEventListener("input", () => {
        sizeValue.value = brushSize.value;
        sizeValue.textContent = brushSize.value;
      });

      function getPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * canvas.width / rect.width,
          y: (event.clientY - rect.top) * canvas.height / rect.height
        };
      }

      function startDrawing(event) {
        if (isDrawing) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;

        event.preventDefault();
        snapshot();

        isDrawing = true;
        activePointerId = event.pointerId;
        lastPoint = getPoint(event);

        try { canvas.setPointerCapture(event.pointerId); } catch (_) {}

        ctx.beginPath();
        ctx.moveTo(lastPoint.x, lastPoint.y);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = Number(brushSize.value);
        ctx.strokeStyle = isEraser ? "#ffffff" : currentColor;

        // Чाँडो थिचेर छोड्दा पनि सानो बिन्दु देखियोस्।
        ctx.lineTo(lastPoint.x + 0.01, lastPoint.y + 0.01);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(lastPoint.x, lastPoint.y);
      }

      function draw(event) {
        if (!isDrawing || event.pointerId !== activePointerId) return;
        event.preventDefault();

        const point = getPoint(event);
        ctx.lineTo(point.x, point.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(point.x, point.y);
        lastPoint = point;
      }

      function finishDrawing(event) {
        if (!isDrawing) return;
        if (event && event.pointerId !== activePointerId) return;

        isDrawing = false;

        try {
          if (activePointerId !== null &&
              canvas.hasPointerCapture(activePointerId)) {
            canvas.releasePointerCapture(activePointerId);
          }
        } catch (_) {}

        activePointerId = null;
        lastPoint = null;
        ctx.beginPath();
        updateHistoryButtons();
      }

      canvas.addEventListener("pointerdown", startDrawing);
      canvas.addEventListener("pointermove", draw);
      canvas.addEventListener("pointerup", finishDrawing);
      canvas.addEventListener("pointercancel", finishDrawing);
      canvas.addEventListener("lostpointercapture", () => {
        isDrawing = false;
        activePointerId = null;
        lastPoint = null;
        ctx.beginPath();
      });

      undoBtn.addEventListener("click", () => {
        if (!undoStack.length) return;

        try {
          redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
          restoreImage(undoStack.pop());
          updateHistoryButtons();
          announce("अघिल्लो काम फिर्ता गरियो।");
        } catch (_) {
          announce("Undo गर्न सकिएन। फेरि प्रयास गर्नुहोस्।");
        }
      });

      redoBtn.addEventListener("click", () => {
        if (!redoStack.length) return;

        try {
          undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
          restoreImage(redoStack.pop());
          updateHistoryButtons();
          announce("फिर्ता गरिएको काम पुनः ल्याइयो।");
        } catch (_) {
          announce("Redo गर्न सकिएन। फेरि प्रयास गर्नुहोस्।");
        }
      });

      clearBtn.addEventListener("click", () => {
        if (isDrawing) finishDrawing();

        snapshot();
        paintBase();
        announce("पाटी सफा भयो। अभ्यासको अक्षर देखिइरहन्छ।");
      });

      saveBtn.addEventListener("click", () => {
        try {
          const exportCanvas = document.createElement("canvas");
          exportCanvas.width = canvas.width;
          exportCanvas.height = canvas.height;

          const exportCtx = exportCanvas.getContext("2d");
          exportCtx.fillStyle = "#ffffff";
          exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
          exportCtx.drawImage(canvas, 0, 0);

          const link = document.createElement("a");
          link.download = "bal-pathshala-drawing.png";
          link.href = exportCanvas.toDataURL("image/png");
          document.body.appendChild(link);
          link.click();
          link.remove();

          announce("चित्र PNG फोटोका रूपमा सेभ गर्न पठाइयो।");
        } catch (_) {
          announce("फोटो सेभ हुन सकेन। ब्राउजरको अनुमति जाँच्नुहोस्।");
        }
      });

      // सुरुमा खाली, सेतो पाटी।
      paintBase();
      updateHistoryButtons();
    })();
  </script>
</body>
</html>
